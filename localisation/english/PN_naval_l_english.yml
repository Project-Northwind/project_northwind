 etajima_naval_academy: "Naval Academy Etajima"
 etajima_naval_academy_desc: "The Imperial Japanese Naval Academy was founded in Nagasaki, 1866, and moved to Etajima in 1888. It is one of the most famous naval colleges in the world, cultivating hundreds of experienced naval officers for the Japanese Navy every year."
 annapolis_naval_academy: "Annapolis Naval Academy"
 annapolis_naval_academy_desc: "Located in Annapolis, Maryland, the US Naval Academy has a long history dated back to decades ago. The school encourages cadets to establish strategic visions around seapower through comprehensive courses on naval tactics and technologies."
 dartmouth_naval_academy: "Britannia Naval War College"
 dartmouth_naval_academy_desc: "As old as the British Navy itself, the Britannia Naval Academy at Dartmouth has been a symbol of British armed forces for centuries."
 panama_standard: "Panama Standard"
 panama_standard_desc: "To maintain presence in both Pacific and Atlantic Ocean, the United States Navy heavily relid on the Panama Canal to transfer its fleet betweem them. Due to geographical condition of the Canal, a ship mustn't be wider than 110 ft, thus influencing all America's battleship designs."
 kiel_standard: "Kiel Standard"
 kiel_standard_desc: "As a shortcut to bypass the Belts, the Kiel Canal is an important lifeline to the German Reich. With limitation on draft in the Canal, German battleships need to be made wider in order to increase buoyancy, but it often leads to extra armor and heavier hull without actual use."
 professional_damage_control: "Professional Damage Control"
 professional_damage_control_desc: "A trained damage control team can save the ship in the most dangerous moment."
 advanced_supply_fleet: "Advanced Supply Fleet"
 advanced_supply_fleet_desc: "An advanced fleet of replenishment oilers and auxiliary ships will ensure our fleet to operate at full power."
 underwater_death: "Submarine Warfare"
 underwater_death_desc: "Although not widely accepted, submarine has the potential to cripple a country's trade and economy in wartime."
 efficient_escort: "Efficient Escorts"
 efficient_escort_desc: "We need good destroyers and frigates to protect our fleets and convoys."
 merchant_fleet: "Merchant Fleet"
 merchant_fleet_desc: "Ships are weapons, but can also be used as envoys of peace and trade."
 inflexible_headquarter: "Inflexible Headquarter"
 inflexible_headquarter_desc: "Our naval headquarter is filled with old guards who are obsessed with outdated theories and tactics learned from previous wars."
 win_or_die: "Win or Die"
 win_or_die_desc: "We shall win or die trying."
 recovering_from_naval_race: "Recovering from Naval Race"
 recovering_from_naval_race_desc: "Our navy is still recovering from an unaffordable naval arms race whose legacy has deeply impacted our shipbuilding and designing."
 recovering_from_naval_race_tt: "Only available in KR/KX Naval Rework."
 lack_maintenance_facilities: "Out of Maintenance"
 lack_maintenance_facilities_desc: "Our naval facilities are insufficient to sustain a fleet like what we have now."
 murwik_naval_academy: "Marineschule Mürwik"
 murwik_naval_academy_desc: "Mürwik Naval Academy, or Marineschule Mürwik in German, is the main training establishment for all German Navy officers after its replacement of Imperial Naval Academy in 1910. The instituition aims at professionalizing German naval officers through weapon systems training and naval engineering education."
 voroshilov_naval_academy: "K.E. Voroshilov Naval Academy"
 voroshilov_naval_academy_desc: "As one of the most famous naval war colleges in the world, this instituition was established upon the Nikolayev Academy in the wake of the Feburary Revolution. Hundreds of experienced cadets with strategic visions start their careers from here every year, eager to serve Mother Russia."
 nakhimov_naval_academy: "Nakhimov Naval Academy"
 nakhimov_naval_academy_desc: "As one of the most famous naval war colleges in the world, this instituition was established upon the Nikolayev Academy in the wake of the Feburary Revolution. Hundreds of experienced cadets with strategic visions start their careers from here every year, eager to serve Mother Russia."
 usn_fighter_weapons_school: "TOPGUN"
 usn_fighter_weapons_school_desc: "The USN Fighter Weapons School, commonly referred as TOPGUN, is a U.S. Navy program that provides air combat training for naval aviators to create not basic pilots, but experienced instructors. Extensive courses about aerodynamics and combat tactics, and emphasis on elitism have promoted these cadets to the best of the best."
 sp_battlecarrier: "Battlecarrier"
 sp_battlecarrier_desc: "Battlecarrier is a hybrid ship with features from both battleship and aircraft carrier. The idea has been proposed by some naval architects from multiple countries with emphasis on both kinds of ships."
 sp_subcarrier: "Subcarrier"
 sp_subcarrier_desc: "A subcarrier is actually a large submarine capable of launching planes. Despite lighter and smaller planes, it is not easy to accommandate them inside narrow space of submarines, which makes subcarrier's capacity limited to around 2."
 sp_nuclear_torpedo: "Nuclear Torpedo"
 sp_nuclear_torpedo_desc: "Underwater nuclear blast can be deadly to surface vessels and submarines. By installing a mini nuclear warhead on torpedo, it will become the most powerful weapon ever saw service on submarines."
 sp_super_heavy_guns: "Super Heavy Naval Gun"
 sp_super_heavy_guns_desc: "Super heavy naval artillery is a gun whose caliber is over 18in (460mm)."
 sp_mega_carrier: "Strategic Strike Carrier"
 sp_mega_carrier_desc: "Strike carrier is the true definition of floating airfield, with ability to launch heavy jet planes from long distances."
 sp_arsenal_ship: "Arsenal Ship"
 sp_arsenal_ship_desc: "With more recognition placed on missile as the future of warfare, the concept of an arsenal ship with hundreds of missile launching bays is brought up."
 sp_early_informatization_system: "Early Informatization System"
 sp_early_informatization_system_desc: "Different from naval war in the past, the form of future warfare has shown heavy reliance upon sensing and processing data beyond human's comprehension, and informatization is the only path to victory in the next decades."
 sp_high_speed_light_engine: "High Speed Light Engine"
 sp_high_speed_light_engine_desc: "Combination of high-temperature superheaters and powerful steam turbines will accelerate the ship to an unprecedented speed."
 sp_submarine_snorkel: "Submarine Snorkel"
 sp_submarine_snorkel_desc: "A submarine snorkel is a device which allows the engine of a submarine to operate submerged while still taking in air from above the surface."
 sp_shipping_container: "Shipping Container"
 sp_shipping_container_desc: "A metal container box with standard size to be transported by ships and vehicles, which can maximize transportation efficiency both in military and industry."
 sp_battlecarrier_unique_reward_a: "Debate over Battlecarrier's Role"
 sp_battlecarrier_unique_reward_a_desc: "During the iteration process of battlecarrier, a question is raised. Should we focus on its performance or coordination with other ships?"
 sp_battlecarrier_perference_a: "Performance"
 sp_battlecarrier_perference_b: "Coordination"
 sp_subcarrier_unique_reward_a: "Application of Engineering Experience"
 sp_subcarrier_unique_reward_a_desc: "During the iteration process of subcarrier, a question is raised. Should we use the experience on cruiser submarine alone or all types of submarines?"
 sp_subcarrier_perference_a: "Cruiser Submarine"
 sp_subcarrier_perference_b: "All Submarines"
 sp_nuclear_torpedo_unique_reward_a: "Orientation of Nuclear Torpedo Project"
 sp_nuclear_torpedo_unique_reward_a_desc: "The safety of nuclear warhead storage on submarine remains a question."
 sp_nuclear_torpedo_preference_a: "Safety First"
 sp_nuclear_torpedo_preference_b: "Expanded Storage"
 sp_super_heavy_guns_unique_reward_a: "Pursuit of 20-in Gun"
 sp_super_heavy_guns_unique_reward_a_desc: "In the development of super heavy naval guns, an even wilder idea has been proposed to fund research of bigger guns. If we choose to pursue breakthrough in it, the current progress will be affected."
 sp_super_heavy_guns_preference_a: "Granted"
 sp_super_heavy_guns_preference_b: "Forget it"
 sp_early_informatization_system_unique_reward_a: "Informatization Effort"
 sp_early_informatization_system_unique_reward_a_desc: "The leading R&D team in computer science has proposed a project to expand informatization system and merge all electronic devices units of naval vessels into a collective computer system. It's an interesting idea but will greatly slow down the original program."
 sp_early_informatization_system_perference_a: "Keep it moderate."
 sp_early_informatization_system_perference_b: "Spare some budgets."
 sp_naval_proximity_fuze_unique_reward_a: "Usage of Proximity Fuze"
 sp_naval_proximity_fuze_unique_reward_a_desc: "Proximity fuze has largely promoted anti-air shells to be more efficient in hitting planes, but it brings increase of cost in manufacture. We can focus the production for dedicated anti-air ships, or bear the cost and make the advantage universal."
 sp_naval_proximity_fuze_preference_a: "Anti-Air Ships Priority"
 sp_naval_proximity_fuze_preference_b: "Universal Advantage"
 vnr_special_project_workaround_tt: "This §Yspecial project§! §Rdoes not exist§! in the Naval Rework series, it is kept to §Yavoid foci or decisions requiring it from being inaccessible§!.\n\nTo get this project for foci/decision unlocking, research $TECH|Y$ in the §Ctechtree§!."
 RULE_AI_SHIP_DESIGN_STYLE: "AI Ship Design Style"
 RULE_OPTION_HISTORICAL: "Historical"
 RULE_OPTION_EXPERT: "Expert"
 RULE_AI_SHIP_DESIGN_STYLE_HISTORICAL_DESC: "AI will design historical ships with reasonable modules.\n\n§CThis is the old and default naval rework style.§!"
 RULE_AI_SHIP_DESIGN_STYLE_EXPERT_DESC: "AI will design ships based on efficiency and produce meta ships.\n\nThis will §Rmake the naval battle more intense§! and §Rbreak role play elements in this mod§!. §YRecommended for players who want challenges§!."
 RULE_ALLOW_AI_TECH_AUTO_UNLOCK: "Allow AI Auto Research"
 RULE_ALLOW_AI_TECH_AUTO_UNLOCK_FREE_DESC: "AI §Gwill automatically unlock§! a group of naval technologies in the run.\n\nThis option contains §RAI cheating§! that will §Yadvance unlocking certain techs§! if player chooses to §Crush future techs in either normal or cheating way§! (only activated when the advance is over 6 months)."
 RULE_ALLOW_AI_TECH_AUTO_UNLOCK_BLOCKED_DESC: "AI §Rwill not automatically unlock§! naval technologies in the run.\n\nThis will §Ychange§! AI's behavior with a §Ybalanced tendency§! to §Ypick different techs§!, but unavoidably making its naval research §Rslower§! than player's §Cdedicated naval run§!, and may §Raffect AI's research in other fields§!."
 RULE_SHIPYARD_OUTPUT_BOOST_PLAYER: "Player Shipyard Output Boost"
 RULE_SHIPYARD_OUTPUT_BOOST_AI: "AI Shipyard Output Boost"
 RULE_OPTION_BUFF_60: "Full"
 RULE_OPTION_BUFF_30: "Half"
 RULE_SHIPYARD_OUTPUT_BOOST_BUFF_60_DESC: "Shipyard output is 4 IC per day, §G60% faster§! than vanilla."
 RULE_SHIPYARD_OUTPUT_BOOST_BUFF_30_DESC: "Shipyard output is 3.25 IC per day, §G30% faster§! than vanilla."
 RULE_SHIPYARD_OUTPUT_BOOST_BLOCKED_DESC: "Shipyard output is 2.5 IC per day, the same as vanilla."
 RULE_AI_NAVAL_MANAGEMENT: "Enable VNR Naval AI"
 RULE_AI_NAVAL_MANAGEMENT_FREE_DESC: "§GEnable§! naval management AI designed for each specific major country in vanilla environment.\n\nThis option is designed for §YHistorical Mode§! to make AI majors act §Yhistorically and competively§! in a §Chistorical WWII scenario§!, by making AI simulate well-known naval strategies such as §CUnrestricted Submarine Warfare§! and §CIsland Hopping§! in real history.\n\n§RThis option is not recommended for the followings:§!\n£white_dot Alt-history mods (even with compatch)\n£white_dot State/Region mods with changes about seas and oceans\n£white_dot Non-default WWII scenarios (random path/alt-history, anything not leading to Axis vs Allies)\n£white_dot Other AI mods that change AI behavior in naval warfare."
 RULE_AI_NAVAL_MANAGEMENT_BLOCKED_DESC: "§RDisable§! naval management AI designed for each specific major country in vanilla environment.\n\n§YUse AI from base game or from other mods you play along with VNR.§!"
 RULE_AI_AIR_DESIGN: "Enable Improved AI Air Templates"
 RULE_AI_AIR_DESIGN_FREE_DESC: "§GEnable§! improved CV plane designs for AI countries.\n\n§RThis option is not recommended for mods modifying air techs and plane designer.§!"
 RULE_AI_AIR_DESIGN_BLOCKED_DESC: "§RDisable§! improved CV plane designs for AI countries.\n\n§YUse air AI from base game or from other mods you play along with VNR.§!"
 RULE_ENG_EXPERT_NAVY: "@ENG Expert Royal Navy"
 RULE_USA_EXPERT_NAVY: "@USA Expert United States Navy"
 RULE_JAP_EXPERT_NAVY: "@JAP Expert Imperial Japanese Navy"
 RULE_AI_EXPERT_NAVY_BLOCKED_DESC: "Starting ships of this country will not be changed."
 RULE_AI_EXPERT_NAVY_FREE_DESC: "Switch all starting ships of this country to expert AI designs.\n\nThis rule only takes effect when §YAI Ship Design Style§! is set to §CExpert§! and this country is §RAI controlled§!."
 RULE_EXTRA_RESEARCH_SLOTS: "Extra Research Slot"
 RULE_EXTRA_RESEARCH_SLOTS_BLOCKED_DESC: "§RDisable§! extra research slot."
 RULE_EXTRA_RESEARCH_SLOTS_EVERYONE_DESC: "§GEnable§! one extra research slot for every starting country."
 RULE_EXTRA_RESEARCH_SLOTS_PLAYER_ONLY_DESC: "§GEnable§! one extra research slot for the player country only."
 RULE_OPTION_FOR_PLAYER_ONLY: "For Player Only"
 RULE_OPTION_FOR_EVERYONE: "For Everyone"
