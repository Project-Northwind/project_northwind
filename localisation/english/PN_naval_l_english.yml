 MTG_treaty_renew_mission: "Second London Naval Disarmament Conference"
 MTG_treaty_renew_mission_desc: "The Second London Naval Conference was intended to limit the growth in naval armaments until its expiration in 1942."
 MTG_naval_treaty_adherent: "London Naval Treaty Signatory"
 MTG_naval_treaty_adherent_desc: "We have signed the London Naval Treaty and accordingly are restricted in the size of our capital ships. Besides, the London Submarine Protocal (cruiser rules) has enforced strict regulations on merchant raiding."
 MTG_naval_treaty_adherent_reduced: "Escalator Clause Invoked"
 MTG_naval_treaty_adherent_reduced_desc: "After some signatories of the Washington Naval Treaty have abandoned the London Naval Treaty, we have invoked the Escalator Clause, reducing the restrictions for the size and armament of our capital ships."
 MTG_naval_treaty_adherent_1936: "Second London Naval Treaty Signatory"
 MTG_naval_treaty_adherent_1936_desc: "We have signed the Second London Naval Treaty and accordingly are restricted in the size of our capital ships and submarines. Besides, the London Submarine Protocal (cruiser rules) has enforced strict regulations on merchant raiding."
 MTG_treaty_rejoin_mission: "Rejoin Second London Naval Treaty"
 MTG_treaty_rejoin_mission_desc: "We haven't signed the treaty by its deadline. Now it's our last chance to rejoin it, or the escalator clause will be activated a year later."
 MTG_escalator_clause_condition: "No country has refused to renew the treaty."
 fascism_renew_naval_treaty_tt: "§RContinuing negotiation of the naval treaty will anger most members of our government.§!"
 democracy_renew_naval_treaty_tt: "§GContinuing negotiation of the naval treaty will please the public.§!"
 MTG_abandon_treaty_tt: "§RWe will face severe consequences.§!"
 MTG_treaty_renew_mission_tt: "§GThe Second London Naval Disarmament Conference will come to a close.§!\n"
 MTG_treaty_renew_mission_tt_a: "§YIf any member of the conference refused to sign the treaty:§!"
 MTG_treaty_renew_mission_tt_b: "§YIf we fail to sign the treaty:§!"
 washington_treaty_article_xix: "Washington Naval Treaty: Article XIX"
 washington_treaty_article_xix_desc: "Article XIX of the Washington Naval Treaty forbids us to build new naval bases or coastal bunkers on Pacific islands."
 MTG_naval_treaty.12.t: "Second London Naval Conference"
 MTG_naval_treaty.12.d: "Following the unprecedented carnage and expense of the Great War, the popular mood across the globe was peace and disarmament, which reigned throughout the 1920s. As an extension of conditions agreed in previous treaty for naval disarmament, the Second London Naval Conference was held on 9 Dec, 1935. However, the negotiation between signatories of the London Naval Treaty is anything but peace, with terms below presented as the final resolution until its expiration in 1942.\n\n1. No capital ship shall exceed 35,000 tons standard displacement or carry a gun with a caliber over 14 in (356mm).\n\n2. No aircraft-carrier shall exceed 23,000 tons or carry a gun with a caliber over 6.1 in (155mm).\n\n3. No light surface vessel shall exceed 8,000 tons standard displacement. But if the requirements of the national security of any signatories are, in his opinion, materially affected by the actual or authorized amount of construction by any power of light surface vessels, it has the right to lay down or acquire light surface vessels with maximum standard displacement of 10,000 tons.\n\n4. Provided that if any of the signatories of the Washington Naval Treaty should fail to enter into an agreement to conform to this provision prior to the date of the coming into force of the present treaty, the maximum caliber of guns carried on capital ships shall be 16 in (406mm)."
 MTG_naval_treaty.12.a: "Agreed."
 MTG_naval_treaty.12.b: "Rejected."
 submarine: "Submarine"
 submarine_desc: "§HSubmarine§!\n\n\n\n\n£GFX_ss_desc_icon\n\n\n\n\n\nThe submarine is the stealthy menace of the deep, a vessel that can strike from concealment with its deck guns or deadly torpedoes. While its role in a future war against enemy warships is clear, international practice still rightly restricts its use against merchant shipping, requiring them to surface and place crews in a place of safety before sinking a vessel. Technological advances are steadily improving their range, endurance, and reliability, making them a key element of fleet reconnaissance and a potent, if dreaded, weapon."
 both_cruisers_desc: "§HCruiser§!\n\n\n\n\n£GFX_ca_desc_icon\n\n\n\n\n\nLight Cruiser - Evolved from protected cruiser and made more flexible, its primary duty is to shield capital ships from enemy light ships, but it can also unleash powerful torpedoes that can hurt bigger ships.\n\nHeavy Crusier - Evolved from protected cruiser and made larger, a large cruiser is equipped with 8-inch or bigger guns and fair armour. A good choice for nations who can't afford to build larger capital ships."
 light_cruiser: "Light Cruiser"
 light_cruiser_desc: "§HLight Cruiser§!\n\n\n\n\n£GFX_cl_desc_icon\n\n\n\n\n\nEvolved from protected cruiser and made more flexible, the light cruiser is the versatile workhorse of the fleet, typically armed with 6-inch guns. Its duties are myriad: scouting for the battle fleet, leading flotillas of destroyers in a torpedo attack, and defending against enemy destroyers. More numerous than their heavy cruiser cousins, they are the backbone of patrols and colonial presence."
 heavy_cruiser: "Heavy Capital Cruiser"
 heavy_cruiser_desc: "§HHeavy Cruiser§!\n\n\n\n\n£GFX_ca_desc_icon\n\n\n\n\n\nEvolved from protected cruiser and made larger, a heavy cruiser is equipped with 8-inch guns and fair armour. It is designed to be a long-range commerce protector and a formidable raider itself, or sometimes a vanguard of fleet, capable of outpacing any enemy battleship. Nations have built them in numbers, and they form a crucial component of cruiser squadrons."
 medium_cruiser: "Heavy Fleet Cruiser"
 medium_cruiser_desc: "§HHeavy Cruiser§!\n\n\n\n\n£GFX_ca_desc_icon\n\n\n\n\n\nEvolved from protected cruiser and made larger, a heavy cruiser is equipped with 8-inch guns and fair armour. It is designed to be a long-range commerce protector and a formidable raider itself, or sometimes a vanguard of fleet, capable of outpacing any enemy battleship. Nations have built them in numbers, and they form a crucial component of cruiser squadrons."
 destroyer: "Destroyer"
 destroyer_desc: "§HDestroyer§!\n\n\n\n\n£GFX_dd_desc_icon\n\n\n\n\n\nThe destroyer is the fleet's swift guardian and sharp striker. These nimble, torpedo-armed vessels are primarily tasked with screening the battle line from enemy destroyer attacks and delivering their own massed torpedo salvos against capital ships. Their secondary role in hunting submarines is becoming ever more critical with improvements in underwater boat technology. Though small and frail, a flotilla of destroyers presents a grave threat to even the largest ships."
 amphibious_assault_ship: "Amphibious Assault Ship"
 amphibious_assault_ship_desc: "§HAmphibious Assault Ship§!\n\n\n\n\n£GFX_lhd_desc_icon\n\n\n\n\n\nThe amphibious assault ship is a versatile vessel designed to support and deploy ground forces during amphibious operations. Equipped with a well deck for launching landing craft and a flight deck for operating helicopters, these ships play a crucial role in projecting power from the sea to the shore. They are essential for conducting beach landings, humanitarian missions, and providing air support for ground troops."
 carrier: "Carrier"
 carrier_desc: "§HAircraft Carrier§!\n\n\n\n\n£GFX_cv_desc_icon\n\n\n\n\n\nThe aircraft carrier is the most modern and rapidly evolving vessel in any major fleet. Converted from existing battlecruiser hulls or built from the keel up, these floating airfields are proving their worth in fleet exercises. Their squadrons of fighters, torpedo bombers, and scouts provide the fleet's eyes and a potent new striking arm. While their ability to influence a major surface engagement against the guns of a battleship is still a matter of heated debate, no one will doubt their great potential."
 battleship: "Battleship"
 battleship_desc: "§HBattleship§!\n\n\n\n\n£GFX_bb_desc_icon\n\n\n\n\n\nThe battleship remains the undisputed capital ship and the ultimate measure of a navy's power. These colossal vessels are defined by their immense firepower, derived from batteries of heavy guns ranging from 14 to 16 inches in caliber, and their extensive armour plating, designed to withstand fire from an enemy's equivalent broadside. The battle line, comprised of these magnificent ships, is still expected to decide any future fleet action."
 battle_cruiser: "Battlecruiser"
 battle_cruiser_desc: "§HBattlecruiser§!\n\n\n\n\n£GFX_bc_desc_icon\n\n\n\n\n\nAs a creation that strongly speaks to Lord John A. Fisher's style, the battlecruiser presents a fascinating and controversial concept: the armament of a battleship married to the speed of a cruiser, achieved by reducing armour protection. Their role is that of a super-cruiser; to hunt down enemy commerce raiders and serve as a powerful advanced scout for the main fleet. However, lessons from Jutland have led to serious debate about their survivability in a modern gunnery duel."
 convoy: "Convoy"
 convoy_desc: "Convoys used for international trade of goods and resources. Also used to ferry troops around and for performing naval invasions."
 SH_battleship: "Super Heavy Battleship"
 SH_battleship_desc: "§HSuper Heavy Battleship§!\n\n\n\n\n£GFX_shbb_desc_icon\n\n\n\n\n\nOften fantasized in the wildest dreams of naval architects, super heavy battleships have mostly remained blueprints or concepts in the past. While the building methods remain controversial, with enough money and determination, it is not a daydream to complete a huge ship like this."
 battlecarrier: "Battlecarrier"
