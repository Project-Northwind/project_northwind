 ship_bulbous_bow_desc: "A protruding bulb at the bow of a ship just below the waterline with a sonar in it."
 ship_aa_fire_control: "Kerrison Predictor"
 ship_aa_fire_control_short: "Anti-Air Predictor"
 ship_aa_fire_control_desc: "A fire-control system to automate the aiming of AA guns."
 ship_electric_motor: "Turbo-Electric Drive Propulsion System"
 ship_electric_motor_short: "Electric Motor"
 ship_electric_motor_desc: "An electrical machine that converts electrical energy into mechanical energy. It is powered by steam turbo in the use of not only propulsion but also powering accessories."
 ship_light_weight_shell: "Lightweight Armor-Piercing Shell"
 ship_light_weight_shell_short: "Lightweight AP"
 ship_light_weight_shell_desc: "Lightweight AP shells have higher initial velocity and will make reloading much faster, but they will gain more drag in long range combat, leading to ricochet."
 ship_super_heavy_weight_shell: "Super Heavy Armor-Piercing Shell"
 ship_super_heavy_weight_shell_short: "Super Heavy AP"
 ship_super_heavy_weight_shell_desc: "A super heavy shell whose weight variability is over 20% greater than normal ones. It's slower and harder to aim but will cause great damage once hit."
 ship_high_velocity_shell: "High-Velocity Armor-Piercing Shell"
 ship_high_velocity_shell_short: "High-Velocity AP"
 ship_high_velocity_shell_desc: "Instead of reducing weight, high-velocity shells take more gun powder to reach a high speed when fired. This could pressure the barrels."
