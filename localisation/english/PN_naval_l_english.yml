 carrier_aviation_control_unit: "Aviation Control Unit"
 carrier_aviation_control_unit_short: "Aviation Control"
 carrier_aviation_control_unit_desc: "The aviation control units are in charge of take-off and landing operations to make sure these actions are carried out efficiently.\n\n§YMax Org Factor:§! §G+10%§!"
 carrier_damage_control_unit: "Damage Control Department"
 carrier_damage_control_unit_short: "Damage Control"
 carrier_damage_control_unit_desc: "The damage control units keep the ship safe from situations that may cause the sinking of a watercraft.\n\n§YMax Org Factor:§! §G+10%§!"
 carrier_scouting_unit: "Scout Plane Squad"
 carrier_scouting_unit_short: "Scouting Squad"
 carrier_scouting_unit_desc: "A professional scout plane squads deployed on the carrier. These planes are equipped with larger fuel tanks and radios, designed to search enemy fleet hundreds of miles away from their carrier."
 carrier_spared_squad: "Spared Squad"
 carrier_spared_squad_short: "Spared Squad"
 carrier_spared_squad_desc: "A spared squad of planes served as a supplement."
 carrier_fuel_storage: "Aero Gasoline Storage"
 carrier_fuel_storage_short: "Aero Gasoline Storage"
 carrier_fuel_storage_desc: "A large space in the carrier for storage of air fuel."
 carrier_civilian_material: "Civilian Materials Primacy"
 carrier_civilian_material_short: "Civilian Materials"
 carrier_civilian_material_desc: "Using civilian materials on carriers will make them cheaper to manufacture.\nThis is an §Rinflexible module§! and §Rcan't be dismantled§! after installation.\n\n§YMax Org Factor:§! §R-20%§!"
 carrier_secondary_island: "Secondary Island"
 carrier_secondary_island_short: "Secondary Island"
 carrier_secondary_island_desc: "A secondary island installed on the flight deck to relieve aviation control units based in the main one.\n\n§YMax Org Factor:§! §G+5%§!"
 carrier_strength_deck: "Deep-Hull Strength Deck"
 carrier_strength_deck_short: "Strength Deck"
 carrier_strength_deck_desc: "The uppermost continuous deck that resists longitudinal bending, which is reinforced by armor and deeply integrated with the hull.\n\n§YDeck Damage Chance:§! §G-25%§!\n§YDeck Damage Penalty:§! §G-50%§!"
 ship_helipad: "Utility Helicopter"
 ship_helipad_desc: "A general-purpose helicopter that can carry out a wide variety of missions."
 ship_steam_catapult: "Steam-powered Catapult"
 ship_steam_catapult_desc: "Steam-powered catapult allows aircraft to take off from a very limited amount of space.\n\n§YMax Org Factor:§! §G+10%§!"
 side_lift: "Side Lift"
 side_lift_desc: "The side lift is used to uplift aircraft from hangar to deck level without disrupting on-going operations.\n\n§YMax Org Factor:§! §G+5%§!"
 angled_deck: "Angled Deck"
 angled_deck_desc: "Angled deck allows concurrent launch and recovery operations.\n\n§YMax Org Bonus:§! §G+20%§!"
 ship_anti_air_5: "Anti-Air Rocket Launcher"
 ship_anti_air_5_desc: "A type of anti-air rockets without guiding systems."
 ship_deck_space_small: "Small Hangar Space"
 ship_deck_space_small_short: "Small Hangar"
 ship_deck_space_small_desc: "A small hangar with limited capacity."
 ship_deck_space_big: "Large Armored Hangar Space"
 ship_deck_space_big_short: "Large Hangar (Armored)"
 ship_deck_space_big_desc: "A large and armored hangar with abundant capacity.\n\n§YAvg. Collateral Damage from Air Fuel Flashover:§! §G-20%§!"
