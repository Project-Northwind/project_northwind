 navy_rework_category: "Naval Rework"
 navy_rework_category_desc: "Alfred Mahan, the father of theory of Sea Power, wrote, \"Sea Power is largely, though by no means solely, a narrative of contests between nations, of mutual rivalries, of violence frequently culminating in war\". The 20th century witnessed the rise of naval powers, and the navy has been playing a vital role in global strategy.\n\nEver since the Anglo-German Naval Arms Race, navies of the world have been innovating and expanding their fleet. From wolfpacks beneath the water to behemoths on the surface, modernized warships dominate every inch of the sea."
 add_never_built_blueprints: "Acquire Never-Built Blueprints"
