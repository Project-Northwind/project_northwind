 NAVAL_TITLE_ARMOR_LAYOUT: "ARMOR STEEL"
 armor_desc: "§YArmor Steel§!\n\n\n\n\n£GFX_bb_tech_10\n\n\n\n\n\nSteel is the most common material used for ship armor, and its quality has a significant impact on the ship's survivability."
 armaments_desc: "§YArmaments§!\n\n\n\n\n£GFX_support_tech_2\n\n\n\n\n\nArmaments are the main offensive power of a ship, and their performance is crucial for the ship's combat effectiveness."
 torpedoes_desc: "§YTorpedoes§!\n\n\n\n\n£GFX_dd_tech_13\n\n\n\n\n\nTorpedoes are powerful underwater weapons that can cause significant damage to enemy ships. They are a key component of naval warfare."
 transport_desc: "§YTransport§!\n\n\n\n\n£GFX_support_tech_4\n\n\n\n\n\nTransport ships are essential for moving troops, supplies, and equipment across the seas. They play a crucial role in supporting naval and amphibious operations."
 auxiliary_desc: "§YAuxiliary§!\n\n\n\n\n£GFX_support_tech_1\n\n\n\n\n\nAuxiliary ships provide support and logistics for the fleet, including repair, refueling, and medical services. They are vital for maintaining the fleet's operational capabilities."
 mines_desc: "§YMines§!\n\n\n\n\n£GFX_support_tech_3\n\n\n\n\n\nMines are explosive devices placed in the water to damage or destroy enemy ships. They are a cost-effective way to control sea lanes and protect harbors."
 NAVAL_TITLE_AUXILIARY: "AUXILIARY"
 NAVAL_TITLE_DESTROYERS: "DESTROYERS"
 NAVAL_TITLE_CRUISERS: "CRUISERS"
 NAVAL_TITLE_BATTLESHIPS: "BATTLESHIPS"
 NAVAL_TITLE_CARRIERS: "CARRIERS"
 NAVAL_TITLE_SUBMARINES: "SUBMARINES"
 ship_rocket_artillery: "Rocket Artillery"
 ship_rocket_artillery_desc: "Recent advances in rocket science have not only resolved its shortage of range, but also made rocket artillery more economical to produce in large quantity. Witnessing its success in land warfare, efforts are made to combine this powerful weapon with warships. The ship rocket artillery uses rockets without any guidance device. Despite poor accuracy, they can deal considerable damage to the target even without a direct hit. Meanwhile, the invention of proximity fuze has helped offset its weakness."
 advanced_sonar: "Towed Sonar Array"
 advanced_sonar_desc: "Towed sonar is also known as variable depth sonar. It can operate in deeper waters to avoid the interference of ship noise.\n\nMounting this module in an §YElectronics Slot§! on §YLight Ships§! or §YCruisers§! will help them detect enemy §YSubmarines§!."
 naval_radio_guiding_system: "Naval Radio Guiding System"
 naval_radio_guiding_system_desc: "The idea of controlling objects remotely predates the invention of radio, but radio guidance exploits its feature of long-range transmission and makes the process wireless. Compared to inertial and preset guidance methods, radio guidance is more conducive to attacking moving ships by taking target's position into account."
 ship_to_ship_missile: "Radio-Guided Missile"
 ship_to_ship_missile_desc: "Earlier breakthroughs in radio guided weapons has made the radio guidance technology the last piece of puzzle in making a self-driven weapon to send powerful payloads from a long distance accurately. Either by remote or onboard radio guidance, anti-ship missile becomes way more effective than conventional artillery and has attracted most nations to fill their arsenals with it."
 high_speed_light_engine: "High-Pressure Boiler"
 high_speed_light_engine_desc: "The ultra-high pressure boiler with superheaters can deliever a stronger power of about 75,000 hp for the steam turbine. However, due to its unstable performance, it is currently only used on small ships such as destroyers."
 large_destroyer_trend: "Large Destroyer"
 large_destroyer_trend_desc: "A flotilla leader is a warship suitable for commanding a flotilla of destroyers or other small warships, typically a small cruiser or a large destroyer. Originally, the role was usually played by light cruisers or scout cruisers, but the rapid growth of destroyers in the early 1900s has made these vessels obsolete and incapable of keeping pace with faster destroyers. The new dynamics at sea prompt navies to build dedicated large destroyers to replace them.\n\nInstall §YDestroyer Leader Role§! on §YLight Hull§! to strengthen §YLight Attack§!."
 escort_destroyer_trend: "Escort Destroyer"
 escort_destroyer_trend_desc: "During the Second World War, the emergence of new submarines posed a major threat to the merchant fleets. As a large number of destroyers were occupied on the frontline, the demand for an economical and flexible light destroyer became urgent. Escort destroyers have been stripped of most unnecessary equipment, retaining only basic guns and depth charges. Any naval power can build numerous ships of this type within a few months. With sonars, these small escorts on ocean routes have become an important factor in the country's war potential.\n\nInstall §YEscort Destroyer Role§! on §YLight Hull§! to reduce §YCost§!."
 destroyer_mass_production: "Destroyer Mass Production"
 destroyer_mass_production_desc: "Violent battles have led to losses of destroyers, so great that even the naval powers with hundreds of them before the war can scarcely absorb. To sustain continuous fleet operations, the new generation of destroyers have adopted a mass production method, shortening the time from keel to ship."
 sound_surveillance_system: "SOSUS"
 sound_surveillance_system_desc: "SOSUS, or Sound Surveillance System, is an anti-submarine surveillance network formed by a large number of passive sonars. Its construction requires building monitoring stations on islands and shores. Advanced sonar arrays deployed at these sites can track submarines in the area through SOFAR channel (Sound Fixing And Ranging Channel), a depth at which the speed of sound is at its minimum. The system can also be used for scientific research including hydrology, geography and marine biology."
 destroyer_missile_upgrade: "Anti-Air Missile Destroyer Refit"
 destroyer_missile_upgrade_desc: "During World War II, efforts were started to develop surface-to-air missiles as it was generally considered that flak was of little use against bombers of ever-increasing performance. The research was led by several major powers in the world, and they quickly developed a wide variety of models. Adapted from the land-based SAM system, ship-to-air missile saw dedicated improvements in its guidance and launching modules.\n\nInstall §YAnti-Air Destroyer Role§! on §YLight Hull§! to unlock §YSurface-to-Air Missiles§!."
 early_cruiser_armor: "Great War Cruiser Armor"
 early_cruiser_armor_desc: "By the 1890s, it had become a general consensus that cruisers with armor protection had better survivability and would ultimately replace unprotected cruisers.\n\nMounting this module on §YCruisers§! improves their ability to §Ywithstand enemy damage§!, but also §Rreduces§! their §Yspeed§!."
 basic_cruiser_armor: "Interwar Cruiser Armor"
 basic_cruiser_armor_desc: "The displacement restrictions imposed by the Washington Naval Treaty in the 1920s led designers to adopt ideas of tonnage saving, such as inclined armor. Newly designed cruisers generally had moderate armor, which could resist shells from old rapid-fire guns.\n\nMounting this module on §YCruisers§! improves their ability to §Ywithstand enemy damage§!, but also §Rreduces§! their §Yspeed§!."
 improved_cruiser_armor: "Improved Cruiser Armor"
 improved_cruiser_armor_desc: "With looming tensions across the world, the Washington System was crumbling when Japan and Italy refused to sign the Second London Naval Treaty, and both started to build cruisers exceeding the restriction. The cruiser armor became thicker and harder as circumstances demanded.\n\nMounting this module on §YCruisers§! improves their ability to §Ywithstand enemy damage§!, but also §Rreduces§! their §Yspeed§!."
 advanced_cruiser_armor: "Advanced Cruiser Armor"
 advanced_cruiser_armor_desc: "Experience gained in the war has further promoted the development of cruisers. Besides heavy armor, the new cruisers also adopted an armor layout design similar to that of the battleship. While maintaining a high speed, the design devoted more tonnage to the defense of key parts.\n\nMounting this module on §YCruisers§! improves their ability to §Ywithstand enemy damage§!, but also §Rreduces§! their §Yspeed§!."
 searchlight: "Searchlight"
 searchlight_desc: "The searchlight is generally installed on the side of ships for reconnaissance at night and navigation in foggy weather. Although a better field of view can be obtained, it may expose the ship's position if used recklessly."
 cruiser_propulsion_revolution: "Propulsion Revolution"
 cruiser_propulsion_revolution_desc: "Power solution developments during the 1910s have brought a revolution to ship propulsion, allowing heavier armor and armaments beyond imagination. Cruisers are one of the most profoundly influenced ships by adopting a combination of steam turbine and oil-fired boiler, promising bigger size and faster speed."
 specialization_doctrine: "Specialization Doctrine"
 specialization_doctrine_desc: "To meet different mission requirements, cruisers are designed based on a specialization doctrine for different roles. They are also built on hulls of various sizes for specific missions, whether it be anti-air, anti-ship, or reconnaissance. Some of them choose speed and cost-efficiency over armor, while others dedicate themselves to firepower outmatching pre-war dreadnoughts.\n\nInstall §YColonial Cruiser Role§! on §YCruiser Hull§! to reduce §YCost§!.\nInstall §YLarge Cruiser Role§! on §YCruiser Hull§! to strengthen §YSurvivability§!.\nInstall §YCapital Raider Role§! on §YCruiser Hull§! to strengthen §YRaiding Coordination§!."
 cruiser_gun_upgrade: "Cruiser Semi-Autoloader"
 cruiser_gun_upgrade_desc: "As destroyer performance improved in the 1930s, rapid-fire guns developed before the war can no longer meet the need. To ensure efficiency against destroyers, cruisers are equipped with mechanical loading machines that increase rate of fire while saving manpower. Although the machine still requires manual assistance, it can achieve a loading efficiency far exceeding that of non-autoloading guns."
 cruiser_aa_upgrade: "Anti-Air Cruiser Refit"
 cruiser_aa_upgrade_desc: "By the 1930s, carrier-based aircraft have seen advances in manoeuverability and payload. Some naval officers see this as a chance to promote the aircraft carrier in future naval warfare. To counter it, most ships are reinforced with better anti-air firepower, and construction of dedicated anti-air cruisers begin simultaneously.\n\nInstall §YAnti-Air Cruiser Role§! on §YCruiser Hull§! to strengthen §YAnti-Air Attack§!."
 destroyer_cruiser_trend: "Super Destroyer"
 destroyer_cruiser_trend_desc: "As a by-product of differentiation strategy to cope with larger destroyers, a new ship class with features from both light cruiser and destroyer has been created. Equipped with intermediate armaments including lesser cruiser-level guns, its definition varies across the world. It can play the role of a flotilla leader in a small squadron, and a destroyer killer when acting alone, which its speed advantage also allows it to fight an asymmetrical war at sea.\n\nInstall §YSuper Destroyer Role§! on §YLight Hull§! to unlock §YLight Medium Battery§!."
 cruiser_radar_sentry: "Radar Picket Refit"
 cruiser_radar_sentry_desc: "The advent of radar has completely changed naval reconnaissance that even the most trained observer cannot match its range or accuracy. Cruisers, usually acting as fleet's vanguard, become the first naval ships to install radars. With unparalleled detection range, radar allows the fleet to spot the enemy earlier than before.\n\nInstall §YRadar Picket Role§! on §YCruiser Hull§! to strengthen §YSurface Detection§!."
 fighter_directional_system: "Fighter Directional System"
 fighter_directional_system_desc: "The predecessor of the ship-controlled interception system is the ground-controlled joint interception tactic developed in the war. By connecting multiple radar stations to the joint control center, the headquarter can issue more specific information on position and speed of enemy aircraft to fighters. With the development of shipborne radar, this system is used in naval operations, making interception carried out by carrier fighters more efficient."
 cruiser_missile_upgrade: "Missile Cruiser Refit"
 cruiser_missile_upgrade_desc: "Missile is powerful and accurate, thus rendering naval guns useless in its face. Although a battleship can utilize its ample space to install missiles, a cruiser must go through total conversion in order to accommodate their launchers and storages.\n\nInstall §YMissile Cruiser Role§! on §YCruiser Hull§! to unlock §YAnti-Ship Missile§!."
 helipad: "Helipad"
 helipad_desc: "The idea of helicopter was invented way before the 20th century, but hundreds of them were first built and deployed in the war during the Second World War. At first, helicopters were used in small numbers for observation, transport, and medical evacuation. As vertical flight can save more space on a narrow deck of ship, navy has also seen this breakthrough as a perfect supplement to seaplanes. But before turboshaft is developed, helicopters only play a very limited role in naval operations."
 basic_heavy_armor: "Interwar Protection Solution"
 basic_heavy_armor_desc: "The Great War has revealed the weaknesses of battleship armor, and the new generation of battleships have been designed with better protection. The new armor scheme is more comprehensive, covering more critical areas of the ship, and the armor itself is also improved with better materials and layout."
 improved_heavy_armor: "Improved Protection Solution"
 improved_heavy_armor_desc: "The Second World War has witnessed the rapid development of naval guns, which can easily penetrate the armor of battleships built before the war. To keep up with the times, the new battleships have been designed with thicker and stronger armor, and more attention is paid to the layout of armor both above and below the waterline to ensure better protection for key areas."
 advanced_heavy_armor: "Advanced Protection Solution"
 advanced_heavy_armor_desc: "The latest battleships have been designed with the most advanced armor scheme. They combine advantages from most previous designs, which it is made possible by lighter but more resilient steel. The armor layout and armor itself are all optimized to offer better protection against enemy fire."
 incremental_armor_scheme: "Post-Jutland Armor Scheme"
 incremental_armor_scheme_desc: "The Battle of Jutland has demonstrated the inadequacy of pre-1914 armor layouts. Lacking awareness of long-range engagements, previous armor layouts were generally unable to resist 15-inch shells from the top. The post-Jutland scheme, a temporary design strengthening the deck armor, was developed during the war and quickly became obsolete after that.\n\nInstall §YArmor Scheme§! on §YHeavy Hull§! to strengthen §YArmor§! or §YHP§!."
 mixed_armor_scheme: "Mixed Armor Scheme"
 mixed_armor_scheme_desc: "The mixed scheme was a transitional armor scheme after the war, which mainly integrated lessons learned from Jutland and the idea of all-or-nothing defense. Compared with the incremental scheme invented 20 years ago, it had a better proportion of armor devoted to vulnerable areas.\n\nInstall §YArmor Scheme§! on §YHeavy Hull§! to strengthen §YArmor§! or §YHP§!."
 all_or_nothing_armor_scheme: "All-or-Nothing Armor Scheme"
 all_or_nothing_armor_scheme_desc: "The all-or-nothing scheme was first adopted on the Nevada-class battleships, and has been applied on all US battleships after that. It greatly saves the armor of non-essential areas with the same tonnage, and uses an armored citadel to protect fragile places like magazine and machinery spaces. Ships designed with this concept usually have better survivability.\n\nInstall §YArmor Scheme§! on §YHeavy Hull§! to strengthen §YArmor§! or §YHP§!."
 all_or_nothing_armor_box_armor_scheme: "Enhanced All-or-Nothing Armor Scheme"
 all_or_nothing_armor_box_armor_scheme_desc: "During the Second World War, the research on battleship armor advanced to a point where all-or-nothing scheme was widely used, which it also led to a series of shells with stronger armor-piercing performance. The secondary armor box serves to enhance overall strength of the ship while protecting secondary areas such as crew quarters.\n\nInstall §YArmor Scheme§! on §YHeavy Hull§! to strengthen §YArmor§! or §YHP§!."
 harvey_steel: "Harvey Steel"
 harvey_steel_desc: "Harvey armor was a type of steel armor developed by American engineer Hayward Harvey in the early 1890s. It was once popular and saw several main producers of the armor plate including Vickers, Krupp and Bethlehem."
 krupp_steel: "Krupp Armor"
 krupp_steel_desc: "Krupp armor was invented by Germany's Krupp Arm Works in 1893 and replaced Harvey armor as a primary method of protecting naval ships. The manufacturing of Krupp armor was very similar to Harveyized armor, but the Krupp process, instead of generally using nickel-steel, added as much as 1% chromium to the alloy for additional hardness. Early ballistic tests showed that 260mm of Krupp armor offered the same protection as 300mm of Harvey armor."
 krupp_cemented_steel: "Krupp Cemented Armor"
 krupp_cemented_steel_desc: "The manufacturing process of Krupp cemented armor (KCA) remained largely the same as original Krupp steel armor, with slight changes in the alloy composition. The KCA retained the hardened surface via the application of carbonized gases but also had a much greater fibrous elasticity on the rear of the plate, which greatly reduced the incidence of spalling and cracking under incoming fire."
 ducol_steel: "Ducol Steel"
 ducol_steel_desc: "Ducol or D-steel is the name of a number of high-strength low-alloy steels of varying composition, first developed from the early 1920s by the Scottish firm of David Colville & Sons. Applications have included ship hull construction, light armoring and pressure vessels such as locomotive steam boilers."
 homogeneous_krupp_steel: "Homogeneous Krupp Armor"
 homogeneous_krupp_steel_desc: "Developments in face-hardened armor in the late 19th and early 20th centuries revealed that such armor was less effective against glancing oblique impacts. The hardened face layer's brittleness was counterproductive against such impacts. The new invention of homogeneous steel combined ductility and tensile strength, and was typically used for deck and waterline protection."
 enhanced_horizontal_defense: "Deck Armoring"
 enhanced_horizontal_defense_desc: "Although it was not widely realized in the past, long-range fire following the high ballistic trajectory is one of the most common ways to hit a maneuvering ship from another. After studying outcomes of the Battle of Jutland, all naval powers moved to strengthen deck armor of battleships."
 heavy_ship_refit_reduction: "Obsolete Ship Refit"
 heavy_ship_refit_reduction_desc: "The Naval Holiday has largely halted shipbuilding worldwide. To improve the fleet under strict observation, modernizing old ships had become an efficient and economical approach."
 improved_conning_tower: "Improved Conning Tower"
 improved_conning_tower_desc: "The conning tower is the core of a battleship. In past wars, it has always assumed duties like command, reconnaissance and fire control. The development of naval guns has an impact on its evolution. Once without enough armor protection, the integrated and enclosed bridge can provide better protection for commanding personnel, and create plenty of room for the communication department."
 fuel_oil_boiler: "Oil Boiler"
 fuel_oil_boiler_desc: "Fuel oil is a heavy oil remaining after the process of extracting gasoline or diesel from crude oil, which is very viscous and difficult to volatilize. Due to its high calorific value, fuel oil can be burned more fully, providing stronger power for ships, while producing less smoke than coal-powered boilers.\n\nInstall §YHeavy Boilers§! on §YHeavy Hull§! to increase §YSpeed§!.\n§YHeavy Boilers§! are limited in number on different tiers of §YHeavy Hull§!, ranging from §Y1§! to §Y3§!."
 ship_living_standard: "Ship Living Standard Improvement"
 ship_living_standard_desc: "The living environment aboard was very harsh, but this situation is gradually improving. More countries begin to use iron beds and air-conditioning systems on warships to ensure morale and physical condition of sailors in peacetime, so that they can devote themselves to the battle at full effectiveness.\nMoreover, from tonkatsu (fried pork chop) and curry rice in Japan to macaroni and ice cream in the US, food on ships is getting even better, though the best is still reserved for officers. \n\n§CLet the army envy us!§!"
 rudder_upgrade: "Rudder Upgrade"
 rudder_upgrade_desc: "Improved rudder gear allows a ship to turn more sharply, thus better maneuverability in formation and retreat."
 battleship_aa_upgrade: "Battleship Anti-Air Upgrade"
 battleship_aa_upgrade_desc: "Surprising results made by aircraft carriers in the war have pushed the naval powers to shift their attention from large but slow battle fleet to carrier battle group, a move that seems to deteriorate the role of battleships in the fleet. However, carrier is still considered vulnerable without protection from battleship, whose size provides a platform for anti-air defense. Battleships equipped with a large number of anti-air guns have emerged alongside carriers as escorts."
 fuel_tank_upgrade: "Large Fuel Tank"
 fuel_tank_upgrade_desc: "The standard for building a global navy is that the country's fleet can be deployed far away from its sphere of influence under any circumstances, and effectively implement deterrence locally. Having larger fuel tanks on our ships can help achieve this goal."
 radar_jammer: "Radar Jammer"
 radar_jammer_desc: "The radar has greatly improved target detection, which is crucial in naval warfare. A series of interference technologies are developed to counter it. Interference was initially achieved by throwing metal chaff and other passive methods. Now the clutter jammer can release noise in a radar's operating frequency, making it more difficult to locate the ship."
 combat_information_center: "Combat Information Center"
 combat_information_center_desc: "The combat information center, or CIC, is the heart of a warship. By the end of the war, the most advanced naval ships have all types of electronic devices including search radars, anti-air radars and fire control systems. While the traditional conning tower can no longer meet the requirement, the CIC integrates every control unit of the electronic systems aboard. With computers, it can provide the captain or fleet commander with faster and more detailed information."
 prototype_airplane_launcher: "Prototype Airplane Launcher"
 prototype_airplane_launcher_desc: "The ship airplane launcher, invented by Britain, uses hydraulic pressure to eject light seaplanes from ships with limited space, and then recovers them with a crane at the stern. Some countries have experimented with seaplanes during the Great War and proved their power, but with the increasing size of aircraft, conventional catapults can no longer sustain effective combat payload of the plane, which it has inspired the development of aircraft carriers."
 early_carrier_study: "Naval Aviation Theory"
 early_carrier_study_desc: "Equipped with a full-length flight deck and facilities for carrying, arming, deploying, and recovering aircraft, the carrier fulfilled the need to launch air raids from the sea. Before the advent of the first carrier, there were various studies made by different leading countries in the aviation industry, which laid a solid foundation for late entrants."
 landing_aid_system: "Landing Aid System"
 landing_aid_system_desc: "Carrier landings are among the most dangerous carrier operations. Despite the name with \"system\", the landing aid operations are mostly carried out by people known as landing signal officers (LSO). They are sometimes served by experienced pilots, and use a set of semaphores with colored paddles to help pilots adjust approach attitude."
 arresting_gear: "Arresting Gear"
 arresting_gear_desc: "The landing arrestment system is an auxiliary system used on the flight deck to achieve safe landing of aircraft. As the most important part of this device, arresting gear engages aircraft's tailhook with high-strength cables. If it fails, barricades will become the last measure."
 aviation_dawn: "Aviation Dawn"
 aviation_dawn_desc: "A large number of exercises have been conducted at the turn of the 1930s, culminating in a series of advancements in naval and air tactics. Due to its heavy reliance on cutting-edge technologies and seasoned personnel, a functional naval aviation requires extensive training.\n\nYet it is not easy for any country possessing a large battleship fleet to change the course. Resistance from vested interests is expected.\n\n§RThe age of airplanes is here, guns and armor are relics of the past......§!"
 carrier_radio_range: "Navigation Radio Range"
 carrier_radio_range_desc: "As aircraft become heavier and flies farther, a major challenge has emerged: how can pilots reliably find their moving carrier at sea after a mission. The answer is found in revolutionary breakthrough of radio homing technology. The carrier transmits radio signals on a specific frequency, acting as a beacon to guide fighter aircraft with receivers back to the ship. The technology allows for safer recovery in poor weather, extended operational range, and is crucial for coordinating large-scale attacks in a prolonged war."
 dive_bomber_study: "Dive Bomber Study"
 dive_bomber_study_desc: "Unlike torpedo bombers, dive bombers attack from high altitudes, making them harder for fighters or anti-air guns to intercept. Additionally, diving directly at targets delivers better accuracy, and simplifies the bomb's trajectory to allow the pilot to keep visual contact throughout the bomb run. The agility also ensures that they can attack and escape at high speed, increasing survivability while rendering evasive maneuvers by the target ineffective."
 carrier_mass_production: "Carrier Mass Production"
 carrier_mass_production_desc: "Wartime demand and improved construction methods called for shorter build times. Welding, pre-assembled sections, and standardized designs have all contributed to the rapid growth of construction efficiency."
 escort_carriers_ship: "Escort Carrier"
 escort_carriers_ship_desc: "Rampant threats from submarines during the war have made convoy protection the key to victory. Unlike fleet carriers, escort carriers are cheaper and faster to produce. It excels in anti-submarine warfare and providing air cover, making them ideal for securing trade routes."
 folding_wing: "Folding Wing"
 folding_wing_desc: "It is becoming even more evident what decisive role that aircraft can play in recent battles. To achieve greater carrier capacity, aircraft designers start to apply folding wings on the latest naval planes, trying to save hangar and deck space. However, the manufacturing requires superb craftsmanship."
 carrier_damage_control: "Integrated Damage Control"
 carrier_damage_control_desc: "Damage control is the emergency control of situations that may cause the sinking of a watercraft. Western navies have long been aware of the importance of a professional firefighting and repair team. The lessons learned from war have only made it more pronounced, especially for carriers, the primary naval assets.\nThe damage control department consists of not only the personnel but also equipment such as fire extinguishers and fire-retardant fuel tanks."
 air_fuel_storage: "Air Fuel Storage"
 air_fuel_storage_desc: "More extensive carrier operations during the Second World War have made the need for large fuel tanks even more pronounced, because the quantity of air fuel aboard directly affects range and payload of aircraft.\nMore air fuel carried usually means the carrier can support more air groups efficiently.\n\nAir fuel storage can help §Ycarrier-based aircraft§! improve §Yrange§! and §Yagility§!."
 full_armored_carrier: "Enclosed Armored Carrier"
 full_armored_carrier_desc: "Britain was the first to adopt armored flight decks on carriers, whose armor could prevent dive bombing from damaging the deck in combat. This idea has become widely accepted by other naval powers by the end of the war, contributing to modern carriers featuring enclosed hangars and armored flight decks."
 carrier_steam_catapult: "CATOBAR"
 carrier_steam_catapult_desc: "Even the state-of-the-art propeller fighter was quickly rendered obsolete by jet aircraft at the end of the war. Since its weight has been greatly increased by the use of advanced materials, it is unable to take off from decks with limited length. Some naval designers proposed connecting the steam turbine to the catapult, so that jet fighters can be launched to reach a faster initial speed. Such system is called CATOBAR, or \"Catapult Assisted Take-Off Barrier Arrested Recovery\"."
 carrier_angled_deck: "Angled Flight Deck"
 carrier_angled_deck_desc: "The angled deck first appeared in the late 1940s and it is typically offset to port, forming an angle of 6 to 13 degrees with the centerline. The entire flight deck is divided into two areas, allowing the carrier to perform take-off and landing operations at the same time, which greatly improves the sortie efficiency."
 vnr_ship_hull_super_carrier: "Super Carrier Hull"
 vnr_ship_hull_super_carrier_desc: "As the war draws to an end, the superiority of carriers has made it bear the weight of high hopes from naval theorists. Mature technologies like enclosed hangar, armored flight deck, and new innovations such as angled deck and steam catapult, become essential parts on a modern carrier, allowing it to hold over a hundred aircraft. Due to its enormous size, a carrier of this type is usually referred as supercarrier."
 acoustic_signature: "Acoustic Signature Study"
 acoustic_signature_desc: "Acoustic signature is used to describe a combination of acoustic emissions of sound emitters, such as those of ships and submarines. Through large-scale intelligence gathering and surveillance operations during peacetime, the acoustic signatures of warships are collected and included in recognition manuals, and later distributed to sonar operators to identify enemy ships during the war."
 teardrop_hull: "Teardrop Hull"
 teardrop_hull_desc: "A teardrop hull is a submarine hull design which emphasizes submerged performance over surfaced performance. It was somewhat commonly used in the early stages of submarine development, but was gradually abandoned in the early 20th century in favour of designs optimized for high performance on the surface as a result of changes in operational doctrine. Despite that, the technology still had a profound impact in future designs of submarines."
 diesel_electric_transmission: "Diesel-Electric Transmission"
 diesel_electric_transmission_desc: "Before the invention of ship diesel engine, attempts to drive submarines with kerosene and gasoline all failed due to their high volatility. To extend submarine's submersion time, the diesel-electric power system was introduced. It is composed of diesel engine, electric engine, generator, and storage batteries. The diesel engine is used on the surface, powering the generator, while the electric engine is for submerged operations with little oxygen from air."
 basic_periscope: "Basic Periscope"
 basic_periscope_desc: "Periscopes have been used as early as 1906 on Germany's first submarine, allowing crews to observe the surface without surfacing."
 improved_periscope: "Improved Periscope"
 improved_periscope_desc: "Improved prisms and lenses are used in the manufacturing of new periscopes. This can achieve better image quality and facilitate the captain to observe enemy targets."
 advanced_periscope: "Advanced Periscope"
 advanced_periscope_desc: "New technology focuses on solving the vibration problem of periscopes while underway. With the additional mast bracket, even if the submarine sails at a speed of 6-8 knots, its periscope will not be affected by the waves. Another improvement is the increased watertightness, an upgrade that protects the optics from the shock of depth charge explosions."
 improved_ballast_tank: "Improved Ballast Tank"
 improved_ballast_tank_desc: "The newly designed ballast tank uses technologies including a more reliable water pump and a filter to prevent impurities in the water from entering it, which effectively improves its reliability."
 advanced_torpedo_ballistics: "Advanced Torpedo Ballistics"
 advanced_torpedo_ballistics_desc: "Submarines during the Great War applied hand-held slide rules or mechanical calculators to assist torpedo firing solutions, which relied on the operator's numeracy and was poor in precision. With breakthroughs in hydrodynamics and torpedo propulsion, and experiments on torpedo movements in different hydrographic conditions, it has greatly advanced submarine attack tactics."
 torpedo_loader: "Torpedo Loader"
 torpedo_loader_desc: "A torpedo loading assistance device equipped by high-speed submarine that greatly reduces reloading time. Submarines with such system can be terrible underwater killers."
 anechoic_tile: "Anechoic Tile"
 anechoic_tile_desc: "Anechoic tile is a synthetic rubber sound-proof material with a thickness of about 30mm and a cylindrical cavity with a diameter of 2-5mm inside. It can effectively suppress noise and vibration from the submarine."
 sub_AIP_engine: "Air-Independent Propulsion"
 sub_AIP_engine_desc: "AIP (Air-Independent Propulsion) is a technology that can drive a submarine for a long time without taking oxygen from the atmosphere. The underwater endurance of submarines with AIP engines is more than twice that of ordinary diesel-electric submarines."
 submarine_mass_production: "Submarine Mass Production"
 submarine_mass_production_desc: "By applying the modular building method, shipyards can launch more submarines in a relatively short period of time."
 multi_mounted_battery: "Multi-Mounted Battery"
 multi_mounted_battery_desc: "With greater mastery of complex mechanical structure, naval powers after the Great War started to invest in multi-mounted guns in a turret, in an attempt to achieve stronger firepower with similar size and tonnage. The most common one was the widely used triple-mounted turret. Quadruple guns were even stronger, but their poor reliability remained a serious drawback."
 basic_super_heavy_battery: "Early Super Heavy Battery"
 basic_super_heavy_battery_desc: "Several super-heavy naval guns were developed before the Naval Holiday. It was reported that the British N3 class would be equipped with 18-inch guns, similar armaments were also seen on the US and Japanese designs. This cannon is extremely powerful, and can easily penetrate any battleship armor."
 experimental_super_heavy_battery: "Experimental Super Heavy Battery"
 experimental_super_heavy_battery_desc: "In 1915, Admiral John Fisher proposed a super large battlecruiser to the Royal Navy, known as the HMS Incomparable. The design was intended to mount 20-inch guns, which would have been the largest ever mounted on a warship. However, the later research on 18-inch guns met various problems and ended partway after the Washington Naval Conference. Countries including Japan and Germany re-initiated development of 20-inch guns during the war, but never produced a functional model."
 improved_super_heavy_battery: "Improved Super Heavy Battery"
 improved_super_heavy_battery_desc: "Technological advances in related fields have helped naval engineers solve many problems found on the old 18-inch guns. The new super heavy guns usually use a caliber of about 18 inches, which is much more powerful than the 16-inch guns used by ordinary battleships."
 improved_medium_heavy_battery: "Improved Medium Heavy Battery"
 improved_medium_heavy_battery_desc: "Though the calibers of these guns were similar to those used by pre-dreadnoughts, their firepower and penetration were largely improved to rival those of early battlecruisers thanks to the use of modern technology."
 advanced_medium_heavy_battery: "Advanced Medium Heavy Battery"
 advanced_medium_heavy_battery_desc: "A larger caliber was adopted for main guns of large cruisers, which could be compared with some dreadnoughts."
 naval_combat_support: "Naval Logistics"
 naval_combat_support_desc: "Sea power means more than the combatant ships and aircraft. As the fleet expands, it also requires innovative management protocols and logistic personnel to operate effectively.\nWhether in peace or war, the mission of naval logistics is about providing and sustaining operational readiness by sending the right support to the right place at the right time."
 basic_port_facility: "Modern Naval Base"
 basic_port_facility_desc: "A naval base is a military base where warships are docked and maintained. It is usually located in a sheltered area with access to the sea, and is equipped with facilities for ship repair, resupply, and crew training."
 large_shipyard: "Large Shipyard"
 large_shipyard_desc: "Increasing investments in the shipbuilding industry in the 19th century have brought dramatic changes to those enterprises when seapower became one of the most decisive factors in a country's strength. Small companies were gradually eliminated or absorbed by industrial tycoons. The leading enterprises owned the largest shipyards in the world with ability to complete orders of several advanced warships at the same time."
 heavy_crane: "Heavy Crane"
 heavy_crane_desc: "A crane is generally equipped with ropes or chains and sheaves, that can be used to lift or lower heavy objects. It is extensively used in the shipbuilding industry for installing turret and other parts on a warship."
 dry_dock: "Dry Dock"
 dry_dock_desc: "Designed as a narrow basin that can be flooded to let a vessel float in and rest on a dry platform after it has been drained, the dry dock was invented thousands of years ago and is still in use today. This makes it easier to maintain and repair the underwater parts of the ship."
 port_construction_corps: "Corps of Engineers"
 port_construction_corps_desc: "Members of the corps of engineers are both construction workers and engineers. They are deployed to the front line of naval and amphibious operations, building and repairing the required infrastructure such as temporary ports, airfields, and supply bases."
 integrated_shipyard_complex: "Concentrated Shipbuilding Complex"
 integrated_shipyard_complex_desc: "By concentrating shipbuilding industry to a few key sites, it will largely improve R&D efforts, and access to essential resources and mechanical parts. Such a complex consists of a large number of shipyards, docks and other suppliers, in order to function independently under most circumstances."
 speed_over_range: "Quick Reaction"
 speed_over_range_desc: "Agility is the most important consideration in war. We should focus on the speed of naval logistics to make sure supplies are delivered to units when they are needed.\n\n"
 range_over_speed: "Global Presence"
 range_over_speed_desc: "Distance must not shield an adversary from our naval power. We should focus on the reach of naval logistics to make sure the fleet can operate in distant waters.\n\n"
 high_speed_civilian_engine: "High Speed Civilian Engine"
 high_speed_civilian_engine_desc: "Due to the cost of high speed engines, civilian ships usually adopt economical but slower ones. However, money has never been an issue in a fast-moving war."
 armed_civilian_ship: "Merchant Raider"
 armed_civilian_ship_desc: "Merchant raiders are military ships disguised as non-combatant vessels. They were widely used during the Great War for different purposes, such as anti-submarine warfare and commerce raiding."
 support_fleet: "Support Fleet"
 support_fleet_desc: "A fleet of support ships can make our navy more sustainable."
 floating_dry_dock: "Floating Drydock"
 floating_dry_dock_desc: "The floating drydock is a mobile repair platform built for the purpose of maintenance of ships at sea.\nPlaced under a ship below the waterline, water is then pumped out of the floating drydock, raising the ship above the surface. Then the ship becomes secured on the deck of the dock for repair."
 logistic_system_redundancy: "Saturated Logistics"
 logistic_system_redundancy_desc: "To ensure that the logistics system can properly function even under the worst conditions, it is crucial to have some redundancy in the initial stage of logistic operations. By storing two or three times the required supplies, we can reinforce the frontline against all odds."
 support_fleet_ncns: "Support Fleet"
 support_fleet_ncns_desc: "A fleet of support ships can make our navy more sustainable."
 floating_dry_dock_ncns: "Floating Drydock"
 floating_dry_dock_ncns_desc: "The floating drydock is a mobile repair platform built for the purpose of maintenance of ships at sea.\nPlaced under a ship below the waterline, water is then pumped out of the floating drydock, raising the ship above the surface. Then the ship becomes secured on the deck of the dock for repair."
 logistic_system_redundancy_ncns: "Saturated Logistics"
 logistic_system_redundancy_ncns_desc: "To ensure that the logistics system can properly function even under the worst conditions, it is crucial to have some redundancy in the initial stage of logistic operations. By storing two or three times the required supplies, we can reinforce the frontline against all odds."
 hospital_ship: "Hospital Ship"
 hospital_ship_desc: "A hospital ship is a ship designated primarily as a floating medical treatment facility or hospital. Most are operated by the military forces of various countries, as they are intended to be used in or near war zones."
 surgery_at_sea: "Surgery at Sea"
 surgery_at_sea_desc: "Specialised crew members capable of providing medical care have been a feature of military vessels for at least two thousand years. But the conditions aboard are far harsher than on land by the motion caused by waves, salinity, and humidity.\nWith the combined advance in medical science and shipbuilding technology, onboard surgery is made possible to save more lives on the raging sea."
 medical_supply_at_sea: "Trans-Oceanic Medical Supply"
 medical_supply_at_sea_desc: "Lessons from the Battle of Gallipoli have warned every nation of weak points in trans-oceanic supply line. When medications reach the other side of the ocean, they sometimes deteriorate due to extreme environments. By installing improved medical storage aboard ships, it will be helpful in long-range cruises and amphibious operations."
 joint_sea_hospital: "Joint Sea Hospital"
 joint_sea_hospital_desc: "With skyrocketing casualties at the front, field hospitals are usually overwhelmed to treat the wounded. The hospital ships are deployed at sea, far from the battlefield, and can relieve the overloaded hospitals on land."
 naval_fuel_complex: "Naval Oil Depot"
 naval_fuel_complex_desc: "Industrial warfare is driven by oil, especially the naval sphere. As one of the most important resources to power warships, the navy has its own secure fuel-storage complex.\nBy expanding these facilities, it will greatly improve the sustainability of our navy."
 retardant_silo: "Retardant Silo"
 retardant_silo_desc: "Fuel is extremely vulnerable to fire and heat. Applying retardant materials to the shell of fuel silos makes it safer in case of fire."
 integrated_fuel_base: "Large Fuel Base"
 integrated_fuel_base_desc: "By concentrating more fuel storage and refueling stations in one place, it can largely improve the refueling efficiency and maximum fuel capacity."
 vnr_ship_hull_civilian_1: "Auxiliary Ship Hull"
 vnr_ship_hull_civilian_2: "Fast Combat Support Ship Hull"
 vnr_ship_hull_civilian_2_desc: "When a fleet sorties, the combatant ships will never stop to wait for slower ships to catch up. A fast combat support ship can keep up the pace with the fleet and provide support even during combat."
 vnr_ship_hull_civilian_3: "Replenishment Oiler Hull"
 vnr_ship_hull_civilian_3_desc: "The replenishment oiler is a slower, all-purpose auxiliary vessel with larger fuel tanks and dry cargo holds. In addition to ship fuel, it can also provide air fuel to planes on the carrier."
 modifier_repair_speed_naval_base_factor: "Naval Base Repair Speed"
 modifier_repair_speed_dockyard_factor: "Dockyard Repair Speed"
 modifier_repair_speed_fuel_silo_factor: "Fuel Silo Repair Speed"
 modifier_repair_speed_coastal_bunker_factor: "Coastal Fort Repair Speed"
 modifier_production_cost_max_ship_hull_submarine: "Submarine Max Cost"
 rocket_depth_charges: "Anti-Submarine Missiles"
 rocket_depth_charges_desc: "Post-war submarines run quieter and at much higher speeds. They can also attack from much longer range with high speed homing torpedoes. The modern anti-submarine weapon system is in desperate need to expand its range and sensors. The Rocket Assisted Torpedo (RAT) can be delivered by rocket engine, which allows warships the stand-off capability to attack hostile submarines with little warning.\n\nMounting this module on §YLight Ships§! and §YCruisers§! will allow them to attack enemy §YSubmarines§!."
 destroyer_guided_missile_upgrade: "Guided Missile Destroyer"
 destroyer_guided_missile_upgrade_desc: "As missiles have evolved, they have become smaller in size, enabling conversion of a light ship into a formidable war machine like former battleship on the high seas.\n\nInstall §YMissile Destroyer Role§! on §YLight Hull§! to unlock §YAnti-Ship Missile§!."
 destroyer_hull_improvement: "Ocean-going Destroyer"
 destroyer_hull_improvement_desc: "Destroyer, which emerged as an escort of capital ships in the early 20th century, has grown into the de facto capital ship of a modernized fleet in the second half of the century, carrying out all kinds of missions that were designated to cruisers or even battleships. It has proven to be an economical multi-role ship with an increasingly important role in the near future."
 modern_sonar: "Integrated Sonar System"
 modern_sonar_desc: "Wartime experience showed that a standalone sonar system is not sufficient to hunt modern submarines. The integrated sonar system is the terminal of an even more complex fleet ASW network, with a higher chance to locate submarines via cross-check of data from passive and active sonars.\n\nMounting this module in an §YElectronics Slot§! on §YLight Ships§! or §YCruisers§! will help them detect enemy §YSubmarines§!."
 phased_array_radar: "Phased Array Detection System"
 phased_array_radar_desc: "The phased array detection system is an integrated battlespace sensing system used to detect and track multiple targets simultaneously. It is composed of horizontally wide rectangular antenna arrays for air surveillance, and vertically narrow rectangular antenna arrays for target tracking, both scanning electronically in azimuth. The system is usually integrated into a bigger combat system to guide and control anti-air weapons and aircraft."
 decoy_launching_system: "Decoy Launching System"
 decoy_launching_system_desc: "Commonly equipped with radio or infrared guidance systems, missiles can easily track down moving ships regardless of evasion maneuvers. To foil incoming threat, the decoy launching system provides a last line of defense to distract the guidance system of missile with chaff or infrared emitting decoys."
 new_ship_materials: "New Materials"
 new_ship_materials_desc: "Given that missiles are highly accurate and able to penetrate the thickest steel armor, it has receded in importance of warship architecture ever since the widespread adoption of guided missiles. Instead of investment to strengthen physical protection, new materials invented in laboratory are lighter, promising a higher top speed on heavy ships."
 nuclear_reactor_cost_reduction: "Economical Nuclear Reactor"
 nuclear_reactor_cost_reduction_desc: "The fission reactor stands as a triumph of human's industrial power as the world is heading towards the 1950s. In an attempt to build a full-nuclear fleet, new materials and devices are developed to reduce the cost of marine nuclear reactors."
 full_missile_ship: "Full Missile Warship"
 full_missile_ship_desc: "Featuring extraordinary precision and range, missiles made naval artillery nearly obsolete overnight and encouraged a radical fleet transformation in navies that have seen its value. Naval architects have completely abandoned the design principles of gun-ships inherited from their predecessors, and have chosen to embrace new concepts which turn modern ships into competent missile-launching platforms."
 nuclear_engine_research: "Surface Ship Nuclear Engine"
 nuclear_engine_research_desc: "Nuclear marine propulsion is typically driven by a reactor. The power plant heats water to produce steam for a turbine used to turn the ship's propeller through a gearbox or through an electric generator and motor."
 naval_tactical_data_system: "Naval Tactical Data System"
 naval_tactical_data_system_desc: "Naval Tactical Data System (NTDS) is a computerized information processing system developed in the 1950s for use in combat ships. It takes reports from multiple sensors on different ships and collates it to produce a single unified map of the battlespace. This information can then be relayed back to not only ships' COs, but also weapon operators."
 integrated_combat_system: "Integrated Combat System"
 integrated_combat_system_desc: "The Integrated Combat System is a scalable, netted combat management system, utilizing common software and computing infrastructure to rapidly field capability across all domains to the surface fleet."
 memory_expansion: "Arrayed Magnetic Core Memory"
 memory_expansion_desc: "The revolutionary breakthrough in semiconductors post-war has made expansion of memory possible on existing computers. With faster calculations, the reaction period of fire control computer against rapidly moving targets can be reduced substantially."
 comprehensive_display_system: "Comprehensive Display System"
 comprehensive_display_system_desc: "The Comprehensive Display System (CDS) is a command, control, and coordination system that displays contacts and identifications collected from radars on a single monitor. The CDS successfully reduces complexity to produce a common operational picture, and thus it can assist operators in calculating interception points either automatically or manually for friendly units against unknown targets."
 electromagnetic_signature_study: "Electromagnetic Signature Study"
 electromagnetic_signature_study_desc: "Every vessel emits an electromagnetic field, a unique physical property that can be used to identify it. Typically propagated through water, it is susceptible to being detected by underwater sensors, and needs to be kept below a certain threshold for the vessel to sail safely over sea mines or other weapon systems with magnetic guidance."
 recon_drones: "Recon Drones"
 recon_drones_desc: "An unmanned aerial vehicle (UAV), commonly known as a drone, is an aircraft without any human pilot, crew, or passengers on board. UAVs were originally developed through the 20th century for military missions too \"dull, dirty or dangerous\" for humans. Their naval variants are produced with fixed or rotor wings, and placed on ships to undertake the duty of reconnaissance and anti-submarine warfare."
 optical_landing_system: "Optical Landing System"
 optical_landing_system_desc: "As a replacement of LSOs, the optical landing system (OLS) is controlled by a computer, and thus is more reliable and efficient than humans. It is used to give glidepath information to pilots in the terminal phase of landing on an aircraft carrier with precision close to milliseconds."
 airborne_early_warning: "Carrier-Based AWACS"
 airborne_early_warning_desc: "To expand interception range and area-denial capabilities of the surface fleet, supercarriers are equipped with AWACS (Airborne Early Warning and Control) aircraft carrying advanced radar and tracking systems. The airborne radar system is designed to detect aircraft, ships, vehicles, missiles, and other incoming projectiles at long ranges and perform command and control of the battlespace during air engagements by directing fighters and air strikes."
 iff_device: "IFF Device"
 iff_device_desc: "First developed during the war alongside advances in radar and several friendly fire incidents, the \"Identification, friend or foe\" (IFF) is an identification system designed for command and control. It uses a transponder that listens for an interrogation signal and then sends a response that identifies the broadcaster."
 tactical_air_navigation_system: "Tactical Air Navigation System"
 tactical_air_navigation_system_desc: "A tactical air navigation system, commonly referred to by the acronym TACAN, is an upgraded version compared to a single-sourced radio beacon, typically used by military aircraft. It provides the user with bearing and slant range to a ground or ship-borne station."
 sub_nuclear_engine: "Submarine Nuclear Engine"
 sub_nuclear_engine_desc: "The conceptual design of the first nuclear submarine began in the late 1940s as advances in nuclear technology allowed smaller power plants to be installed on platforms such as submarines. Designed as a pressurized water reactor, the new submarine reactor can offer infinite range, making submerged endurance theoretically unlimited."
 wire_guided_torpedo: "Wire-Guided Torpedo"
 wire_guided_torpedo_desc: "A wire-guided torpedo is a torpedo that is guided by signals sent to it via thin wires connected between the torpedo and its guidance mechanism, which is located somewhere near the launch site."
 sonar_telephone: "Sonar Short-Range Communication"
 sonar_telephone_desc: "The underwater telephone is used on all crewed submersibles and many naval surface ships in operation. Voice or an audio tone (Morse code) communicated through the sonar system are heterodyned to a high pitch for acoustic transmission through water which allows short-range communications between submarines."
 hydrocooling_battery: "Hydrocooling Battery"
 hydrocooling_battery_desc: "The ability of a submarine to operate underwater and return to the surface was largely due to a large bank of lead-acid batteries that required nearly constant attention by the boat's crew. With the hydrocooling system installed, the storage battery could work for a longer period thus improving its durability."
 rescue_submarine: "Rescue Submarine"
 rescue_submarine_desc: "The rescue submarine, or sometimes referred as deep-submergence rescue vehicle (DSRV), is a type of vehicle used to rescue crews from downed submarines. It has a pressure hull with internal space to carry several survivors. While carrying out rescue missions, it will lock onto the submarine's escape hatch surrounds, and pump out the water from the space between its hatch."
 unmanned_gun_turret: "Remote-Controlled Gun Turret"
 unmanned_gun_turret_desc: "By the 1950s, turrets have been shrunk in size and automated to adapt to the changing dynamics of war, with computer-directed guns controlled remotely from the ship's control center."
 modern_generic_battery: "Naval Automatic Gun System"
 modern_generic_battery_desc: "The \"SjöAutomatKanon\" (SAK), or Naval Automatic Gun System, was an automatic dual-purpose weapon system developed by the Swedish military immediately after the Second World War. The advent of jet aircraft saw great improvement in its speed in the late-war period when a jet plane could fly up to 1,000 kilometres per hour, rendering anti-air guns ineffective against it. With fire-control computers and quick-firing guns, SAK can fire enough rounds in a short period to improve the chance of a hit."
 coldwar_ship_torpedo_launcher: "Cold War Torpedo Launcher"
 coldwar_ship_torpedo_launcher_desc: "Because of improved submarine strength and speed, post-WWII torpedoes were given improved warheads and better motors.\n\nMounting this module on §YLight Ships§! or §YCruisers§! allows them to do significant damage to enemy §YCapital Ships§!."
 modern_periscope: "Modern Submarine Sensing System"
 modern_periscope_desc: "To adapt the submarine for harsher environment in the face of advanced detectors and armaments, an integrated sensing system has been adopted, combining with radar, sonar, and dual-periscope system. On top of developed and compact electronics, the streamlined conning tower can take a balanced approach between speed, stealth, and space."
 wake_homing_torpedo: "Wake Homing Torpedo"
 wake_homing_torpedo_desc: "The wake is the region of disturbed flow downstream of a solid body moving through a fluid, caused by the flow of the fluid around the body. Naval engineers have exploited such phenomenon and invented a guidance technique based on the wake trajectory left behind a moving target. A torpedo equipped with wake homing system will be fired to cross behind the target's stern and damage its propulsion and steering."
 proximity_detonator: "Proximity Detonator"
 proximity_detonator_desc: "A torpedo fitted with a proximity fuze can be detonated directly under the keel of a target ship. The explosion creates a gas bubble which may damage the keel or underside plating of the target. However, the most destructive part of the explosion is the upthrust of the gas bubble, which will bodily lift the hull in the water. The structure of the hull is designed to resist downward rather than upward pressure, causing severe strain in this phase of the explosion."
 improved_ship_torpedo_launcher: "Improved Torpedo Launcher"
 advanced_ship_torpedo_launcher: "Advanced Torpedo Launcher"
 modern_ship_torpedo_launcher: "Modern Torpedo Launcher"
 oxygen_torpedo: "Compressed Oxygen Torpedo"
 oxygen_torpedo_desc: "The amount of fuel that can be burned by a torpedo engine is limited by the amount of oxygen it carries. Since compressed air contains only about 21% oxygen, pure oxygen, despite the cost, is used to power a torpedo in exchange for higher speed and range. Its performance is unmatched by any contemporary torpedoes in service.\n\n"
 electric_torpedo: "Electric Torpedo"
 electric_torpedo_desc: "Instead of leaving an easily-detected trail of bubbles, a torpedo with an electrical engine remains practically invisible until it hits. This also means that there is no trail leading back to the launching submarine.\n\n"
 tactical_data_link: "Tactical Data Link"
 tactical_data_link_desc: "The Tactical Data Link introduces a data link standard of communication via radio waves or cable. All military C3 systems use standardized data link to transmit, relay and receive tactical data, making the data transmission between friendly units secure and efficient.\n\n§YOnce researched, your allies will be granted a decision to access your data link. If they agree, they won't be allowed to research their own equivalent.§!"
 tactical_data_link_for_member: "Access to Allied Tactical Data Link"
 tactical_data_link_for_member_desc: "The Tactical Data Link introduces a data link standard of communication via radio waves or cable. All military C3 systems use standardized data link to transmit, relay and receive tactical data, making the data transmission between friendly units secure and efficient."
 signal_control: "Electromagnetic Signal Regulation"
 signal_control_desc: "With more electronic systems aboard, a ship's position becomes transparent to both sides. The regulation on electromagnetic signals was adopted to ensure that all devices function on standardized frequencies, and make the fleet electronically invisible."
 advanced_radar_finder: "Radar Finder"
 advanced_radar_finder_desc: "Radar is a device that emits radio waves to determine the distance, direction and radial velocity of objects relative to the site. The radar finder exploits this feature and determines direction of a radio source with multiple direction-finding antennas by triangulation."
 close_in_area_air_defense: "Close-in Area Air Defense"
 close_in_area_air_defense_desc: "During the Second World War, fleets were often faced with low-altitude air threats posed by suicide planes and radio-guided cruise missiles. Following the refit and modernization of wartime destroyers, these ships will be the last barrier against these threats."
 wave_resistance_design: "Wave Resistance Design"
 wave_resistance_design_desc: "Huge waves on the high seas have been the biggest challenge to ships for the past few centuries, especially for light ships such as destroyers. By using a fine bow with a sharper angle, it can push the wave out of the way more gradually. The amount of energy required to displace the water will be less, making the ship sail steadily."
 cryptography_revolution: "Cryptography Revolution"
 cryptography_revolution_desc: "Inspired by unprecedented computing power after the war, cryptography has seen breakthroughs in both encryption algorithms and communication technologies. The engineering advance, usually represented by electronic encrypting machines, advanced algorithms, and frequency-hopping technology, marks a huge improvement in terms of protecting military information."
 luneburg_lens: "Luneburg Lens"
 luneburg_lens_desc: "A Luneburg lens is a spherically symmetric gradient-index lens and can be made for use with electromagnetic radiation from visible light to radio waves. First introduced by Prof. Rudolf Luneburg, this device can be used in the manufacture of microwave antennas. Compared to parabolic dish, the antenna with Luneburg lens offers a significant advantage, which it does not have to bodily rotate the whole antenna since the electronic feed is movable around the lens."
 converted_super_heavy_carrier: "Converted Super Heavy Carrier"
 bb_conversion_carrier: "Heavy Converted Carrier"
 advanced_missile_system: "Active Radar Homing Missile"
 advanced_missile_system_desc: "The post-war revolution in electronics has made smaller guidance systems possible. The active radar homing technology allows the missile to carry radar transceivers and electronics necessary to find and track its target autonomously, which becomes the precursor to the later fire-and-forget technologies."
 ship_hull_super_heavy: "Super Heavy Hull"
 ship_hull_super_heavy_desc: "The rapid increase of resources devoted to naval construction after the end of major land conflict during the Great War initially produced these designs, which featured the beginnings of the trends towards sudden growth in size, firepower, armor, caliber, and cost. Such vessels set the world's leading naval powers apart from the mere pretenders to greatness, but suffered from design flaws and persistent mechanical problems. They are armed with eight to ten 18 inch or equivalent main guns, and have the protection to go toe-to-toe with similarly armed ships. With the Naval Holiday, these monsters were buried by time."
 cruiser_submarines: "Cruiser Submarine Hull"
 cruiser_submarines_desc: "Significantly larger than preceding submarines, these designs are of the cruiser type, designed for long-range independent operations in commerce raiding and intended to be better equipped to handle combat with enemy light warships while surfaced. As such, they carry heavier gun armament, and have greater surface speed. Their submerged capabilities, however, remain limited."
 heavy_armor_research_tt: "\n§GBreakthrough in heavy armor plate will in turn aid research into cruiser armor.§!"
