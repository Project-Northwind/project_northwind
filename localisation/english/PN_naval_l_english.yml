 ship_hull_carrier: "Carrier"
 ship_hull_carrier_desc: "A capital ship able to carry wings of powerful carrier capable aircraft into battle. Also useful as a floating airfield you can position off the coast of your enemy."
 ship_hull_carrier_0: "Great War Carrier Hull"
 vnr_ship_hull_carrier_conversion_bb: "Converted Battleship Hull"
 vnr_ship_hull_carrier_conversion_bb_desc: "The first large aircraft carriers, these ships are mainly built on hulls that were originally intended for capital warships but, because of the Washington Naval Treaty, converted and completed as carriers. Only a handful of navies built such ships, and their designs varied greatly; their aircraft capacities ranged from the low sixties to a hundred. There are constants though, such as retained heavily armoured belts and other gun-warship features. Semi-experimental and unreliable, they are still incredibly formidable weapons, and laid the foundations for following generations of fleet carriers."
 vnr_ship_hull_carrier_conversion_ca: "Early Carrier Hull"
 vnr_ship_hull_carrier_conversion_ca_desc: "Having learned from the experience of using seaplane tenders, those navies with the resources to do so began work on the next generation of ships that could carry aircraft at sea. Unlike their predecessors, these carriers are designed with flight decks to allow for aircraft to both fly off of them and to then return and land on them. Converted from civilian ships and seaplane tenders, or built on purpose, most of these ships are limited by having relatively cramped flight decks and hangars, but they definitely demonstrate that ships are capable of effectively operating air complements at sea."
 vnr_ship_hull_carrier_1: "Improved Carrier Hull"
 vnr_ship_hull_carrier_2: "Advanced Carrier Hull"
 vnr_ship_hull_carrier_3: "Modern Carrier Hull"
 ship_hull_submarine: "Submarine"
 ship_hull_submarine_desc: "A far cry from the crude boats of the Great War, the modern submarine is more capable than ever before and can threaten even the biggest ship for a very moderate cost."
 vnr_ship_hull_submarine_1: "Great War Submarine Hull"
 vnr_ship_hull_submarine_2: "Improved Submarine Hull"
 vnr_ship_hull_submarine_3: "Advanced Submarine Hull"
 vnr_ship_hull_submarine_4: "Modern Submarine Hull"
 vnr_ship_hull_pre_dreadnought: "Pre-Dreadnought Hull"
 vnr_ship_hull_pre_dreadnought_desc: "Followed the design of the British Majestic-class of the late 1890s, Pre-Dreadnought battleships replaced the ironclad battleships of the 1870s and 1880s. Built from steel, and protected by hardened steel armour, pre-dreadnought battleships carry a main battery of very heavy guns in barbettes supported by one or more secondary batteries of lighter weapons.\n\nSince the 'Dreadnought' design made them obsoleted since before the World War, coupled with the gigantic rise of Dreadnought-based designs in the previous three decades, only a few of them are still in service."
 vnr_ship_hull_cruiser_coastal_defense_ship: "Coastal Defense Ship Hull"
 vnr_ship_hull_cruiser_coastal_defense_ship_desc: "Coastal defence ships are small, often cruiser-sized warships that sacrificed speed and range for armour and armament. They are usually attractive to nations that either could not afford full-sized battleships or could be satisfied by specially designed shallow-draft vessels capable of littoral operations close to their own shores."
 vnr_ship_hull_torpedo_cruiser: "Torpedo Cruiser Hull"
 vnr_ship_hull_torpedo_cruiser_desc: "Light cruisers equipped with a large number of torpedo tubes, at the cost of a smaller main battery and fewer anti-aircraft guns."
 vnr_ship_hull_super_heavy_1: "Super Heavy Hull"
 vnr_ship_hull_cruiser_submarine: "Cruiser Submarine Hull"
 vnr_ship_hull_cruiser_submarine_desc: "Significantly larger than preceding submarines, these designs are of 'cruiser' type, designed for long-range independent operations in commerce raiding and intended to be better equipped to handle combat with enemy light warships while surfaced. As such, they carry heavier gun armament, and have improved surface speed. Their submerged capabilities, however, remain limited."
 vnr_ship_hull_midget_submarine: "Midget Submarine"
 vnr_ship_hull_midget_submarine_desc: "A small-sized submarine operated by a small crew. Its reduced range and weapon capacity is offset by a high production rate."
 ship_hull_civilian: "Auxiliary Ship"
 ship_hull_civilian_desc: "A ship designed for fleet support."
 screen_ship: "Screens"
 capital_ship: "Capital Ships"
 vnr_ship_hull_light_6: "Cold War Light Hull"
 vnr_ship_hull_light_6_desc: "After the Second World War, conventional destroyers built during this period were significantly larger than wartime ships and had fully automatic main guns, unit machinery, radar, sonar, and anti-submarine weapons such as the squid mortar. With ship-based missiles first introduced in the 1950s, guided missile destroyers were developed to carry these weapons and protect the fleet from air, underwater, and surface threats."
 vnr_ship_hull_cruiser_6: "Cold War Cruiser Hull"
 vnr_ship_hull_cruiser_6_desc: "The rise of air power during World War II dramatically changed the nature of naval combat. Even the fastest cruisers could not maneuver quickly enough to evade aerial attack in the face of aircraft with moderate-range standoff capabilities.\n\nSince battleships were completely outdated in the advent of missiles, cruisers became the largest capital ships in the second half of the 20th century. Some of them adopted full missile designs and even applied nuclear engines."
 vnr_ship_hull_submarine_5: "Cold War Submarine Hull"
 vnr_ship_hull_submarine_5_desc: "In the 1950s, nuclear power partially replaced diesel–electric propulsion. Equipment was also developed to extract oxygen from sea water. These two innovations gave submarines the ability to remain submerged for weeks or months."
 ocean_liner_equipment: "Ocean Liner"
 ocean_liner_equipment_desc: "A type of private-owned passenger ship primarily used for transportation across seas or oceans.\n§HIt can be used as a primitive floating harbor in amphibious operations.§!"
 ocean_liner: "Ocean Liner"
 ocean_liner_desc: "A type of private-owned passenger ship primarily used for transportation across seas or oceans.\n§HIt can be used as a primitive floating harbor in amphibious operations.§!"
 vnr_ship_hull_merchant_carrier: "Merchant Carrier Hull"
 vnr_ship_hull_merchant_carrier_desc: "Merchant carrier is a limited-purpose aircraft carrier adapted by adding a flight deck to bulk grain ship or oil tanker enabling it to operate anti-submarine aircraft in support of convoys."
 vnr_ship_hull_mega_carrier: "Strategic Strike Carrier Hull"
 vnr_ship_hull_mega_carrier_desc: "By the late 1940s, nuclear weapons has seen usage in real combat. Its horrible power unleashed upon populated cities forced every major country to develop and deploy tools of nuclear triad. Heavy jet bombers were the only way to send nuclear bombs to distant location before the invention of ICBMs. It prompted navy to propose a mobile platform of launching nuclear raids, which was the strike carrier."
 vnr_ship_hull_arsenal_ship: "Arsenal Ship Hull"
 vnr_ship_hull_arsenal_ship_desc: "Development and mass production of rockets has made missiles even cheaper than other measures of war. The concept of a large surface ship carrying hundreds of missiles was brought up to engage in heavy and accurate shore bombardment. Some experts called it the arsenal ship."
 vnr_ship_hull_escort_carrier: "Escort Carrier Hull"
 vnr_ship_hull_escort_carrier_desc: "Rampant threats from submarines during the war have made protection on convoys the key to victory. Unlike fleet carrier, escort carrier is cheaper and faster to produce. It excels in anti-submarine warfare and providing air cover, making them ideal for securing trade routes"
 vnr_ship_hull_carrier_amphibious_assault_ship: "Amphibious Assault Ship Hull"
 vnr_ship_hull_carrier_amphibious_assault_ship_desc: "Amphibious assault ship is a type of aircraft carrier designed to support and deploy ground forces during amphibious operations. Equipped with a well deck for launching landing craft and a flight deck for operating helicopters, these ships play a crucial role in projecting power from the sea to the shore. They are essential for conducting beach landings, humanitarian missions, and providing air support for ground troops."
