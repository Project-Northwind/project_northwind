l_english:
  XIC_german_staff_seminars: "Convene the German Staff Seminars"
  XIC_german_staff_seminars_desc: "The German officers will review our artillery handling and staff procedures. After thirty days Zhang must decide which recommendations receive the first allocation."
  XIC_jinan_command_course: "Sponsor a Jinan Command Course"
  XIC_jinan_command_course_desc: "Assign ten army experience and fifty political power to a forty-five-day course. One serving commander will study the planning and supply problems encountered by the army."
  XIC_national_command_course: "Send an Officer to the National Staff College"
  XIC_national_command_course_desc: "The expanded staff college can train another serving commander. Its forty-five-day programme costs ten army experience as well as its political allocation."
  XIC_veterans_staff_conference: "Convene the Former Officers"
  XIC_veterans_staff_conference_desc: "The officers who completed re-education still possess knowledge of the old army. Their conference will recommend an allocation to manuals, battalion training or the transport service."
  XIC_nanjing_arsenal_inventory: "Inventory the Nanjing Arsenals"
  XIC_nanjing_arsenal_inventory_desc: "Survey the depots inherited from the former government. The commission will identify serviceable weapons and machinery that could restore a military workshop."
  XIC_standardise_workshop_orders: "Standardise the Workshop Orders"
  XIC_standardise_workshop_orders_desc: "Commit three hundred rifles and fifty political power to prototype testing and a common workshop order. The final allocation can supply a modern equipment batch or fund artillery research."
  XIC_independent_technical_mission: "Prepare an Independent Technical Mission"
  XIC_independent_technical_mission_desc: "The foreign ministry will prepare a choice of German military blueprints, British industrial advice or a domestic research allocation. Buying foreign advice will require a further seventy-five political power."
  XIC_national_programmes: "National Programmes"
  XIC_national_programmes_desc: "The army, ministries and workshops submit practical proposals. Allocations commit political funds, experienced officers and equipment to programmes that must be completed before their recommendations can be adopted."
  PN_XIC_programmes.1.t: "The German Officers Submit Their Report"
  PN_XIC_programmes.1.desc: "Falkenhausen places two reports before Zhang. The artillery instructors ask for a common gunnery syllabus and standard ammunition tables. The staff officers want the same allocation spent on exercises linking battalions, artillery and supply columns.\n\nZhang asks which programme the academy can carry through with the officers and funds already assigned. Both proposals have merit; the first allocation must go to one of them."
  PN_XIC_programmes.1.a: "Adopt the gunnery syllabus."
  PN_XIC_programmes.1.b: "Adopt the staff exercise programme."
  PN_XIC_programmes.2.t: "An Allocation to the Staff College"
  PN_XIC_programmes.2.desc: "The college has prepared a course around problems reported by the field armies: moving supplies into towns, planning cavalry reconnaissance and coordinating infantry with artillery.\n\nZhang will nominate a serving commander. Xueming has asked to study the supply requirements of urban operations, He Zhuguo has submitted his reconnaissance plans, and Wang Yizhe has brought the reports from his infantry formations. The allocation will fund one commander this term."
  PN_XIC_programmes.2.a: "Assign Zhang Xueming to the course."
  PN_XIC_programmes.2.b: "Assign He Zhuguo to the course."
  PN_XIC_programmes.2.c: "Assign Wang Yizhe to the course."
  PN_XIC_programmes.2.d: "Return the allocation if no commander can attend."
  PN_XIC_programmes.3.t: "The Former Officers Take Their Seats"
  PN_XIC_programmes.3.desc: "The officers who completed re-education enter a room where several once served a different government. Their first assignment is practical. Zhang wants to know which parts of their former service can strengthen the national army.\n\nThe recommendations concern artillery manuals, battalion staff training and transport stores. The commission has been ordered to judge their proposals by their usefulness, and to give the men a task in which they can demonstrate their acceptance of national command."
  PN_XIC_programmes.3.a: "Recover their artillery manuals."
  PN_XIC_programmes.3.b: "Assign them to battalion staff training."
  PN_XIC_programmes.3.c: "Have the quartermasters reorganise the transport reserve."
  PN_XIC_programmes.4.t: "One Chain of Command"
  PN_XIC_programmes.4.desc: "The question before the staff is how orders will reach formations whose officers and soldiers entered the army by very different roads. Zhang insists that no political organisation or provincial commander may keep a private chain of command.\n\nOne proposal places trained liaison officers at army headquarters. Another builds a network of transport and communications sections drawn from the civilian administration. Either can work, but both require the government to commit resources beyond a declaration of unity."
  PN_XIC_programmes.4.a: "Fund the liaison officers at headquarters."
  PN_XIC_programmes.4.b: "Fund the transport and communications sections."
  PN_XIC_programmes.5.t: "The Nanjing Arsenal Inventory"
  PN_XIC_programmes.5.desc: "The inventory contains rifles and artillery that can be returned to service, alongside machinery removed from damaged workshops. The army wants the weapons issued now. The engineers believe one workshop can be restored if the government provides a further allocation.\n\nThe commission has separated the two proposals. Taking the recovered stores will support the current army; restoring the workshop will put the surviving machinery back into production."
  PN_XIC_programmes.5.a: "Issue the serviceable stores."
  PN_XIC_programmes.5.b: "Spend the extra allocation on restoring a workshop."
  PN_XIC_programmes.5.c: "Return the survey funds if the arsenal is lost."
  PN_XIC_programmes.6.t: "A Common Order for the Workshops"
  PN_XIC_programmes.6.desc: "The prototype rifles have been stripped and inspected. The workshop representatives can now produce a common equipment batch using the surviving tools, or turn the allocation toward the artillery designs recommended by the staff.\n\nThe decision will settle the next order rather than dictate every future design. Zhang asks the officers to choose what the army can put to use, and the workshops to accept one set of specifications."
  PN_XIC_programmes.6.a: "Place the common rifle and support-equipment order."
  PN_XIC_programmes.6.b: "Adopt the artillery research programme."
  PN_XIC_programmes.8.t: "Industry Without Foreign Direction"
  PN_XIC_programmes.8.desc: "The ministry has prepared the technical mission on the condition that buying advice will not bind China to a foreign political programme. The remaining budget must now be assigned.\n\nGerman military specialists can be approached over artillery designs, while British firms may provide industrial drawings and technical instruction. The domestic institutes have proposed a smaller research allocation if the government prefers to keep the work at home."
  PN_XIC_programmes.8.a: "Purchase the German artillery drawings."
  PN_XIC_programmes.8.b: "Purchase the British industrial drawings."
  PN_XIC_programmes.8.c: "Assign the budget to our own technical institutes."
  XIC_headquarters_liaison_officers: "Headquarters Liaison Officers"
  XIC_headquarters_liaison_officers_desc: "A funded liaison service carries common staff procedures between headquarters and the formations in the field."
  XIC_civil_transport_sections: "Civil Transport Sections"
  XIC_civil_transport_sections_desc: "The government is funding transport and communications sections alongside the army supply service."
  XIC_gunnery_syllabus: "The Common Gunnery Syllabus"
  XIC_german_staff_exercises: "German Staff Exercises"
  XIC_recovered_artillery_manuals: "Recovered Artillery Manuals"
  XIC_battalion_staff_training: "Battalion Staff Training"
  XIC_standardised_artillery_designs: "Standardised Artillery Designs"
  XIC_german_technical_mission: "German Technical Mission"
  XIC_british_technical_mission: "British Technical Mission"
  XIC_domestic_technical_mission: "Domestic Technical Mission"
  PN_XIC_programmes.9.t: "The Terms We Carry to the Provinces"
  PN_XIC_programmes.9.desc: "Wang Ming has brought the proposed terms for the provincial delegations. The League can offer immediate entry into national administration, or place greater weight on a transitional autonomous government. Zhang asks which promise the delegates should be authorised to make.\n\nThe first approach offers a quicker end to provincial command. The second leaves more room for local officials to settle accounts and transfer their responsibilities. The decision will guide the delegations rather than guarantee their success."
  PN_XIC_programmes.9.a: "Make direct national integration the preferred settlement."
  PN_XIC_programmes.9.b: "Give provincial governments a transitional guarantee."
  XIC_direct_integration_terms_tt: "Provincial governments are more likely to accept §Ydirect integration§!."
  XIC_transitional_autonomy_terms_tt: "Provincial governments are more likely to accept §Ytemporary autonomy§!."
  PN_XIC_programmes.10.t: "Letters From the Northeast"
  PN_XIC_programmes.10.desc: "The first reports have reached Zhang through men who remained in the Northeast. Former officers offer safe houses and contacts in the towns. Railway workers have described stores of usable equipment and lines that could support an advance.\n\nThe staff can support one network with the allocation already committed. The officers can make a resistance delivery more efficient; the railway contacts can help recover more engines for the supply service."
  PN_XIC_programmes.10.a: "Support the officers and their town contacts."
  PN_XIC_programmes.10.b: "Support the railway workers and depot contacts."
  XIC_manchurian_military_contacts_tt: "The Manchurian resistance delivery requires §Y300 rifles§! instead of §Y500§!."
  XIC_manchurian_railway_contacts_tt: "The northern railway contract delivers §Y3 additional trains§!."
  XIC_manchurian_reconnaissance: "Re-establish Contacts in the Northeast"
  XIC_manchurian_reconnaissance_desc: "Spend twenty-one days reopening the northern intelligence networks. The staff will then choose between military contacts and railway workers, improving one of the preparations for the return to Manchuria."
  XIC_administration_integration_improvement_tt: "Provincial integration becomes §Gcheaper and faster§!."
