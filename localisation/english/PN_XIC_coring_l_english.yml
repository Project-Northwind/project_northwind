l_english:
  XIC_chinese_state_integration: "Integrating the Chinese Provinces"
  XIC_chinese_state_integration_desc: "Use the map decisions to integrate one owned, fully controlled Chinese state at a time. Integration costs political power and time; administrative focuses reduce both. Lost territory can be integrated again after it is recovered."
  XIC_chinese_state_claims_tt: "Gain §Yclaims on all Chinese states§! that are not already our cores. Provincial integration decisions establish new cores."
  XIC_chinese_integration_rules_tt: "Integrate owned, fully controlled Chinese states through timed map decisions."
  XIC_chinese_integration_local_administration_tt: "§YProvincial integration§!: completing one administrative focus unlocks cheaper, faster map decisions. In the Republic, establish territorial League branches; in the National State, complete either reconstructionist outreach or The People Only Need Me."
  XIC_chinese_integration_professional_administration_tt: "§YProvincial integration§!: completing both administrative focuses unlocks the lowest costs and shortest integration times. The Republic requires territorial League branches and A State Beyond the Officer Corps; the National State requires reconstructionist outreach and The People Only Need Me."
  XIC_integrate_north_basic: "Integrate a Northern Province"
  XIC_integrate_north_basic_desc: "Provincial Commission: spend 50 political power and 90 days bringing [FROM.GetName] into the national administration. We must remain independent, avoid capitulation, and own and fully control the state. Completion grants a core and removes our claim. Interrupted work can be restarted."
  XIC_integrate_north_local: "Integrate a Northern Province"
  XIC_integrate_north_local_desc: "Local Administration: spend 40 political power and 75 days bringing [FROM.GetName] into the national administration. We must remain independent, avoid capitulation, and own and fully control the state. Completion grants a core and removes our claim. Interrupted work can be restarted."
  XIC_integrate_north_professional: "Integrate a Northern Province"
