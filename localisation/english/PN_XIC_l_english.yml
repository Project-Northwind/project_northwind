  XIC_the_countryside_revitalization_economy_tt: "Modify §Y$XIC_national_reconstruction_economy$§! by:\nConstruction Speed: §G+5.00%§!\nResource Gain Efficiency: §G+5.00%§!\nConsumer Goods Factories: §Y-2.50%§!"
