  PN_XIC.4.t: "The Army That Marched East"
  PN_XIC.4.desc: "The men gathering in Shangdong have fought for years without a homeland to return to. In the campaigns of 1934 and 1935, the Northeastern Army repeatedly blocked Communist attempts to establish a northern sanctuary. Those victories kept the Communist movement concentrated in the south, but cost the army men, equipment and time that its officers had hoped to spend preparing for Manchuria.\n\nWhen the front came under renewed pressure, Zhang requested reinforcements, ammunition and transport. Nanjing's refusal broke what remained of his confidence in Chiang's command. The withdrawal east became a fighting march as government formations tried to obstruct it. Supply shortages, defections and clashes followed the columns towards Shangdong.\n\nWe have reached a base from which the army can survive. The Communists have not been destroyed, and our own losses cannot be wished away. Yet the force that arrived in Jinan remains intact, and its future will no longer be decided in Nanjing."
  PN_XIC.4.a: "We have earned the chance to rebuild."
  PN_XIC.5.t: "The Young Marshall"
  PN_XIC.5.desc: "Zhang Xueliang inherited his father's command, but the Japanese seizure of Manchuria left him an army without its home. His officers continued to look towards the northeast even as successive campaigns drew them deeper into China's internal struggles.\n\nHe did not begin as an enemy of national unity, nor did his break with Chiang mean sympathy for the Communists. It grew from the conviction that Nanjing would keep spending the Northeastern Army without providing the means to finish its campaigns or recover its homeland.\n\nNow the Young Marshall stands at the head of an independent government. His officers owe him their loyalty, but loyalty alone cannot feed a province or build a national army. The authority he preserved on the march must become the foundation of a state capable of rebuilding China."
  PN_XIC.5.a: "An army must have a purpose beyond survival."
  PN_XIC.6.t: "A Government in Jinan"
  PN_XIC.6.desc: "Maps, tax registers and railway schedules cover the desks of our new offices in Jinan. The Northeastern Army has secured administrative centres and transport routes, but occupying a province is not the same as governing it. Food must reach the towns, workshops need materials and the treasury must pay the men who keep both functioning.\n\nMilitary officers hold the first appointments. Local forces must accept the new command structure, while engineers, railway officials, industrial managers and financiers are called in to repair the machinery of administration. Zhang retains the final authority over them all.\n\nShangdong offers agriculture, industry and access to the sea. If these resources can be brought together, the Reconstruction Government will have more than a refuge. Jinan can become the starting point of a national programme."
  PN_XIC.6.a: "Let the work of reconstruction begin."
  PN_XIC.7.t: "The Failures of Nanjing"
  PN_XIC.7.desc: "The newspapers carry another declaration from Nanjing insisting that only the central government can speak for China. In the barracks and government offices of Jinan, the words meet a cold reception. Men who asked for ammunition remember the answers they received; officers who spoke of Manchuria remember the campaigns they were ordered to fight instead.\n\nAt a public address, Zhang returns to the same question: what has a claim to national authority achieved if the country remains divided and its armies are denied the means to defend it? The movement's speakers carry that challenge through Shangdong.\n\nFor our supporters, reconstruction is becoming more than a promise of recovery. It is an answer to a government they believe has failed them."
  PN_XIC.7.a: "China deserves a government that will act."
  PN_XIC.8.t: "The Jinan Military Academy"
  PN_XIC.8.desc: "The first senior course at the Jinan Military Academy is ready. Its instructors have combined the experience of the Eastern March with German staff methods, placing particular emphasis on planning, supply and command under pressure.\n\nZhang has approved two places for serving commanders. The first officer must now be selected."
  PN_XIC.9.t: "The Second Commission"
  PN_XIC.9.desc: "The first appointment has been settled. One place remains on the academy's senior course, and it must go to another commander. The army will benefit most when the lessons learned in Jinan are carried back to more than one headquarters."
  PN_XIC.10.t: "The First Council"
  PN_XIC.10.desc: "The officers and civilian administrators assemble in Jinan beneath the emblem of the Reconstruction Movement. Reports on the workshops, the academy and the government's finances have been placed before every seat. For the first time since the march, the discussion concerns what can be built next rather than what must be saved before nightfall.\n\nZhang opens the council by acknowledging the men who did not reach Shangdong. Their sacrifice, he says, has purchased a foothold, not an excuse to remain a provincial army. The government must decide how that foothold will serve China."
  PN_XIC.10.a: "Hear the council."
  PN_XIC.11.t: "The Officers Ask"
  PN_XIC.11.desc: "An officer rises after the reports. The army is stronger, he says, but northern China remains divided among commands that recognise no authority beyond their own. Shall the government consolidate Shangdong, return towards Manchuria, or march against Nanjing? Others ask about the western flank and the road to Beiping.\n\nZhang lets each question be heard before answering. A rush south would leave hostile armies behind us. A march towards the northeast would fail without a secure base. The northern warlords must first be defeated or brought under one command. Shanxi cannot be allowed to dictate our western frontier, nor Hebei-Chahar the approaches to the old capital."
  PN_XIC.11.a: "The north must be secured first."
  PN_XIC.12.t: "One State, One Army"
  PN_XIC.12.desc: "Zhang stands beside the map. Shangdong has shown that the movement can keep an army supplied and an administration working. It must now prove that reconstruction belongs to the nation, not to a single province.\n\nThe northern campaigns will bring the divided commands into one army. Beiping will become the seat of a government prepared to claim responsibility for all China. From that position, the movement can confront Nanjing and prepare the country to resist Japan. No commander is to carve out another private domain from the victories ahead.\n\nFor a moment the room is quiet. Then an officer begins to applaud. Others rise with him, until the chamber answers the Marshall with a single sustained ovation."
  PN_XIC.12.a: "For China, and for reconstruction."
  PN_XIC.13.t: "A Celebration of the Nation"
  PN_XIC.13.desc: "Crowds fill the streets of Beijing as the troops pass beneath the flags of the Reconstruction Government. Families who remember the uncertainty of the march now watch their sons parade through the capital. In the government offices, the transfer from Jinan has become something more than a change of address.\n\nZhang's speech honours the dead before turning to the living. A capital cannot be held by ceremonies alone: it needs employment, supplies and the means to support the army defending it. Funds are released for new civilian workshops and an armaments factory in the city.\n\nBy evening the crowds have begun to disperse, but work crews are already marking out the first sites."
  PN_XIC.13.a: "Let the capital share in our reconstruction."
  PN_the_national_state_of_china: "The National State of China"
  PN_the_national_state_of_china_desc: "Negotiation has been rejected. The government built in Shangdong must now assume responsibility for the nation as a whole, with Zhang Xueliang at its head. Nanjing will become the seat of a National State founded on Reconstructionism, not a settlement with the Communist movement."
  PN_destruction_of_the_communists: "Destruction of the Communists"
  PN_destruction_of_the_communists_desc: "The Communist leadership has been offered no place in the new political order. Its independent commands and underground organisations must be dismantled before they can challenge the National State. The government will carry reconstruction into the districts they once controlled."
  PN_one_ideology_one_china: "One Ideology, One China"
  PN_one_ideology_one_china_desc: "Military victory cannot hold the country together while every province teaches a different political allegiance. Reconstructionism must give the administration, the schools and the army a common understanding of national service. China will have one state and one governing movement."
  PN_the_grand_uniter: "The Grand Uniter"
  PN_the_grand_uniter_desc: "The authority Zhang exercised on the march must be given a national form. The office of Grand Uniter will place defence, senior appointments and the direction of the state under his final command. The Council may advise and administer, but the responsibility for China's unity will remain his."
  PN_the_people_only_need_me: "The People Only Need Me"
  PN_the_people_only_need_me_desc: "The movement's newspapers and public ceremonies will present Zhang as the figure who brought an end to division. His supporters argue that another contest between parties would only reopen the wounds of the old republic. The people's hopes for reconstruction must be bound to the man directing it."
  PN_a_army_that_serves_me: "An Army That Serves Me"
  PN_a_army_that_serves_me_desc: "A national army must not become a collection of provincial commands wearing the same uniform. Appointments, training and promotion will reinforce loyalty to Zhang's supreme command. No officer will be permitted to build a private following beneath the flag of reconstruction."
  PN_the_second_sun_yat_sen: "The Second Sun Yat-sen"
  PN_the_second_sun_yat_sen_desc: "Sun Yat-sen promised a sovereign and united China, but his successors left that promise unfinished. The movement will present Zhang as the man capable of completing it. To his supporters, national reconstruction is the continuation of a revolution that lost its direction."
  PN_china_is_whole: "China Is Whole"
  PN_china_is_whole_desc: "The National State must become more than the sum of its military victories. Common administration, a unified command and a shared political allegiance will bind the provinces to the centre. Zhang's government will speak for China as a whole, not for another regional coalition."
  PN_implement_national_reconstructionism: "Implement National Reconstructionism"
  PN_implement_national_reconstructionism_desc: "The principles developed in Shangdong must now guide national administration. Recognised organisations for labour, agriculture, industry and the professions will bring their work into the reconstruction programme. Consultation will broaden the government's reach without dividing its authority."
  PN_the_death_of_capitalism: "The Death of Capitalism"
  PN_the_death_of_capitalism_desc: "Private wealth cannot be allowed to dictate the pace or purpose of national recovery. Credit, strategic industry and major investment will be brought under the state's direction. Small businesses and family property may remain, but ownership will carry obligations to the reconstruction programme."
  PN_the_death_of_communism: "The Death of Communism"
  PN_the_death_of_communism_desc: "The claims of class sovereignty have no place above the national state. Labour will receive representation through recognised institutions, while independent revolutionary parties and armed organisations are suppressed. The worker's place in reconstruction will be defined by citizenship and service, not a rival political command."
  PN_the_death_of_feudalism: "The Death of Feudalism"
  PN_the_death_of_feudalism_desc: "Predatory rents, private levies and obligations to local strongmen keep the countryside dependent on the old order. Rural credit, enforceable tenancy rules and action against hostile estates will weaken that authority. The farmer must be tied to the national economy rather than the patronage of a landlord."
  PN_the_birth_of_new_economics: "The Birth of New Economics"
  PN_the_birth_of_new_economics_desc: "Neither unrestrained private interests nor competing class organisations will direct the nation's economy. Production chambers, official labour bodies and the government will coordinate credit, wages and investment around a common plan. Reconstruction requires an economy that can supply both national development and defence."
  PN_the_implement_reconstructionism_in_countryside: "Reconstructionism in the Countryside"
  PN_the_implement_reconstructionism_in_countryside_desc: "National policy must reach beyond the provincial offices and into the villages. Agricultural associations will coordinate rural credit, irrigation, tools and the movement of produce. Their task is to make the countryside a participant in reconstruction rather than merely a source of taxes and recruits."
  PN_the_implement_government_crops: "Implement Government Crop Programmes"
  PN_the_implement_government_crops_desc: "Agricultural officials will identify the crops needed to feed the towns and supply essential industries. Seed distribution, irrigation and purchasing arrangements must support those priorities without leaving families unable to feed themselves. Reliable harvests are as necessary to reconstruction as reliable factories."
  PN_the_bring_the_people_out_of_peasantry: "Bring the People Out of Peasantry"
  PN_the_bring_the_people_out_of_peasantry_desc: "A rural household should not be condemned to poverty by debt, poor schooling and the absence of modern tools. Agricultural education, cooperatives and access to credit will give farmers the means to improve their livelihoods. Reconstruction must offer them something beyond another demand for grain."
  PN_the_countryside_revitalization: "Countryside Revitalisation"
  PN_the_countryside_revitalization_desc: "The countryside needs dependable roads, water management and institutions that can carry improvements beyond a single harvest. By bringing the agricultural programme together, the government can raise rural productivity and strengthen the villages that feed the nation."
  PN_the_implement_reconstructionism_in_citys: "Reconstructionism in the Cities"
  PN_the_implement_reconstructionism_in_citys_desc: "The cities bring workers, employers and the technical professions into close contact, but their interests will not organise themselves into a national programme. Industrial councils and municipal officials must coordinate production, labour standards and essential services under the Reconstruction Government."
  PN_the_new_factorys_new_china: "New Factories, New China"
  PN_the_new_factorys_new_china_desc: "A sovereign state requires the means to build its own machinery, equipment and armaments. New factories will be directed towards the gaps that leave China dependent on imports. Each workshop brought into production will give the national programme a firmer material foundation."
  PN_the_corporatist_renassiance: "The Corporatist Renaissance"
  PN_the_corporatist_renassiance_desc: "The National Reconstruction Council will give recognised economic functions a place in the government. Workers, farmers, industrialists and technical specialists will negotiate their responsibilities within institutions answerable to the state. Their representation must support a common programme rather than recreate a contest for sovereignty."
  PN_the_city_revitalization: "City Revitalisation"
  PN_the_city_revitalization_desc: "Factories cannot prosper in cities short of power, transport and functioning public services. Municipal reconstruction will connect new industrial capacity to the infrastructure and trained labour it needs. The nation's recovery must be visible in the streets as well as in production reports."
  PN_the_great_leap_forward: "The Great Leap Forward"
  PN_the_great_leap_forward_desc: "The rural and urban programmes must now support a wider advance in national production. Heavy industry, power, machinery and transport will receive coordinated investment, while agricultural improvements sustain the growing towns. The government intends to overcome decades of weakness through a sustained reconstruction effort."
  PN_the_enemy_beyond: "The Enemy Beyond"
  PN_the_enemy_beyond_desc: "Foreign concessions and strategic dependence place limits on the sovereignty the movement claims to restore. The government must identify where outside powers can obstruct China's recovery and prepare the means to resist them. Cooperation may serve the nation; external direction over its affairs cannot."
  PN_the_enemy_within: "The Enemy Within"
  PN_the_enemy_within_desc: "Victory has not removed every organisation willing to overturn the Reconstruction Government. Underground parties, private armed networks and officials serving rival loyalties can undermine the state from within. Security work must bring those networks to light before they can gather strength."
  PN_the_second_council: "The Second Council"
  PN_the_second_council_desc: "The Council must consider the national tasks that victory has left unresolved. Ministers, commanders and recognised representatives will report on internal security, provincial integration and foreign pressure. Zhang will settle the priorities that bind these concerns into the next stage of reconstruction."
  PN_china_must_be_one: "China Must Be One"
  PN_china_must_be_one_desc: "No province can claim a permanent exemption from national authority. The remaining regional commands must accept the same administration, military hierarchy and obligations as the territories already under our government. Reconstruction cannot be completed while China's unity remains a matter of negotiation between warlords."
  PN_hunt_down_the_warlords: "Hunt Down the Warlords"
  PN_hunt_down_the_warlords_desc: "Commanders who refuse integration cannot be allowed to wait for the National State to weaken. Their armed networks must be located, isolated and broken. The campaigns ahead will end the ability of provincial strongmen to treat Chinese territory as their private possession."
  PN_spread_the_ideology_of_reconstructionism: "Spread Reconstructionism"
  PN_spread_the_ideology_of_reconstructionism_desc: "The movement must establish a presence in districts that have known only the authority of their local commanders. Cadres, teachers and public officials will explain the national programme and organise its recognised institutions. Political integration must follow the army rather than stop at the provincial frontier."
  PN_recruit_the_old_officers: "Recruit the Old Officers"
  PN_recruit_the_old_officers_desc: "The old armies contain experienced men whose service need not end with the defeat of their former patrons. Officers willing to accept national command can bring valuable knowledge into our formations. Their place will depend on competence and loyalty, not the provincial connections that once sustained them."
  PN_reeducate_the_warlords: "Re-educate the Warlords"
  PN_reeducate_the_warlords_desc: "Submission must mean more than changing the flag above a headquarters. Former regional leaders and their staffs must learn the obligations of national service and surrender their claims to private authority. Political instruction will accompany the reorganisation of the forces they once commanded."
  PN_demand_european_powers_to_leave_china: "Demand the European Powers Leave China"
  PN_demand_european_powers_to_leave_china_desc: "The concessions preserve a foreign authority that no Chinese government claiming sovereignty can accept indefinitely. We will demand the restoration of Chinese jurisdiction and the withdrawal of the privileges that sustain it. The European powers must recognise that the divided China they once negotiated with is passing away."
  PN_death_to_invaders: "Death to Invaders"
  PN_death_to_invaders_desc: "The government's claim to national leadership will mean little if foreign armies can dictate China's borders. The army and the population must be prepared for a struggle against invasion. Reconstruction will provide the weapons, organisation and resolve needed to defend the nation."
  PN_rally_the_fengtiang_officers: "Rally the Fengtian Officers"
  PN_rally_the_fengtiang_officers_desc: "The officers who remember the northeast carry a particular reason to resist Japanese power. Their experience and personal ties can strengthen the army preparing for the northern campaigns. Zhang will call on them to place that commitment at the service of national command."
  PN_entrench_anti_japanese_thought: "Entrench Anti-Japanese Thought"
  PN_entrench_anti_japanese_thought_desc: "The loss of the northeast must remain a national concern rather than the grievance of one displaced army. Schools, newspapers and military instruction will explain the danger posed by Japanese domination. Resistance must rest on a shared commitment to Chinese sovereignty."
  PN_the_false_emperor_of_china: "The False Emperor of China"
  PN_the_false_emperor_of_china_desc: "Puyi's position under Japanese protection cannot give the occupation a legitimate Chinese mandate. We must decide whether to seek his support with an offer of citizenship, propose a constitutional throne, or make no approach."
  PN_the_deal_of_the_century: "The Deal of the Century"
  PN_the_deal_of_the_century_desc: "Our chosen terms will be sent to Puyi in Manchuria. Only his acceptance of a constitutional monarchy offer can open that path; otherwise, China will remain under the Grand Uniter."
  PN_china_only_needs_the_uniter: "China Only Needs the Uniter"
  PN_china_only_needs_the_uniter_desc: "No restored throne is needed to complete the authority already held by the Grand Uniter. The state will draw its legitimacy from reconstruction, national command and the defeat of division. Zhang will remain the final centre of political and military power."
  PN_china_a_constitutional_monarchy: "China: A Constitutional Monarchy"
  PN_china_a_constitutional_monarchy_desc: "Puyi has accepted our offer of a constitutional throne in return for supporting the Reconstruction Government. The settlement will place the crown within a written constitution while Zhang retains control of government, defence and national policy."
  PN_the_great_war_of_unification: "The Great War of Unification"
  PN_the_great_war_of_unification_desc: "The remaining division of China cannot be settled by proclamations alone. The national army must carry the government's authority into the territories still held outside it. The coming war will decide whether reconstruction remains a programme of competing administrations or becomes the work of one state."
  PN_china_united_under_one_flag: "China United Under One Flag"
  PN_china_united_under_one_flag_desc: "The flags of rival commands have been lowered, and the national administration must now give unity a lasting form. Common institutions, transport links and military service will connect the reunited provinces. The state's flag must stand for obligations shared across China rather than the triumph of another regional army."
  PN_demand_the_northern_provinces: "Demand the Northern Provinces"
  PN_demand_the_northern_provinces_desc: "Foreign control of the northern provinces remains a reminder of the weakness produced by China's division. The government will press its demands for their return with the authority of a united nation behind it. Recovery of the north must be treated as a national task, not a bargaining point between provincial commanders."
  PN_demand_establish_reconstuctionism_in_korea: "Establish Reconstructionism in Korea"
  PN_demand_establish_reconstuctionism_in_korea_desc: "Japan's hold over Korea threatens the security of China's northeastern approaches. A Korean government organised around national reconstruction could deny that position to Tokyo and provide a partner in regional recovery. Our policy must prepare the political foundations as well as the military means."
  PN_avenged_the_century_of_humiliation: "Avenge the Century of Humiliation"
  PN_avenged_the_century_of_humiliation_desc: "The movement began with an army deprived of its homeland and a country unable to defend its sovereignty. A united state, restored jurisdiction and freedom from foreign domination will answer the failures that made those losses possible. China must possess the institutions and strength to ensure they are not repeated."
  PN_the_national_peoples_republic_of_china: "The National People's Republic of China"
  PN_the_national_peoples_republic_of_china_desc: "The settlement accepted at the Choice of the Nation has opened a different road. Former Communist organisations will enter a common national movement, while their forces surrender independent strategic command. The new republic will broaden labour and peasant participation under Zhang's supreme authority, rather than begin the no-negotiation programme of the National State."
  PN_honour_the_national_revival_settlement: "Honour the National Revival Settlement"
  PN_honour_the_national_revival_settlement_desc: "The agreement accepted at the Choice of the Nation must now be carried out. Former Communist organisations will receive a recognised place in national political life, while their forces surrender independent strategic command. Neither side can build a common republic by treating the settlement as a temporary ceasefire."
  PN_found_the_chinese_national_revival_league: "Found the Chinese National Revival League"
  PN_found_the_chinese_national_revival_league_desc: "The Reconstruction Movement can no longer stand as the state's only political organisation. Officers, administrators, labour bodies, peasant associations and participating Communist cadres must enter a common League. Their disagreements will be conducted within one movement rather than between rival governments."
  PN_embrace_national_chinese_solidarism: "Embrace National Chinese Solidarism"
  PN_embrace_national_chinese_solidarism_desc: "National unity and social reform must become parts of the same programme. Solidarism will preserve the Reconstructionist demand for a sovereign state while giving labour, agriculture and the former revolutionary movement a greater place within it. No class or faction may claim an authority above the nation."
  PN_the_grand_uniter_of_the_republic: "The Grand Uniter of the Republic"
  PN_the_grand_uniter_of_the_republic_desc: "The new republic does not reduce Zhang to a ceremonial figure. As Grand Uniter, he retains supreme command, senior appointments and final executive authority. The settlement broadens the institutions beneath him without dividing the sovereignty of the state."
  PN_convene_the_national_congress: "Convene the National Congress"
  PN_convene_the_national_congress_desc: "Delegates from territorial branches and recognised social organisations must meet to debate the national programme. Labour, agriculture, the armed forces and the professions will stand alongside the League's political cadres. The Congress will give the settlement a national institution rather than leave it as an agreement between leaders."
  PN_elect_the_central_committee: "Elect the Central Committee"
  PN_elect_the_central_committee_desc: "The Congress cannot remain in permanent session. It will choose a Central Committee to manage the League between meetings and coordinate its work with the ministries. Political organisation must continue after the delegates return to their provinces."
  PN_establish_the_council_of_national_revival: "Establish the Council of National Revival"
  PN_establish_the_council_of_national_revival_desc: "The Council of National Revival will provide a continuing chamber for the League's recognised interests. It may question ministers, negotiate budgets and amend plans, but it cannot remove Zhang by an ordinary vote or authorise another party army. Disagreement must strengthen the common state rather than dissolve it."
  PN_six_wings_one_league: "Six Wings, One League"
  PN_six_wings_one_league_desc: "The Reconstruction, Labour, Agrarian, National Defence, Development and Revolutionary wings will each have a recognised place within the League. Their concerns cannot be made identical, but their political obligations can. Every tendency must accept one state, one national army and the institutions created by the settlement."
  PN_preserve_the_reconstruction_wing: "Preserve the Reconstruction Wing"
  PN_preserve_the_reconstruction_wing_desc: "The officers, officials and cadres who built the Shangdong government remain essential to the republic. Their experience must be preserved within the common movement rather than discarded as the price of agreement. They must also learn to share institutions with those who joined through the settlement."
  PN_welcome_the_revolutionary_cadres: "Welcome the Revolutionary Cadres"
  PN_welcome_the_revolutionary_cadres_desc: "Former Communist organisers bring experience in political education, local administration and mass organisation. Their participation must be genuine, but it must take place through the League's common institutions. The settlement grants political influence, not the right to preserve a separate sovereign party-state."
  PN_unity_above_faction: "Unity Above Faction"
  PN_unity_above_faction_desc: "The League's wings may contest appointments and argue over the pace of reform. They may not arm their followers or turn a policy dispute into another civil war. The authority of the Grand Uniter and the procedures of the common institutions must hold the coalition together."
  PN_secretary_of_state_wang_ming: "Secretary of State Wang Ming"
  PN_secretary_of_state_wang_ming_desc: "Wang Ming will serve as Secretary of State and Secretary-General of the League. His authority will rest in civilian administration, political organisation and the incorporation of former Communist networks. He will be a senior partner beneath Zhang, not a second supreme commander."
  PN_bridge_the_ministries_and_the_league: "Bridge the Ministries and the League"
  PN_bridge_the_ministries_and_the_league_desc: "Wang's offices must connect the ministries with the Congress, Central Committee and recognised social organisations. Decisions taken at the centre need officials capable of carrying them into the districts. Civilian coordination will give practical meaning to the political settlement."
  PN_establish_territorial_league_branches: "Establish Territorial League Branches"
  PN_establish_territorial_league_branches_desc: "The League must be present beyond the capital and the headquarters of its founding organisations. Provincial and district branches will bring local officials, recognised associations and political cadres into a national structure. Participation cannot depend on personal access to a minister in Nanjing."
  PN_cadres_in_national_service: "Cadres in National Service"
  PN_cadres_in_national_service_desc: "Officials drawn from opposing movements need common duties and a shared standard of public service. Training will emphasise the settlement, administrative competence and responsibility to the national government. A change in political allegiance must be followed by the ability to govern."
  PN_a_state_beyond_the_officer_corps: "A State Beyond the Officer Corps"
  PN_a_state_beyond_the_officer_corps_desc: "Military command created the foundation of reconstruction, but it cannot administer every school, workshop and village. The League's civilian institutions must take on a larger share of government while respecting Zhang's supreme authority. The republic needs a political base wider than its original officer bloc."
  PN_a_workers_voice_in_congress: "A Workers' Voice in Congress"
  PN_a_workers_voice_in_congress_desc: "Organised labour will nominate representatives through recognised bodies and participate in the national programme. Workers must be able to raise questions of wages, safety and social protection inside the republic. Their influence will come through shared institutions, not a rival revolutionary government."
  PN_an_agrarian_voice_in_congress: "An Agrarian Voice in Congress"
  PN_an_agrarian_voice_in_congress_desc: "Peasant associations and cooperative bodies must carry rural concerns into national deliberation. The countryside cannot remain merely a source of grain, taxes and recruits. Its representatives will have a place in shaping the reforms demanded by the settlement."
  PN_the_national_social_bargain: "The National Social Bargain"
  PN_the_national_social_bargain_desc: "The settlement asks every organised interest to accept obligations as well as influence. Workers gain protection, farmers gain reform, producers retain a place in development and the army retains its national purpose. None may withdraw from the common state when negotiations fail to give it everything it seeks."
  PN_the_national_revival_plan: "The National Revival Plan"
  PN_the_national_revival_plan_desc: "The republic needs a programme that joins social reform to the productive capacity required for national independence. Investment in transport, power, industry and agriculture must be coordinated rather than pursued as competing promises. The Revival Plan will give the settlement a material foundation."
  PN_expand_strategic_public_ownership: "Expand Strategic Public Ownership"
  PN_expand_strategic_public_ownership_desc: "Banking, energy, railways, armaments and heavy industry cannot be left outside the national programme. Strategic enterprises will be publicly owned or organised as national corporations where necessary. Their purpose will be to support development and defence rather than the private authority of their owners."
  PN_reorganise_the_national_banks: "Reorganise the National Banks"
  PN_reorganise_the_national_banks_desc: "Credit must reach the projects on which national recovery depends. Public direction of strategic banking will support industrial investment, agricultural lending and the rebuilding of essential networks. Financial power must serve the programme rather than obstruct it."
  PN_create_national_industrial_corporations: "Create National Industrial Corporations"
  PN_create_national_industrial_corporations_desc: "The most important industrial enterprises require stable management and a clear place in national planning. National corporations will coordinate managers, engineers and recognised labour representatives around production obligations. Public ownership must become an effective institution rather than a change of name above the gate."
  PN_a_planned_mixed_economy: "A Planned Mixed Economy"
  PN_a_planned_mixed_economy_desc: "Small and medium private firms will remain part of the economy, while larger producers work within national plans and labour agreements. Strategic public ownership does not require every shop and family business to disappear. The state must coordinate these different forms of production without surrendering its direction over development."
  PN_land_to_those_who_work_it: "Land to Those Who Work It"
  PN_land_to_those_who_work_it_desc: "The settlement promises more than protection for the existing rural order. Very large estates may be divided, tenant protections strengthened and land placed in the hands of those who cultivate it. Reform must give rural families a lasting stake in the republic."
  PN_recognise_the_labour_organisations: "Recognise the Labour Organisations"
  PN_recognise_the_labour_organisations_desc: "Labour organisations must enter government as recognised participants rather than remain petitioners outside it. Their representation will be tied to the League and the national industrial councils. The right to be heard will accompany the obligation to work within the common political order."
  PN_break_the_cycle_of_rural_debt: "Break the Cycle of Rural Debt"
  PN_break_the_cycle_of_rural_debt_desc: "Predatory debt can take away the benefits of land reform before a household brings in its next harvest. Rural credit and action against abusive lending will protect the new settlement. Farmers must be able to invest in their land without returning to dependence on the old patrons."
  PN_cooperatives_not_collectivisation: "Cooperatives, Not Collectivisation"
  PN_cooperatives_not_collectivisation_desc: "Cooperatives will provide machinery, seed, storage and purchasing power without requiring every family farm to disappear. The republic seeks organised farmers with a voice in national life, not universal forced collectivisation. Shared services must strengthen household farming rather than replace it by decree."
  PN_national_labour_standards: "National Labour Standards"
  PN_national_labour_standards_desc: "Working hours, wages and workplace safety must not depend entirely on the balance of power at a single factory gate. National standards will give labour protection that extends across provinces and industries. Reconstruction must improve the conditions under which the nation's wealth is produced."
  PN_industrial_councils_and_arbitration: "Industrial Councils and Arbitration"
  PN_industrial_councils_and_arbitration_desc: "Managers, technicians and worker representatives need institutions in which to settle the practical demands of production. Industrial councils will negotiate implementation, while national arbitration addresses disputes that cannot be resolved locally. Neither employers nor workers may claim a private right to paralyse reconstruction."
  PN_a_prosperous_countryside: "A Prosperous Countryside"
  PN_a_prosperous_countryside_desc: "Land reform, fair credit and cooperative services must now work together across the countryside. Higher productivity should leave rural households better able to withstand a poor season and support the towns. The republic's agrarian promise must be visible in daily life rather than only in new registers."
  PN_social_insurance_for_the_nation: "Social Insurance for the Nation"
  PN_social_insurance_for_the_nation_desc: "Illness, injury and old age can reduce a working household to dependence despite years of service. A national social insurance programme will extend protection beyond the most fortunate workplaces. The social bargain must provide security as well as an obligation to produce."
  PN_connect_the_national_grain_network: "Connect the National Grain Network"
  PN_connect_the_national_grain_network_desc: "A good harvest in one province must be able to relieve shortages in another. Cooperative storage, reliable purchasing and improved transport will connect agricultural production to the needs of the nation. Grain should reach the towns without leaving the villages at the mercy of speculation."
  PN_mechanise_the_family_farm: "Mechanise the Family Farm"
  PN_mechanise_the_family_farm_desc: "Cooperative machinery services will make modern equipment available to households unable to purchase it alone. Training, maintenance and a dependable supply of tools must accompany the machines. Agricultural modernisation will build on the family farm rather than demand its abolition."
  PN_power_rail_and_steel: "Power, Rail and Steel"
  PN_power_rail_and_steel_desc: "The Revival Plan requires dependable electricity, connected railways and the industrial capacity to make its own equipment. Public investment will join these foundations into a national network. Social commitments cannot endure without the productive strength to support them."
  PN_protect_the_small_producers: "Protect the Small Producers"
  PN_protect_the_small_producers_desc: "Small businesses, workshops and household producers remain part of the republic's mixed economy. Access to credit and predictable production agreements will help them contribute to the national plan. Their survival must be reconciled with labour standards and the state's control of strategic development."
  PN_production_for_national_revival: "Production for National Revival"
  PN_production_for_national_revival_desc: "Agriculture, public industry and smaller producers must now sustain one another within the national programme. Higher output will support better living conditions, modern equipment and a stronger defence. The settlement's social and economic promises must be judged by what the republic can provide."
  PN_one_national_army: "One National Army"
  PN_one_national_army_desc: "The settlement permits no second strategic command beneath the republican flag. All participating formations must enter a unified national military answerable to Zhang as Grand Uniter. Political incorporation will not be used to preserve the armies that once divided the country."
  PN_integrate_the_former_red_army: "Integrate the Former Red Army"
  PN_integrate_the_former_red_army_desc: "Former Communist formations bring experienced soldiers and established units into the national forces. Their integration must include command, supply and promotion rather than merely a new title. They will serve in one army, not remain an independent force attached to a League wing."
  PN_retain_the_northeastern_officers: "Retain the Northeastern Officers"
  PN_retain_the_northeastern_officers_desc: "The Northeastern officer corps preserved the army through displacement and built the foundations of reconstruction. Its experience must remain part of the national command. Those officers must now accept former opponents as fellow soldiers under the same supreme authority."
  PN_no_private_party_armies: "No Private Party Armies"
  PN_no_private_party_armies_desc: "No recognised tendency may keep a militia or a private chain of military allegiance. Weapons, appointments and operational orders must remain the responsibility of national command. The League's internal disputes will be settled in political institutions rather than on another battlefield."
  PN_a_common_staff_and_doctrine: "A Common Staff and Doctrine"
  PN_a_common_staff_and_doctrine_desc: "The integrated formations need common staff procedures, training and logistical standards. Lessons drawn from opposing armies must become the experience of a single institution. Shared doctrine will help turn political agreement into dependable cooperation in the field."
  PN_the_army_of_national_revival: "The Army of National Revival"
  PN_the_army_of_national_revival_desc: "The army must come to represent the nation rather than the exclusive history of any one movement. Its soldiers will defend the republic, its sovereignty and the settlement that ended their internal struggle. Zhang's command will give those obligations a single military centre."
  PN_the_revival_council_convenes: "The Revival Council Convenes"
  PN_the_revival_council_convenes_desc: "The political institutions, social programme and unified command must now agree on the nation's remaining tasks. The Council will hear the recognised wings and the civilian administration before Zhang settles the common course. The end of one internal division must become the beginning of a sovereign national policy."
  PN_recover_the_foreign_concessions: "Recover the Foreign Concessions"
  PN_recover_the_foreign_concessions_desc: "Foreign jurisdictions and privileges continue to limit the sovereignty claimed by the republic. Their recovery must be pursued as a common national demand rather than a slogan belonging to one political tendency. China's territory and essential networks must answer to Chinese institutions."
  PN_a_national_front_against_japan: "A National Front Against Japan"
  PN_a_national_front_against_japan_desc: "The settlement must unite the political traditions that once fought one another against the danger of Japanese domination. National defence will draw on the army, recognised social organisations and the League's territorial branches. No movement will be permitted to turn resistance into a separate claim to sovereignty."
  PN_return_to_the_northeast: "Return to the Northeast"
  PN_return_to_the_northeast_desc: "For the men who followed Zhang into exile, the northeast has never been merely another province on a map. Its recovery must now become the purpose of a national army rather than the private cause of the Northeastern command. The republic will carry their determination into a common campaign."
  PN_support_korean_independence: "Support Korean Independence"
  PN_support_korean_independence_desc: "Japanese control of Korea provides a base from which to threaten the continent. Support for Korean independence can help remove that danger and demonstrate that our resistance is directed against foreign domination. A sovereign Korea must be treated as a neighbour, not simply another dependency."
  PN_china_answers_to_no_bloc: "China Answers to No Bloc"
  PN_china_answers_to_no_bloc_desc: "Foreign trade, machinery and military assistance may strengthen the republic, but none must purchase control over Chinese policy. Cooperation will be judged by national development and sovereignty rather than automatic loyalty to a capitalist power or the Soviet Union. The settlement belongs to China."
  PN_restore_the_nations_sovereignty: "Restore the Nation's Sovereignty"
  PN_restore_the_nations_sovereignty_desc: "A unified command and a common political movement have given China the means to resist dependence. Recovery of national territory and freedom to direct our own policy must give that unity its external meaning. The republic will defend a sovereignty that no faction or foreign sponsor may divide."
  PN_hymn_of_united_china: "Hymn of United China"
  PN_hymn_of_united_china_desc: "The republic's anthem must belong to more than the men who negotiated its foundation. Workers, farmers, soldiers and administrators have been given a common national task. Their achievements in production, social reform and the defence of sovereignty will give substance to the promise of a united China."
  XIC_secretary_of_state: "§RSecretary of State§!"
  XIC_secretary_of_state_desc: "Wang Ming coordinates the civilian ministries and the political organisation of the National Revival League beneath Zhang's supreme authority. His office binds the former Communist movement to the common national government."
  XIC_wang_ming_secretary: "Wang Ming"
  XIC_national_state_chosen_tt: "The decision following §Y$PN_the_choice_of_the_nation$§! has chosen the National State."
  XIC_republic_accepted_tt: "Communist China has accepted the §YNational Revival Settlement§! offered after §Y$PN_the_choice_of_the_nation$§!."
  XIC_unification_cores_tt: "Gain §Ycores on all Chinese states§!."
  XIC_wang_ming_secretary_tt: "§YWang Ming§! joins our government and is appointed as the non-removable §RSecretary of State§!.\nFactory Output: §G+5.00%§!\nStability: §G+5.00%§!\nDaily Political Power Gain: §R-0.10§!"
  XIC_communist_proposal_delay_tt: "A possible settlement with §YWang Ming§! will be considered in §Y14 days§!."
  XIC_send_envoy_tt: "Ask §YCommunist China§! to accept unification."
  XIC_form_national_state_tt: "Complete §Y$PN_the_national_state_of_china$§!, proclaim the §YNational State of China§! and gain §Ycores on all of China§!."
  XIC_accept_settlement_tt: "Join the §YNational People's Republic of China§! under Zhang."
  XIC_reject_settlement_tt: "Reject unification and remain independent."
  PN_XIC.14.t: "The Fall of the Nanjing Government"
  PN_XIC.14.desc: "The offices of the Kuomintang government in Nanjing have fallen silent. Its ministers have fled, surrendered or abandoned the authority they once claimed over the nation. The army that began its work in Shangdong now holds the city from which its former masters directed China's affairs.\n\nBefore his officers and civilian officials, Zhang declares the old central government's rule at an end. The task ahead is no longer the preservation of a provincial refuge, but the construction of a national order. Regional commands may still resist, and the Communist movement remains outside our institutions, but Nanjing can no longer dictate our future.\n\nFor the men who endured the Eastern March, the moment is a vindication. For the government, it raises the question that victory alone cannot answer: what form shall the reunited nation take?"
  PN_XIC.14.a: "The old government is finished. Now we must build."
  PN_XIC.16.t: "A Possible Settlement with Wang Ming"
  PN_XIC.16.desc: "Fourteen days after the declaration in Nanjing, our officials have presented Zhang with a proposal concerning the Communist movement. Wang Ming remains active within its government and may be prepared to discuss a national settlement rather than another civil war.\n\nAn envoy could offer political incorporation through a common National Revival League. Communist formations would enter one national military command, while recognised labour and peasant organisations gained a place in the new government. Wang would be offered senior civilian office beneath Zhang's supreme authority.\n\nThe agreement would depend on the Communists accepting those terms. We may send the envoy, or reject negotiation and proclaim a National State committed to the Reconstructionist programme alone."
  PN_XIC.16.a: "Send an envoy to Wang Ming."
  PN_XIC.16.b: "There will be no negotiated settlement."
  PN_XIC.17.t: "Zhang's Envoy Arrives"
  PN_XIC.17.desc: "An envoy from Zhang Xueliang has arrived with an offer addressed to Wang Ming and the Communist leadership. The Nanjing government has fallen, and Zhang proposes that the remaining national struggle be resolved through incorporation rather than continued civil war.\n\nThe terms recognise former Communist cadres, labour organisations and peasant associations within a common National Revival League. Wang would become Secretary of State and League Secretary-General. In return, our independent government would be dissolved and our formations placed under Zhang's unified military command.\n\nAcceptance would give our movement influence inside a broader national order, but not an army or a sovereign state of its own. Rejection would leave us independent and facing Zhang's Reconstructionist National State."
  PN_XIC.17.a: "Accept the National Revival Settlement."
  PN_XIC.17.b: "We will not surrender our independence."
  PN_XIC.18.t: "The National Revival Settlement"
  PN_XIC.18.desc: "The Communist leadership has accepted the envoy's terms. Its administration and armed formations are being incorporated into the common state, and Wang Ming has taken his place as Secretary of State beneath the Grand Uniter.\n\nThe National People's Republic of China is proclaimed under a new flag. The settlement recognises a wider political and social foundation without dividing national command. Officers, workers, peasants and the participating revolutionary cadres must now give practical meaning to the agreement that has brought them together.\n\nZhang's declaration closes with the obligation shared by every part of the new government: there will be one Chinese state and one national army."
  PN_XIC.18.a: "One nation, and a common future."
  PN_XIC.19.t: "The Communists Reject Unification"
  PN_XIC.19.desc: "Our envoy has returned without an agreement. The Communist government has refused to dissolve its independent authority and place its formations under Zhang's national command. The proposed National Revival Settlement will not be carried out.\n\nZhang has therefore proclaimed the National State of China. Its government will continue the Reconstructionist programme without incorporating a separate Communist political partner. The question of the remaining Communist movement has been left unresolved by negotiation."
  PN_XIC.19.a: "The National State will stand on its own."
  PN_XIC.20.t: "No Partner for the Settlement"
  PN_XIC.20.desc: "The conditions needed for a settlement with Wang Ming no longer exist. There is no active negotiating partner in Communist China able to take the place proposed for him, and the government cannot leave the nation's future suspended indefinitely.\n\nZhang has proclaimed the National State of China. Reconstruction will continue under the movement's existing national programme, without the proposed incorporation of the Communist administration."
  PN_XIC.20.a: "Then our course is settled."

  XIC_fallout_from_the_war: "Fallout From the War"
  XIC_fallout_from_the_war_desc: "Victory has left damaged factories, disrupted transport and exhausted communities behind it. The provincial arrangements that sustained Shangdong cannot meet the needs of a national economy. Demobilisation, shortages and the cost of restoring civil administration will weigh heavily upon reconstruction."
  XIC_national_legitimacy: "National Legitimacy"
  XIC_national_legitimacy_desc: "The movement has proclaimed a Chinese state, but a proclamation cannot secure the obedience of every province. Former Nationalist officials contest our authority, local commanders guard their privileges and soldiers remain attached to the armies that raised them. Until national authority is established, political division will weaken both the government and the army."
  XIC_national_reconstruction_economy: "National Reconstruction"
  XIC_national_reconstruction_economy_desc: "The emergency arrangements of the civil war are giving way to a coordinated national economy. Restored production, organised investment and a common programme for the cities and countryside offer the first durable returns from reconstruction."
  XIC_postwar_economy_tt: "Gain §Y$XIC_fallout_from_the_war$§!, which grants:\nFactory Output: §R-25.00%§!\nConstruction Speed: §R-35.00%§!\nConsumer Goods Factories: §Y+25.0%§!\nProduction Efficiency Growth: §R-20.00%§!"
  XIC_implement_national_reconstructionism_economy_tt: "Modify §Y$XIC_fallout_from_the_war$§! by:\nFactory Output: §G+5.00%§!\nConstruction Speed: §G+10.00%§!\nConsumer Goods Factories: §Y-5.0%§!\nProduction Efficiency Growth: §G+5.00%§!"
  XIC_the_death_of_capitalism_economy_tt: "Modify §Y$XIC_fallout_from_the_war$§! by:\nFactory Output: §G+10.00%§!\nConstruction Speed: §G+10.00%§!\nConsumer Goods Factories: §Y-10.0%§!\nProduction Efficiency Growth: §G+5.00%§!"
  XIC_the_death_of_communism_economy_tt: "Modify §Y$XIC_fallout_from_the_war$§! by:\nFactory Output: §G+5.00%§!\nConstruction Speed: §G+5.00%§!\nConsumer Goods Factories: §Y-5.0%§!\nProduction Efficiency Growth: §G+5.00%§!"
  XIC_the_death_of_feudalism_economy_tt: "$XIC_the_death_of_communism_economy_tt$"
  XIC_the_birth_of_new_economics_economy_tt: "Replace §Y$XIC_fallout_from_the_war$§! with §Y$XIC_national_reconstruction_economy$§!, granting:\nFactory Output: §G+5.00%§!\nConstruction Speed: §G+5.00%§!\nConsumer Goods Factories: §Y-5.0%§!\nProduction Efficiency Growth: §G+5.00%§!"
  XIC_second_council_concluded_tt: "The Second Council has decided the nation's strategic priority."
  XIC_second_council_unification_tt: "Unification focuses: §G49 days§!.\nAnti-Japanese focuses: §R91 days§!."
  XIC_second_council_japan_tt: "Anti-Japanese focuses: §G49 days§!.\nUnification focuses: §R91 days§!."
  PN_XIC.22.t: "The Destruction of the Communists"
  PN_XIC.22.desc: "The prospect of an agreement with the Communist government has ended. Before the assembled officers, Zhang declares that China cannot be rebuilt while rival governments claim the allegiance of its people. The Communist administration must be brought to an end and its remaining territory placed under national authority.\n\nOrders are being prepared for the campaign. The army is to defeat the organised Communist forces and dismantle their independent command. Victory will not settle every grievance in the countryside, but it will end the existence of a second government claiming to speak for China."
  PN_XIC.22.a: "There can be no rival national government."
  PN_XIC.23.t: "The Enemy Beyond"
  PN_XIC.23.desc: "Maps of Manchuria have been brought before the council. For the officers who followed Zhang out of the northeast, the occupied cities and railways are familiar places rather than distant objectives. Their families, their former commands and the humiliation of withdrawal remain close in memory.\n\nZhang reminds the room that Japan's position in Manchuria threatens every attempt to restore Chinese sovereignty. The administration established under Puyi gives foreign occupation a Chinese face, but its survival rests upon Japanese arms. Retaking the northeast will require an army and a supply system capable of sustaining a national war.\n\nThe council must decide when that reckoning can begin. It cannot decide to forget it."
  PN_XIC.23.a: "Manchuria will return to China."
  PN_XIC.24.t: "The Enemy Within"
  PN_XIC.24.desc: "The fall of rival governments has not erased their followers. Reports from the provinces describe Communist organisers rebuilding local networks, former Nationalist officials withholding records and armed bands collecting supplies in the name of defeated commanders. Some pursue their old causes; others have merely found new excuses to retain their power.\n\nThe officers demand security operations, while civilian officials warn that indiscriminate punishment would drive more villages into resistance. Zhang orders them to distinguish organised rebellion from the exhaustion and grievances left by the war. The state must break hostile networks and establish an administration that people can depend upon.\n\nUnification on the map must become authority in the provinces."
  PN_XIC.24.a: "The war's divisions must not survive its armies."
  PN_XIC.25.t: "The Second Council"
  PN_XIC.25.desc: "The council reconvenes with two sets of maps on the table. One records the provinces still beyond effective national authority. The other follows the railways north towards occupied Manchuria. Both represent unfinished business, and both demand the same officers, supplies and administrative attention.\n\nOne group argues that the remaining warlords must be subdued first. A government unable to direct its own provinces cannot reliably sustain a struggle against Japan. Others answer that continued delay gives the occupiers time to strengthen their position and leaves the northeast's people waiting for promises to become action.\n\nZhang allows the arguments to run their course before rising. Both tasks will be undertaken, but one must receive the first call on national preparations. He asks the council to record its priority."
  PN_XIC.25.a: "Unify China before confronting Japan."
  PN_XIC.25.b: "Prepare to recover Manchuria first."

  XIC_replace_shangdong_spirits_tt: "Replace the Shangdong economic and political spirits."
  XIC_national_legitimacy_start_tt: "Gain §Y$XIC_national_legitimacy$§!, which grants:\nStability: §R-20.00%§!\nPolitical Power Gain: §R-20.00%§!\nWar Support: §R-10.00%§!\nDivision Organisation: §R-15.00%§!\nDivision Attack: §R-10.00%§!\nDivision Defence: §R-10.00%§!"
  XIC_national_legitimacy_reforming: "$XIC_national_legitimacy$"
  XIC_national_legitimacy_reforming_desc: "National administration is taking the place of provincial allegiances. Each reform strengthens the authority of the centre, although the loyalty of the population and the officer corps must still be secured."
  XIC_national_authority: "National Authority"
  XIC_national_authority_desc: "A common administration and a unified military command have given the National State a durable foundation. The authority once claimed by rival parties and provincial armies now belongs to the national government."
  XIC_one_ideology_one_china_legitimacy_tt: "Modify §YNational Legitimacy§! by:\nStability: §G+5.00%§!\nWar Support: §G+5.00%§!"
  XIC_the_grand_uniter_legitimacy_tt: "Modify §YNational Legitimacy§! by:\nStability: §G+5.00%§!\nPolitical Power Gain: §G+10.00%§!"
  XIC_the_people_only_need_me_legitimacy_tt: "Modify §YNational Legitimacy§! by:\nStability: §G+5.00%§!\nPolitical Power Gain: §G+5.00%§!"
  XIC_a_army_that_serves_me_legitimacy_tt: "Modify §YNational Legitimacy§! by:\nDivision Organisation: §G+10.00%§!\nDivision Attack: §G+5.00%§!\nDivision Defence: §G+5.00%§!"
  XIC_the_second_sun_yat_sen_legitimacy_tt: "Modify §YNational Legitimacy§! by:\nStability: §G+5.00%§!\nWar Support: §G+5.00%§!"
