l_english:
  PN_XIC_aftermath_of_the_march: "Aftermath Of The Eastern March"
  PN_XIC_aftermath_of_the_march_desc: "The Eastern March has brought us to Shangdong, but our army and administration have yet to recover from the journey. We must restore our supply routes, account for our losses and prepare the province for the work ahead."
  XIC_aftermath_of_the_eastern_march: "Aftermath Of The Eastern March"
  XIC_aftermath_of_the_eastern_march_desc: "The Eastern March brought our army to Shangdong, but the journey has left its mark. Exhausted troops, abandoned equipment and disrupted supply routes have slowed reconstruction, and our workshops struggle to meet the government's demands."
  XIC_german_military_advisors: "German Military Advisors"
  XIC_german_military_advisors_desc: "Falkenhausen and his German military advisors have joined Zhang in Shangdong. Their experience in organisation, training and staff work will help rebuild the army into a disciplined fighting force."
  XIC_national_reconstructionism: "National Reconstructionism"
  XIC_national_reconstructionism_desc: "The Reconstruction Movement promises national renewal through order, discipline and a strong central government. Under Zhang's leadership, the administration is rallying support for the rebuilding of Shangdong and the restoration of China's strength."
  XIC_the_young_marshall: "The Young Marshall"
  XIC_the_young_marshall_desc: "Zhang Xueliang commands the loyalty of the officers and soldiers who followed him east. His authority keeps the army united, strengthening its resolve in both attack and defence."
  PN_XIC_the_young_marshall: "The Young Marshall"
  PN_XIC_the_young_marshall_desc: "Zhang Xueliang commands the loyalty of the officers and soldiers who followed him east. His authority keeps the army united, strengthening its resolve in both attack and defence."
  PN_XIC_reconstruction_government: "Reconstruction Government"
  PN_XIC_reconstruction_government_desc: "The Reconstruction Movement promises national renewal through order, discipline and a strong central government. To fulfil that promise, we must establish a functioning administration in Shangdong and give the army a government capable of supporting it."
  PN_XIC_nationalize_the_workshops: "Nationalize the Workshops"
  PN_XIC_nationalize_the_workshops_desc: "The workshops of Shangdong cannot be left to compete for scarce materials while the army goes without supplies. Bringing them under government control will allow us to coordinate production and direct their work towards reconstruction."
  PN_XIC_promote_the_young_officers: "Promote the Young Officers"
  PN_XIC_promote_the_young_officers_desc: "The march has revealed capable young officers whose talents have been overlooked by the old command. Their promotion will bring fresh experience into the staff and give the next generation a stake in the army's future."
  PN_XIC_rally_the_army: "Rally the Army"
  PN_XIC_rally_the_army_desc: "Our soldiers followed Zhang east through hardship and uncertainty. Now that we have a foothold in Shangdong, we must rally the scattered formations around a common purpose and remind them that their sacrifices were not in vain."
  PN_XIC_restructure_the_shangdong_army: "Restructure the Shangdong Army"
  PN_XIC_restructure_the_shangdong_army_desc: "The army that arrived in Shangdong was shaped by the demands of the march rather than the needs of a settled government. Its formations, supply services and command structure must be reorganised for the campaigns ahead."
  PN_XIC_the_german_military_advisors: "The German Military Advisors"
  PN_XIC_the_german_military_advisors_desc: "Falkenhausen and the German mission offer the experience our army needs to rebuild. By working closely with our officers, they can improve training, staff organisation and the planning of operations without displacing Chinese command."
  PN_XIC_establish_the_jinan_military_academy: "Establish the Jinan Military Academy"
  PN_XIC_establish_the_jinan_military_academy_desc: "An army cannot depend forever on the experience of those who survived the march. A military academy in Jinan will train a new body of officers, combining the lessons of our campaigns with the methods of our foreign advisors."
  PN_XIC_the_marshall_of_victory: "The Marshall of Victory"
  PN_XIC_the_marshall_of_victory_desc: "A reorganised army, a trained officer corps and a dependable staff will give Zhang the means to turn loyalty into victory. The Young Marshall must now show that the army can do more than endure another retreat."
  PN_XIC_industrial_reconstruction: "Industrial Reconstruction"
  PN_XIC_industrial_reconstruction_desc: "Shangdong's factories and workshops must become the foundation of our recovery. Restoring damaged facilities, securing supplies and coordinating investment will allow the province to support both its people and the army stationed here."
  PN_open_the_mines: "Open the Mines"
  PN_open_the_mines_desc: "Our reconstruction plans require a steady supply of raw materials. Reopening neglected mines and restoring the routes that connect them to our workshops will reduce shortages and put local workers back into employment."
  PN_XIC_spare_the_peasants: "Spare the Peasants"
  PN_XIC_spare_the_peasants_desc: "The countryside already bears the weight of feeding our army. Reconstruction must not leave the peasants without seed, tools or food for their families. We should limit demands on the villages and allow the harvest to recover."
  PN_XIC_all_for_reconstruction: "All for Reconstruction"
  PN_XIC_all_for_reconstruction_desc: "The government cannot rebuild Shangdong while every district pursues its own interests. Labour, supplies and revenue must be directed towards the reconstruction effort, even where the demands of recovery impose further hardship on the countryside."
  PN_XIC_implement_the_reconstruction_plan: "Implement the Reconstruction Plan"
  PN_XIC_implement_the_reconstruction_plan_desc: "With our priorities settled, the reconstruction plan can move from the council chamber to the districts. Officials must coordinate materials, labour and transport so that the province's recovery proceeds as a single effort."
  PN_XIC_a_port_city_for_the_nation: "A Port City for the Nation"
  PN_XIC_a_port_city_for_the_nation_desc: "Qingdao offers more than a harbour for Shangdong. By restoring its docks, warehouses and connections to the interior, we can make the city a gateway for the trade and supplies needed to rebuild the nation."
  PN_XIC_build_up_the_temporary_capital: "Build Up the Temporary Capital"
  PN_XIC_build_up_the_temporary_capital_desc: "Jinan must serve as the seat of government until our wider ambitions can be realised. Its roads, offices and public services need the investment required to support an administration responsible for more than the city itself."
  PN_XIC_the_young_marshalls_vision: "The Young Marshall's Vision"
  PN_XIC_the_young_marshalls_vision_desc: "Factories, mines, a working port and a functioning capital will give substance to Zhang's vision. Shangdong must demonstrate that reconstruction is more than a slogan and that our government can build what others have failed to preserve."
  PN_XIC_a_policy_of_the_nation: "A Policy of the Nation"
  PN_XIC_a_policy_of_the_nation_desc: "A government held together by military loyalty alone will not endure. We must set out a national policy that gives our officials, soldiers and supporters a common direction beyond the immediate task of holding Shangdong."
  PN_XIC_the_founding_father_of_reconstructionism: "The Founding Father of Reconstructionism"
  PN_XIC_the_founding_father_of_reconstructionism_desc: "Zhang's leadership has brought the Reconstruction Movement to Shangdong. His programme must now be set out clearly, giving the movement a political foundation and establishing his place at the head of the national reconstruction effort."
  PN_XIC_the_essence_of_reconstructionism: "The Essence of Reconstructionism"
  PN_XIC_the_essence_of_reconstructionism_desc: "Reconstructionism rests on order, discipline and the renewal of the nation through a strong central government. These principles must guide the administration and the army alike if the movement is to become more than another regional faction."
  PN_XIC_the_the_failures_of_nanjing: "The Failures of Nanjing"
  PN_XIC_the_the_failures_of_nanjing_desc: "Nanjing claims to speak for the nation, yet division and competing interests continue to weaken its authority. We must make the case that China needs a government willing to place reconstruction above the bargains of the old political order."
  PN_XIC_the_great_rebirth: "The Great Rebirth"
  PN_XIC_the_great_rebirth_desc: "The Reconstruction Movement must look beyond the recovery of a single province. By uniting our principles with a clear alternative to Nanjing, we can present the rebuilding of Shangdong as the beginning of a wider national rebirth."
  PN_XIC_the_first_council: "The First Council"
  PN_XIC_the_first_council_desc: "Our military, industrial and political preparations must now be brought together. The first council of the Reconstruction Government will gather the men responsible for these efforts and settle a common course for the next stage of national renewal."
