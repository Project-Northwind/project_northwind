l_english:
  PN_XIC_aftermath_of_the_march: "Aftermath Of The Eastern March"
  PN_XIC_aftermath_of_the_march_desc: "The Eastern March has brought us to Shangdong, but our army and administration have yet to recover from the journey. We must restore our supply routes, account for our losses and prepare the province for the work ahead."
  XIC_aftermath_of_the_eastern_march: "Aftermath Of The Eastern March"
  XIC_aftermath_of_the_eastern_march_desc: "The Eastern March brought our army to Shangdong, but the journey has left its mark. Exhausted troops, abandoned equipment and disrupted supply routes have slowed reconstruction, and our workshops struggle to meet the government's demands."
  XIC_german_military_advisors: "German Military Advisors"
  XIC_german_military_advisors_desc: "Falkenhausen and his German military advisors have joined Zhang in Shangdong. Their experience in organisation, training and staff work will help rebuild the army into a disciplined fighting force."
  XIC_national_reconstructionism: "National Reconstructionism"
  XIC_national_reconstructionism_desc: "The Reconstruction Movement promises national renewal through order, discipline and a strong central government. Under Zhang's leadership, the administration is rallying support for the rebuilding of Shangdong and the restoration of China's strength."
  XIC_the_young_marshall: "The Young Marshall"
  XIC_the_young_marshall_desc: "Zhang Xueliang commands the loyalty of the officers and soldiers who followed him east. His authority keeps the army united, strengthening its resolve in both attack and defence."
  XIC_the_young_marshall_army: "The Young Marshall"
  XIC_the_young_marshall_army_desc: "The Young Marshall's authority rests on the loyalty of the men who followed him east. His presence steadies the army and gives its officers the confidence to press the attack or hold their ground."
  XIC_reconstructionist_officer: "Reconstructionist Officer"
  XIC_reconstructionist_officer_desc: "Loyal to Zhang Xueliang and the Reconstruction Movement, this officer has committed himself to rebuilding the army and restoring a united China."
  XIC_mayor_of_tianjin: "§CMayor Of Tianjin§!"
  XIC_mayor_of_tianjin_desc: "Zhang Xueming's experience in municipal administration helps the government coordinate local officials, reduce waste and direct more of the nation's resources towards reconstruction."
  PN_XIC_the_young_marshall: "The Young Marshall"
  PN_XIC_the_young_marshall_desc: "Zhang Xueliang commands the loyalty of the officers and soldiers who followed him east. His authority keeps the army united, strengthening its resolve in both attack and defence."
  PN_XIC_reconstruction_government: "Reconstruction Government"
  PN_XIC_reconstruction_government_desc: "The Reconstruction Movement promises national renewal through order, discipline and a strong central government. To fulfil that promise, we must establish a functioning administration in Shangdong and give the army a government capable of supporting it."
  PN_XIC_nationalize_the_workshops: "Nationalize the Workshops"
  PN_XIC_nationalize_the_workshops_desc: "The workshops of Shangdong cannot be left to compete for scarce materials while the army goes without supplies. Bringing them under government control will allow us to coordinate production and direct their work towards reconstruction."
  PN_XIC_promote_the_young_officers: "Promote the Young Officers"
  PN_XIC_promote_the_young_officers_desc: "He Zhuguo and Wang Yizhe have the experience our rebuilt army needs. Bringing them into the Reconstruction Movement will strengthen the cavalry and infantry commands and give capable officers a place in the army's future."
  PN_XIC_rally_the_army: "Rally the Army"
  PN_XIC_rally_the_army_desc: "Our soldiers followed Zhang east through hardship and uncertainty. Now that we have a foothold in Shangdong, we must rally the scattered formations around a common purpose and remind them that their sacrifices were not in vain."
  PN_XIC_restructure_the_shangdong_army: "Restructure the Shangdong Army"
  PN_XIC_restructure_the_shangdong_army_desc: "The army that arrived in Shangdong was shaped by the demands of the march rather than the needs of a settled government. Its formations, supply services and command structure must be reorganised for the campaigns ahead."
  PN_XIC_the_german_military_advisors: "The German Military Advisors"
  PN_XIC_the_german_military_advisors_desc: "Falkenhausen and the German mission offer the experience our army needs to rebuild. By working closely with our officers, they can improve training, staff organisation and the planning of operations without displacing Chinese command."
  PN_XIC_establish_the_jinan_military_academy: "Establish the Jinan Military Academy"
  PN_XIC_establish_the_jinan_military_academy_desc: "An army cannot depend forever on the experience of those who survived the march. A military academy in Jinan will train a new body of officers, combining the lessons of our campaigns with the methods of our foreign advisors."
  PN_XIC_the_marshall_of_victory: "The Marshall of Victory"
  PN_XIC_the_marshall_of_victory_desc: "A reorganised army, a trained officer corps and a dependable staff will give Zhang the means to turn loyalty into victory. The Young Marshall must now show that the army can do more than endure another retreat."
  PN_XIC_industrial_reconstruction: "Industrial Reconstruction"
  PN_XIC_industrial_reconstruction_desc: "Shangdong's factories and workshops must become the foundation of our recovery. Restoring damaged facilities, securing supplies and coordinating investment will allow the province to support both its people and the army stationed here."
  PN_open_the_mines: "Open the Mines"
  PN_open_the_mines_desc: "Our reconstruction plans require a steady supply of raw materials. Reopening neglected mines and restoring the routes that connect them to our workshops will reduce shortages and put local workers back into employment."
  PN_XIC_spare_the_peasants: "Spare the Peasants"
  PN_XIC_spare_the_peasants_desc: "The countryside already bears the weight of feeding our army. Reconstruction must not leave the peasants without seed, tools or food for their families. We should limit demands on the villages and allow the harvest to recover."
  PN_XIC_all_for_reconstruction: "All for Reconstruction"
  PN_XIC_all_for_reconstruction_desc: "The government cannot rebuild Shangdong while every district pursues its own interests. Labour, supplies and revenue must be directed towards the reconstruction effort, even where the demands of recovery impose further hardship on the countryside."
  PN_XIC_implement_the_reconstruction_plan: "Implement the Reconstruction Plan"
  PN_XIC_implement_the_reconstruction_plan_desc: "With our priorities settled, the reconstruction plan can move from the council chamber to the districts. Officials must coordinate materials, labour and transport so that the province's recovery proceeds as a single effort."
  PN_XIC_a_port_city_for_the_nation: "A Port City for the Nation"
  PN_XIC_a_port_city_for_the_nation_desc: "Qingdao offers more than a harbour for Shangdong. By restoring its docks, warehouses and connections to the interior, we can make the city a gateway for the trade and supplies needed to rebuild the nation."
  PN_XIC_build_up_the_temporary_capital: "Build Up the Temporary Capital"
  PN_XIC_build_up_the_temporary_capital_desc: "Jinan must serve as the seat of government until our wider ambitions can be realised. Its roads, offices and public services need the investment required to support an administration responsible for more than the city itself."
  PN_XIC_the_young_marshalls_vision: "The Young Marshall's Vision"
  PN_XIC_the_young_marshalls_vision_desc: "Factories, mines, a working port and a functioning capital will give substance to Zhang's vision. Shangdong must demonstrate that reconstruction is more than a slogan and that our government can build what others have failed to preserve."
  PN_XIC_a_policy_of_the_nation: "A Policy of the Nation"
  PN_XIC_a_policy_of_the_nation_desc: "A government held together by military loyalty alone will not endure. We must set out a national policy that gives our officials, soldiers and supporters a common direction beyond the immediate task of holding Shangdong."
  PN_XIC_the_founding_father_of_reconstructionism: "The Founding Father of Reconstructionism"
  PN_XIC_the_founding_father_of_reconstructionism_desc: "Zhang's leadership has brought the Reconstruction Movement to Shangdong. His programme must now be set out clearly, giving the movement a political foundation and establishing his place at the head of the national reconstruction effort."
  PN_XIC_the_essence_of_reconstructionism: "The Essence of Reconstructionism"
  PN_XIC_the_essence_of_reconstructionism_desc: "Reconstructionism rests on order, discipline and the renewal of the nation through a strong central government. These principles must guide the administration and the army alike if the movement is to become more than another regional faction."
  PN_XIC_the_the_failures_of_nanjing: "The Failures of Nanjing"
  PN_XIC_the_the_failures_of_nanjing_desc: "Nanjing claims to speak for the nation, yet division and competing interests continue to weaken its authority. We must make the case that China needs a government willing to place reconstruction above the bargains of the old political order."
  PN_XIC_the_great_rebirth: "The Great Rebirth"
  PN_XIC_the_great_rebirth_desc: "The Reconstruction Movement must look beyond the recovery of a single province. By uniting our principles with a clear alternative to Nanjing, we can present the rebuilding of Shangdong as the beginning of a wider national rebirth."
  PN_XIC_the_first_council: "The First Council"
  PN_XIC_the_first_council_desc: "Our military, industrial and political preparations must now be brought together. The first council of the Reconstruction Government will gather the men responsible for these efforts and settle a common course for the next stage of national renewal."
  PN_XIC_Tianjin_to_beiping: "Tianjin to Beiping"
  PN_XIC_Tianjin_to_beiping_desc: "Zhang Xueming and his Tianjin Army could open the road to Beiping. The Young Marshall must write to his brother and ask him to bring the northern forces into the Reconstruction Movement."
  PN_XIC_crush_the_shanxi_clique: "Crush the Shanxi Clique"
  PN_XIC_crush_the_shanxi_clique_desc: "The Shanxi clique stands between us and a secure position in the north. Its armies command the western approaches to Beiping, and its leaders will not willingly submit to our authority. We must break their resistance before another regional strongman can dictate the future of the nation."
  PN_XIC_the_beijing_government: "The Beijing Government"
  PN_XIC_the_beijing_government_desc: "Jinan sheltered our government during its first uncertain months. With the north secured, Beiping can become the seat of an administration with national ambitions. Its offices must be brought under our authority and made ready to carry the work of reconstruction beyond Shangdong."
  PN_XIC_a_celebration_of_the_nation: "A Celebration of the Nation"
  PN_XIC_a_celebration_of_the_nation_desc: "The soldiers and families who endured the Eastern March deserve to see what their sacrifices have made possible. Parades, public ceremonies and remembrance of the fallen will mark our progress and give the people a common occasion to look towards the nation's recovery."
  PN_move_against_the_central_government: "Move Against the Central Government"
  PN_move_against_the_central_government_desc: "Nanjing continues to claim authority over all China while treating our movement as another provincial challenge. Two rival governments cannot direct the same national reconstruction. We must prepare to confront the central government and challenge its claim to speak for the nation."
  PN_teach_the_youth_the_ways_of_reconstructionism: "The Ways of Reconstructionism"
  PN_teach_the_youth_the_ways_of_reconstructionism_desc: "The movement cannot depend forever on the men who followed Zhang east. Schools and youth organisations must teach the principles of order, discipline and national service, preparing a generation that understands the work of reconstruction and its place in China's future."
  PN_anti_japanese_thought: "Anti-Japanese Thought"
  PN_anti_japanese_thought_desc: "Japanese encroachment has fed on China's weakness and division. Our newspapers, schools and army must make clear that national reconstruction means independence from foreign domination. Opposition to Japan's ambitions should rest on a common defence of Chinese sovereignty."
  PN_the_war_of_reclamation: "The War of Reclamation"
  PN_the_war_of_reclamation_desc: "The army has been rebuilt and the government has set its course. We must now carry the reconstruction effort beyond the territory already under our control. The coming campaign will seek to reclaim the divided provinces and replace competing regional commands with a single national authority."
  PN_the_choice_of_the_nation: "The Choice of the Nation"
  PN_the_choice_of_the_nation_desc: "Victory in the field cannot settle every question of government. The officers, officials and representatives who have supported reconstruction must now decide the nation's political course. Zhang must turn the movement's wartime authority into a lasting settlement for the years ahead."
  PN_XIC.1.t: "The New Officer Corps"
  PN_XIC.1.desc: "He Zhuguo and Wang Yizhe have answered the Young Marshall's call. He brings his cavalry experience, while Wang offers a steady hand for the infantry formations that must bear the weight of the campaigns ahead.\n\nTheir commissions will bring both men into the reconstruction effort, where they can serve in the field and advise the military high command."
  PN_XIC.1.a: "Present their commissions."
  PN_XIC.2.t: "A Letter to Tianjin"
  PN_XIC.2.desc: "At his headquarters in Jinan, Zhang Xueliang has written to his younger brother, Zhang Xueming. The Tianjin Army holds a position from which it could secure the road to Beiping and overturn the Hebei-Chahar council.\n\nThe Young Marshall asks his brother to put those forces at the service of national reconstruction. If Xueming agrees, the movement will gain not only another commander, but the northern foothold it needs. A courier leaves for Tianjin carrying the sealed letter."
  PN_XIC.2.a: "Send the letter to my brother."
  PN_XIC.3.t: "A Reply from Zhang Xueming"
  PN_XIC.3.desc: "Brother,\n\nYour letter reached me in Tianjin. I have no wish to see our family divided while others decide China's future. The Tianjin Army has marched on Beiping in your name, and the Hebei-Chahar council has yielded its authority. My officers and men are ready to serve the Reconstruction Government.\n\nI will bring them to your command and take my place beside you. Let the rebuilding of the north begin.\n\nZhang Xueming"
  PN_XIC.3.a: "Welcome home, brother."
  XIC_young_officers_staff_requirement_tt: "The officers must accept their commissions in the event following §Y$PN_XIC_promote_the_young_officers$§!."
  XIC_xueming_staff_requirement_tt: "Zhang Xueming must return in the reply event following §Y$PN_XIC_Tianjin_to_beiping$§!."
  XIC_young_officers_recruited_tt: "§YHe Zhuguo§! and §YWang Yizhe§! become available as generals and military high command advisors."
  XIC_xueming_letter_sent_tt: "A reply from §YZhang Xueming§! will arrive in §Y14 days§!."
  XIC_xueming_returned_tt: "§YZhang Xueming§! becomes available as a general, Chief of Army and $XIC_mayor_of_tianjin$."
  XIC_aftermath_of_the_eastern_march_2: "$XIC_aftermath_of_the_eastern_march$"
  XIC_aftermath_of_the_eastern_march_2_desc: "Supply routes are reopening and the government has begun to bring scattered workshops back into production. The army still carries the burden of the Eastern March, but a national policy has given the recovery a common direction."
  XIC_national_reconstructionism_2: "$XIC_national_reconstructionism$"
  XIC_national_reconstructionism_2_desc: "Reconstruction has given the movement a record it can place before the nation. Zhang's government is no longer held together by the memory of the march alone: its officials and soldiers now serve a programme of national rebirth."
  XIC_aftermath_of_the_eastern_march_3: "$XIC_aftermath_of_the_eastern_march$"
  XIC_aftermath_of_the_eastern_march_3_desc: "The worst shortages have been overcome. Officials and officers now work to the same reconstruction programme, although damaged workshops and exhausted transport services still need time to recover."
  XIC_national_reconstructionism_3: "$XIC_national_reconstructionism$"
  XIC_national_reconstructionism_3_desc: "The principles of reconstruction are being carried into the schools and youth organisations. A new generation is learning to place national service above provincial allegiance, giving the movement support beyond its founding officer corps."
  XIC_shangdong_army: "The Shangdong Army"
  XIC_shangdong_army_desc: "The army has rallied around the Reconstruction Government. Renewed discipline and regular training are restoring confidence to the infantry and giving our officers a foundation for further reform."
  XIC_shangdong_army_restructured: "$XIC_shangdong_army$"
  XIC_shangdong_army_restructured_desc: "A unified command structure, dependable supply services and coordinated infantry training have transformed the formations that arrived after the march into an army ready for sustained operations."
  XIC_industrial_reconstruction: "Industrial Reconstruction"
  XIC_industrial_reconstruction_desc: "The Reconstruction Government directs investment, materials and labour towards the recovery of Shangdong. Decisions over the burden placed on the countryside will shape the pace and cost of this programme."
  XIC_against_the_central_government: "Against the Central Government"
  XIC_against_the_central_government_desc: "The army is preparing to challenge Nanjing's claim to national authority. Staff work and political preparation are directed towards defeating the central government's forces and bringing the provinces under a single reconstruction programme."
  XIC_anti_japanese_thought: "Anti-Japanese Thought"
  XIC_anti_japanese_thought_desc: "The loss of the northeast has not been forgotten. Officers and soldiers are preparing to fight Japan with the conviction that national reconstruction cannot be complete while Chinese territory remains under foreign domination."
  XIC_the_marshall_of_victory: "The Marshall of Victory"
  XIC_the_marshall_of_victory_desc: "Zhang has turned an army in exile into the armed foundation of a rival national government. His proven leadership strengthens its resolve on the attack and its discipline in defence."
  XIC_the_marshall_of_victory_army: "$XIC_the_marshall_of_victory$"
  XIC_the_marshall_of_victory_army_desc: "$XIC_the_marshall_of_victory_desc$"
  XIC_beijing: "Beijing"
  XIC_german_artillery_bonus: "German Artillery Instruction"
  XIC_german_infantry_bonus: "German Infantry Instruction"
  XIC_jinan_academy_tt: "An event allows us to select §Ytwo different available commanders§!. Each receives §G2 skill levels§!."
  XIC_hebei_chahar_cores_tt: "Gain §Ycores§! on every state annexed from the §YHebei-Chahar Government§!."
  XIC_shanxi_cores_tt: "Gain §Ycores§! on all states owned by or belonging to the §YShanxi Clique§!."
  XIC_china_claims_tt: "Gain §Yclaims on all of China§!, including the warlord territories, Manchuria, Xinjiang, Tibet, Taiwan and foreign concessions, regardless of their current owner."
  XIC_first_council_concluded_tt: "The §YFirst Council§! has concluded."
