  XIC_the_great_leap_forward_economy_tt: "Modify §Y$XIC_national_reconstruction_economy$§! by:\nFactory Output: §G+5.00%§!\nProduction Efficiency Growth: §G+5.00%§!\nProduction Efficiency Cap: §G+5.00%§!"
  XIC_agricultural_research: "Agricultural Modernisation"
  XIC_national_industrial_research: "National Industrial Development"
  XIC_integrated_officer_training: "Integrated Officer Training"
  XIC_integrated_provincial_commands: "Integrated Provincial Commands"
  XIC_integrated_provincial_commands_desc: "Provincial officers have been brought into a common system of instruction and service. Their experience now belongs to the national army, whose standards take precedence over their former allegiances."
  XIC_national_defence_preparations: "National Defence Preparations"
  XIC_national_defence_preparations_desc: "The army is preparing coordinated plans for national defence. Improved staff work and common procedures allow formations raised in different provinces to operate together."
  XIC_anti_japanese_thought_entrenched: "$XIC_anti_japanese_thought$"
  XIC_anti_japanese_thought_entrenched_desc: "Recovery of the occupied northeast has become a national cause. Military preparation, public instruction and the commitment of the returning officers reinforce the army's determination to resist Japan."
  XIC_authority_of_the_uniter: "Authority of the Grand Uniter"
  XIC_authority_of_the_uniter_desc: "The national settlement confirms Zhang's authority without establishing a restored throne. The movement places its claim to rule in reconstruction and national service."
  XIC_constitutional_settlement: "The Constitutional Settlement"
  XIC_constitutional_settlement_desc: "The National State has provided for a ceremonial throne within a written constitutional settlement. Defence, administration and national policy remain under Zhang's government; the crown cannot establish an independent command."
  XIC_restored_national_sovereignty: "Restored National Sovereignty"
  XIC_restored_national_sovereignty_desc: "The restoration of national jurisdiction and the recovery of the northern provinces have given the movement a record beyond its promises. China can now direct reconstruction without accepting the authority of rival governments or foreign concessions."
  XIC_warlord_wargoals_tt: "Gain §YAnnex§! war goals against rival Chinese governments."
  XIC_concessions_demand_tt: "Demand the European concessions. Refusal grants a §Ywar goal§!."
  XIC_fengtian_training_tt: "§YReconstructionist Officers§! gain §G1 skill level§!."
  XIC_entrench_anti_japanese_tt: "Replace the existing §YAnti-Japanese Thought§! spirit with a strengthened version granting:\nAttack against §YJapan§!: §G+20.00%§!\nDefence against §YJapan§!: §G+20.00%§!"
  XIC_constitutional_choice_tt: "The constitutional settlement has been decided."
  XIC_final_unification_wargoals_tt: "Gain §YAnnex§! war goals against §YJapan§! and rival Chinese governments."
  XIC_chinese_commands_integrated_tt: "All Chinese governments are under our authority."
  XIC_northern_provinces_demand_tt: "Claim and demand §YVladivostok§! and §YKhabarovsk§!. Refusal grants a §Ywar goal§!."
  XIC_return_concessions_tt: "Return Chinese territory to §Y[XIC.GetNameDef]§!."
  XIC_return_northern_provinces_tt: "Return §YVladivostok§! and §YKhabarovsk§! to China."
  XIC_korean_reconstruction_tt: "Establish a §YReconstructionist Korean subject§!.\nKorea must accept our offer or be brought under our control."
  XIC_korean_acceptance_tt: "Become a §YReconstructionist subject§! of §Y[XIC.GetNameDef]§!."
  XIC_korean_reconstruction_party: "Korean Reconstruction Movement"
  XIC_korean_reconstruction_party_short: "KRM"
  XIC_sovereignty_restored_tt: "Chinese sovereignty is restored, the northern provinces recovered, and Korea aligned with us."
  PN_XIC.26.t: "The False Emperor of China"
  PN_XIC.26.desc: "Puyi's throne rests upon Japanese protection, but his name still carries weight among those who remember the old dynasty. Zhang's officers disagree over whether that influence should be challenged or turned towards the Reconstruction Government.\n\nWe could offer Puyi ordinary Chinese citizenship in exchange for his public support, or promise him a strictly constitutional throne beneath the authority of the national government. The alternative is to make no approach at all. The terms chosen here will be sent when our preparations for the deal are complete."
  PN_XIC.26.a: "Offer citizenship in return for his support."
  PN_XIC.26.b: "Offer a constitutional throne for his support."
  PN_XIC.27.t: "China Demands the End of the Concessions"
  PN_XIC.27.desc: "An official demand has arrived from Zhang's government. It calls for the restoration of Chinese jurisdiction over the territory we hold in China and the withdrawal of the arrangements that preserve our separate administration.\n\nThe Chinese delegation presents the demand as the conclusion of national reconstruction, rather than a request for another revision of the old privileges. Acceptance would surrender our territorial position. Refusal would leave the dispute unresolved and give Zhang's government a cause for military action."
  PN_XIC.27.a: "Restore Chinese jurisdiction."
  PN_XIC.27.b: "We will retain our position."
  PN_XIC.28.t: "The Concessions Demand Is Refused"
  PN_XIC.28.desc: "[From.GetNameDefCap] has refused to restore Chinese jurisdiction over the territory it holds. Our delegation has returned with a formal rejection of the demand.\n\nThe council has authorised preparations to enforce the claim. Whether the dispute ends at the negotiating table or on the battlefield, foreign administration will no longer be treated as an unquestionable feature of China's political life."
  PN_XIC.28.a: "Prepare to enforce our demand."
  PN_XIC.29.t: "China Demands the Northern Provinces"
  PN_XIC.29.desc: "Zhang's government has presented a demand for the return of Vladivostok and Khabarovsk, where these provinces remain under our authority. Its representatives describe their recovery as the final settlement of a frontier established during China's weakness.\n\nOur government must decide whether to concede the territory or reject the demand. The Chinese delegation has made clear that a refusal will be treated as grounds for further confrontation."
  PN_XIC.29.a: "Concede the disputed provinces."
  PN_XIC.29.b: "Reject the demand."
  PN_XIC.30.t: "The Northern Demand Is Refused"
  PN_XIC.30.desc: "[From.GetNameDefCap] has rejected the demand for the northern provinces. The frontier will not be revised by agreement.\n\nZhang has instructed the army to prepare plans for enforcing the claim. The government must now decide when the strength assembled through national reconstruction can be committed to the northern dispute."
  PN_XIC.30.a: "The claim will stand."
  PN_XIC.31.t: "A Reconstruction Settlement for Korea"
  PN_XIC.31.desc: "An envoy from Zhang's government proposes that Korea adopt its own national reconstruction programme under Chinese protection. The agreement would establish a Reconstruction Movement government and place our foreign and military position beneath Chinese authority.\n\nIts supporters argue that the arrangement would secure investment and protection against renewed Japanese domination. Its opponents answer that Korea would be exchanging independence for a new subordinate position. The decision rests with our government."
  PN_XIC.31.a: "Accept the reconstruction settlement."
  PN_XIC.31.b: "Korea will retain its independence."
  PN_XIC.32.t: "Korea Rejects the Settlement"
  PN_XIC.32.desc: "The Korean government has rejected the proposed reconstruction settlement. It will not accept a subordinate position within our regional programme.\n\nOur envoy has returned, and the council has authorised preparations to impose the settlement if the government chooses to pursue that course."
  PN_XIC.32.a: "Prepare to enforce the settlement."
  PN_XIC.33.t: "The Century Answered"
  PN_XIC.33.desc: "The officers assembled before Zhang remember the movement's beginnings: an army deprived of its homeland, a march sustained by dwindling supplies and a government established in Jinan while rivals claimed the rest of China. The maps before them now record a different position.\n\nRival commands have been brought under national authority. Foreign concessions no longer divide Chinese jurisdiction, the northern provinces have been recovered, and Korea has entered the reconstruction settlement. These victories do not remove the work of government, but they give the National State the means to undertake it on its own terms.\n\nZhang closes the session with an instruction to the council: the strength that recovered sovereignty must now preserve it."
  PN_XIC.33.a: "Let no government squander what has been restored."

  PN_XIC.26.c: "We have no need of his support."
  XIC_puyi_offer_decided_tt: "Our offer to Puyi has been decided."
  XIC_puyi_citizenship_offer_tt: "Offer citizenship, without a throne."
  XIC_puyi_monarchy_offer_tt: "Offer a constitutional throne, subject to Puyi's acceptance."
  XIC_puyi_no_offer_tt: "No letter will be sent."
  XIC_puyi_deal_tt: "Resolve the offer to §YPuyi§!. Only an accepted monarchy offer permits a §Yconstitutional monarchy§!."
  XIC_puyi_uniter_available_tt: "No constitutional monarchy has been agreed."
  XIC_puyi_monarchy_available_tt: "Puyi has accepted our constitutional monarchy offer."
  XIC_puyi_uniter_unlocked_tt: "Unlocks §Y$PN_china_only_needs_the_uniter$§!."
  XIC_puyi_monarchy_unlocked_tt: "Unlocks §Y$PN_china_a_constitutional_monarchy$§!."
  XIC_puyi_accept_offer_tt: "Puyi supports Zhang's government on the offered terms."
  XIC_puyi_reject_offer_tt: "China continues under the §YGrand Uniter§!."
  PN_XIC.35.t: "A Letter from Zhang Xueliang"
  PN_XIC.35.monarchy_desc: "A letter from Zhang Xueliang offers Puyi a constitutional throne in a reconstructed Chinese state. In return, Puyi must publicly support the Reconstruction Government and accept a settlement that leaves Zhang in command of government and the army.\n\nThe proposal promises a Chinese crown free of Japanese patronage, but its authority would be defined by a constitution. We must decide whether to accept these terms or refuse Zhang's approach."
  PN_XIC.35.citizenship_desc: "Zhang Xueliang has written to Puyi with an offer of ordinary Chinese citizenship in return for his public support of the Reconstruction Government. There is no promise of a restored throne: Zhang intends to remain the sole centre of national authority.\n\nAcceptance would recognise the government in exchange for a place in the country as a citizen. Refusal would leave Puyi outside Zhang's national settlement."
  PN_XIC.35.a: "Accept Zhang's terms."
  PN_XIC.35.b: "Refuse his offer."
  PN_XIC.36.t: "Puyi Accepts"
  PN_XIC.36.monarchy_desc: "Our envoy has returned from Manchuria with Puyi's acceptance. He will support the Reconstruction Government in exchange for the constitutional throne offered in Zhang's letter.\n\nThe council can now prepare the settlement. The crown's place will be defined by the constitution, while government and military command remain under Zhang."
  PN_XIC.36.citizenship_desc: "Puyi has accepted the offer of Chinese citizenship and agreed to support the Reconstruction Government. His reply makes no claim to a throne within the new state.\n\nZhang's government will proceed under the Grand Uniter, with Puyi recognised as a citizen rather than a constitutional monarch."
  PN_XIC.36.a: "Prepare the constitutional settlement."
  PN_XIC.36.b: "Welcome his support as a citizen."
  PN_XIC.37.t: "Puyi Refuses"
  PN_XIC.37.desc: "The reply from Manchuria rejects Zhang's offer. Puyi will not support the Reconstruction Government on the terms proposed.\n\nThere will be no constitutional settlement with him. The council will continue its work under the authority of the Grand Uniter."
  PN_XIC.37.a: "China only needs one uniter."
  PN_XIC.38.t: "No Reply from Puyi"
  PN_XIC.38.desc: "There is no longer a government in Manchuria able to return Puyi's answer, or Puyi himself is no longer available to accept our terms. The proposed agreement cannot be concluded.\n\nThe council will proceed without a constitutional throne. National authority remains with the Grand Uniter."
  PN_XIC.38.a: "Then the matter is settled."

  XIC_the_grand_uniter: "The Grand Uniter"
  XIC_the_grand_uniter_desc: "Zhang's supreme command now directs both national defence and reconstruction."
  XIC_xuangtong_emperor: "Xuangtong Emperor"
