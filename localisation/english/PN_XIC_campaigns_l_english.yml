  XIC_japanese_withdrawal_rejected_tt: "Reject the withdrawal terms. The §Ywar continues§!."
  XIC_honour_returning_officers_tt: "Two available §YReconstructionist Officers§! gain §G1 skill level§!."
  XIC_taiwan_refusal_tt: "China gains an §YAnnex§! war goal if diplomatic relations permit."
  XIC_reconstruction_and_victory_research: "The Experience of National Reconstruction"
  XIC_prepared_northern_offensive: "The Northern Operational Plan"
  XIC_prepared_northern_offensive_desc: "The staff has assembled a temporary supply and planning programme for the northern offensive."
  XIC_yalu_crossing_preparations: "The Yalu Crossing Plan"
  XIC_yalu_crossing_preparations_desc: "Engineers and transport officers have prepared the next stage of the advance into Korea."
  XIC_disrupted_continental_supply: "Disrupted Continental Transport"
  XIC_disrupted_continental_supply_desc: "Chinese resistance operations have disrupted deliveries and repair work on the continental transport network."
  XIC_veterans_return_to_work: "Veterans Return to Work"
  XIC_veterans_return_to_work_desc: "The discharge commissions are helping returning soldiers find work in reconstruction. The programme shifts public attention from mobilisation toward civilian life."
  XIC_trained_national_reserve: "A Trained National Reserve"
  XIC_trained_national_reserve_desc: "The government is funding a larger trained reserve while the peacetime administration finds its footing."
  XIC_prepare_provincial_expedition: "Prepare an Expedition Against [From.GetNameDef]"
  XIC_prepare_provincial_expedition_desc: "Assign fifteen command power to a twenty-one-day preparation programme against a neighbouring command that rejected our ultimatum or is already fighting us. The resulting planning and supply programme lasts ninety days."
  XIC_regional_expedition_preparation_tt: "Prepare a §Yregional expedition§! in §Y21 days§!, spending §Y15 command power§!."
  XIC_prepared_provincial_expedition: "A Prepared Regional Expedition"
  XIC_prepared_provincial_expedition_desc: "The staff has committed transport and planning resources to a limited campaign against a resisting provincial command."
  XIC_contest_foreign_backed_command: "Challenge the Foreign-Backed [From.GetName]"
  XIC_contest_foreign_backed_command_desc: "Prepare a formal challenge to a provincial command protected by another power. After fourteen days we gain a war goal. Declaring war may bring its foreign patron or faction into the conflict."
  XIC_foreign_backed_ultimatum_tt: "Gain an §YAnnex§! war goal in §Y14 days§!. Its §Yforeign patron or faction§! may intervene if we declare war."
