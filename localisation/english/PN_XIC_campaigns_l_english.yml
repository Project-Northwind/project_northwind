l_english:
  PN_republic_complete_national_unification: "Complete National Unification"
  PN_republic_complete_national_unification_desc: "The settlement in Nanjing must reach the provincial capitals. Zhang will offer one national command, while Wang sends representatives able to explain what membership of the League means beyond the capital."
  PN_republic_open_provincial_negotiations: "Delegations to the Provinces"
  PN_republic_open_provincial_negotiations_desc: "Civil servants, officers and League representatives will travel together. Governors may enter the national administration directly or accept a temporary autonomous settlement. Refusal will be recorded before the government considers force."
  PN_republic_prepare_regional_expeditions: "Prepare the Regional Expeditions"
  PN_republic_prepare_regional_expeditions_desc: "The council will not promise a peaceful settlement it cannot defend. Supply officers will prepare limited expeditions against commands that reject the national government, with the purpose and resources of each campaign settled in advance."
  PN_republic_end_the_provincial_commands: "End the Provincial Commands"
  PN_republic_end_the_provincial_commands_desc: "Temporary settlements cannot become permanent private armies. Governments that accepted autonomy will be offered integration into national administration; those still resisting must face a common front."
  PN_prepare_the_northern_campaign: "Prepare the Northern Campaign"
  PN_prepare_the_northern_campaign_desc: "Zhang has returned to the maps he carried south. The former Northeastern officers will identify approaches to the old industrial towns and prepare the advance that will finally bring their army home."
  PN_supply_the_reclamation_army: "Supply the Reclamation Army"
  PN_supply_the_reclamation_army_desc: "Orders cannot move ammunition across a broken railway. The government will assign engineers and transport officers to the northern line, giving the reclamation army a supply route it can use after the first victories."
  PN_reclaim_the_manchurian_ports: "Reclaim the Manchurian Ports"
  PN_reclaim_the_manchurian_ports_desc: "Control of Liaotung gives the government access to the arsenals and docks left behind by the occupation. A commission will decide whether recovered equipment should support the next advance or remain with the workshops being restored."
  PN_force_the_yalu_crossing: "Force the Yalu Crossing"
  PN_force_the_yalu_crossing_desc: "Japanese control of Korea leaves the frontier exposed even after the recovery of Manchuria. Preparations must turn toward river crossings, coastal supply and the government that will follow the army into Korea."
  PN_dictate_terms_to_japan: "Dictate Terms to Japan"
  PN_dictate_terms_to_japan_desc: "Once the occupation has been driven from the Chinese mainland and Korea, the government can demand a withdrawal settlement. Japan must surrender its Chinese possessions and abandon its dependent administrations. Rejection leaves the army free to continue the war."
  PN_restore_manchurian_industry: "Restore Manchurian Industry"
  PN_restore_manchurian_industry_desc: "The army has returned to towns whose factories served the occupation. Engineers, former workers and military quartermasters must decide what to repair first, without stripping the region to reward the victorious army."
  PN_return_the_soldiers_home: "Return the Soldiers Home"
  PN_return_the_soldiers_home_desc: "Victory has left families waiting and an army larger than the peacetime treasury can support. The government must settle pensions, preserve a trained reserve and help veterans return to farms and workshops."
  PN_settle_the_taiwan_question: "Settle the Taiwan Question"
  PN_settle_the_taiwan_question_desc: "Taiwan must be included in the national settlement. If the island has already returned, the government will restore its transport network and establish the new administration. Otherwise, the foreign ministry will seek a peaceful transfer from its present owner."
  PN_republic_reopen_the_northern_railways: "Reopen the Northern Railways"
  PN_republic_reopen_the_northern_railways_desc: "A united army needs a route north that can carry grain, ammunition and replacement engines. Engineers will survey the line from Beijing before the first advance into Manchuria."
  PN_republic_support_the_manchurian_resistance: "Contact the Manchurian Resistance"
  PN_republic_support_the_manchurian_resistance_desc: "Men who once served the Northeast know which towns will listen to Zhang. The former revolutionary cadres can carry messages further into the villages. The staff must decide where limited rifles and agents will do the most good."
  PN_republic_begin_the_liberation_campaign: "Begin the Liberation Campaign"
  PN_republic_begin_the_liberation_campaign_desc: "The council has approved the campaign and the staff has prepared its routes. Our immediate objectives are the Manchurian industrial towns and the removal of Japanese command from the mainland. The government will provide the means to bring the campaign to a political conclusion."
  PN_republic_secure_the_manchurian_ports: "Secure the Manchurian Ports"
  PN_republic_secure_the_manchurian_ports_desc: "Control of Liaotung gives the government access to the arsenals and docks left behind by the occupation. A commission will decide whether recovered equipment should support the next advance or remain with the workshops being restored."
  PN_republic_cross_the_yalu: "Cross the Yalu"
  PN_republic_cross_the_yalu_desc: "Japanese control of Korea leaves the frontier exposed even after the recovery of Manchuria. Preparations must turn toward river crossings, coastal supply and the government that will follow the army into Korea."
  PN_republic_offer_a_continental_settlement: "Offer a Continental Settlement"
  PN_republic_offer_a_continental_settlement_desc: "Once the occupation has been driven from the Chinese mainland and Korea, the government can demand a withdrawal settlement. Japan must surrender its Chinese possessions and abandon its dependent administrations. Rejection leaves the army free to continue the war."
  PN_republic_restore_manchurian_industry: "Restore Manchurian Industry"
  PN_republic_restore_manchurian_industry_desc: "The army has returned to towns whose factories served the occupation. Engineers, former workers and military quartermasters must decide what to repair first, without stripping the region to reward the victorious army."
  PN_republic_return_the_soldiers_home: "Return the Soldiers Home"
  PN_republic_return_the_soldiers_home_desc: "Victory has left families waiting and an army larger than the peacetime treasury can support. The government must settle pensions, preserve a trained reserve and help veterans return to farms and workshops."
  PN_republic_settle_the_taiwan_question: "Settle the Taiwan Question"
  PN_republic_settle_the_taiwan_question_desc: "Taiwan must be included in the national settlement. If the island has already returned, the government will restore its transport network and establish the new administration. Otherwise, the foreign ministry will seek a peaceful transfer from its present owner."
  XIC_send_provincial_delegation: "Send a Delegation to [From.GetNameDef]"
  XIC_send_provincial_delegation_desc: "Officers and civilian delegates will spend 30 days negotiating a place for this provincial government in the national settlement. It may agree to direct integration, seek temporary autonomy, or reject the offer."
  XIC_demand_provincial_submission: "Demand the Submission of [From.GetNameDef]"
  XIC_demand_provincial_submission_desc: "Give this provincial command fourteen days to consider submission to Zhang. Acceptance creates a temporary subordinate government; refusal grants a war goal. A Republic delegation must have been rejected before an ultimatum can be issued."
  XIC_integrate_autonomous_province: "Integrate [From.GetNameDef]"
  XIC_integrate_autonomous_province_desc: "Replace the temporary subordinate administration with a national provincial government. The sixty-day settlement transfers the provincial army and its serving officers into national command."
  XIC_secure_campaign_munitions: "Secure Campaign Munitions"
  XIC_secure_campaign_munitions_desc: "Place a single order with the national workshops for rifles and artillery. This order provides a reserve for the northern campaign; it cannot be repeated."
  XIC_repair_the_northern_supply_line: "Prepare the Northern Supply Line"
  XIC_repair_the_northern_supply_line_desc: "A thirty-day contract will improve the route from Jinan to Beijing and supply a small pool of trains and trucks. The work stops if either terminal is lost."
  XIC_joint_staff_exercises: "Conduct Joint Staff Exercises"
  XIC_joint_staff_exercises_desc: "Zhang assigns twenty command power to a single series of exercises. Former Northeastern and revolutionary staff officers will practise the supply and command arrangements needed for a common offensive."
  XIC_form_reserve_columns: "Form National Reserve Columns"
  XIC_form_reserve_columns_desc: "Organise a one-time reserve intake through the former revolutionary cadres. Mobilising these men will disrupt local administration, but place 20,000 recruits at the disposal of the national army."
  XIC_prepare_northern_offensive: "Coordinate the Northern Offensive"
  XIC_prepare_northern_offensive_desc: "Commit twenty command power to a ninety-day operational plan. Its planning and supply benefits are temporary and this preparation can be used only once."
  XIC_arm_manchurian_contacts: "Arm the Manchurian Contacts"
  XIC_arm_manchurian_contacts_desc: "Send 500 rifles to resistance contacts during the war. Their disruption of Japanese transport will last sixty days. This is a single operation, not a permanent reduction in Japanese supply."
  XIC_survey_the_captured_arsenals: "Survey the Captured Arsenals"
  XIC_survey_the_captured_arsenals_desc: "A twenty-one-day inspection of Liaotung will recover material from the abandoned depots. The quartermasters will then ask whether rifles and artillery or transport equipment should be prioritised."
  XIC_prepare_the_yalu_crossings: "Prepare the Yalu Crossings"
  XIC_prepare_the_yalu_crossings_desc: "Assign engineers and twenty command power to the Korean crossing plan. The river-crossing preparation lasts ninety days and can only be ordered once."
  XIC_propose_japanese_withdrawal: "Demand a Japanese Withdrawal"
  XIC_propose_japanese_withdrawal_desc: "Once the occupation is expelled from the Chinese mainland and Korea, send terms to Tokyo. Acceptance returns Japanese-held Chinese territory, including Taiwan, and ends our war with Japan and its dependent commands. Rejection allows the war to continue."
  XIC_request_the_return_of_taiwan: "Negotiate the Return of Taiwan"
  XIC_request_the_return_of_taiwan_desc: "Send a delegation to the current owner of Taiwan. A peaceful transfer will cost a further 50 political power in recognition and administrative concessions. Refusal grants a war goal without declaring war."
  PN_XIC_campaigns.1.t: "The National Delegation Arrives"
  PN_XIC_campaigns.1.desc: "The delegation contains both officers familiar with provincial command and civilian representatives of the new League. Their written offer recognises service already performed by our army, but requires its eventual incorporation into a national chain of command.\n\nOne delegate presents a route to direct integration. Another explains that a temporary autonomous administration would give our officials time to settle accounts and transfer responsibilities. The commander must decide whether these guarantees are worth accepting, or whether the province should continue to stand apart."
  PN_XIC_campaigns.1.a: "Enter the national settlement."
  PN_XIC_campaigns.1.b: "Accept temporary autonomy under the national government."
  PN_XIC_campaigns.1.c: "Our command remains independent."
  PN_XIC_campaigns.2.t: "An Ultimatum From the National Government"
  PN_XIC_campaigns.2.desc: "Zhang has sent a shorter document than the one carried by the earlier delegates. It requires the provincial command to recognise the national government and accept a timetable for integration. The army staff has accompanied it with a warning that the government is preparing an expedition.\n\nSome officers argue that a temporary subordinate administration would preserve the men and institutions of the province. Others insist that submission now would leave them without any influence over their future. There is no third government to which the answer can be referred."
  PN_XIC_campaigns.2.a: "Accept the subordinate administration."
  PN_XIC_campaigns.2.b: "Reject the ultimatum."
  PN_XIC_campaigns.3.t: "The Liaotung Depot Inventory"
  PN_XIC_campaigns.3.desc: "The quartermasters have finished their inspection. Rifles and serviceable artillery have been separated from abandoned stores, while the railway workshops have identified engines, spare parts and repairable trucks.\n\nThe officers preparing the next advance want the weapons delivered immediately. The transport staff asks that the first allocation be used to keep supplies moving beyond the industrial towns. Both can make a case; the recovered material is not enough to satisfy both."
  PN_XIC_campaigns.3.a: "Send the weapons to the front."
  PN_XIC_campaigns.3.b: "Give the transport staff its allocation."
  PN_XIC_campaigns.4.t: "A Provincial Command Joins the Nation"
  PN_XIC_campaigns.4.desc: "The provincial administration has delivered its registers, military accounts and orders transferring its units into national command. The officers who accepted the settlement have been assigned to the national roster rather than dismissed with the old government.\n\nZhang reads the report before passing it to the civilian commission. The agreement must now be honoured in appointments, pay and administration. The disappearance of a provincial border is only the beginning of that work."
  PN_XIC_campaigns.4.a: "Carry the settlement into the province."
  PN_XIC_campaigns.5.t: "Chinese Terms for a Continental Withdrawal"
  PN_XIC_campaigns.5.desc: "The Chinese government has presented terms after the loss of our continental positions. Its demands cover the evacuation of Chinese territory, the abandonment of our dependent military commands and the return of Taiwan. Korea is also included in the withdrawal.\n\nThe naval staff argues that Japan still has the means to continue the war at sea. The ministers considering the army reports ask what further fighting would recover on the mainland, and how long the country should pay for it. Acceptance ends this war with China; it does not settle Japan's other conflicts."
  PN_XIC_campaigns.5.a: "Accept the continental withdrawal."
  PN_XIC_campaigns.5.b: "The war will continue."
  PN_XIC_campaigns.6.t: "Tokyo Rejects the Withdrawal Terms"
  PN_XIC_campaigns.6.desc: "The Japanese reply refuses a continental settlement. The demands concerning the mainland, Korea and Taiwan have been rejected as a single package.\n\nThe foreign ministry has returned the letter to the staff. Our position on the continent remains secure, but the war will continue until Japan accepts a settlement or is defeated outright."
  PN_XIC_campaigns.6.a: "Inform the fleet and the general staff."
  PN_XIC_campaigns.7.t: "The Northeast Returns"
  PN_XIC_campaigns.7.desc: "Orders confirming the withdrawal have reached the former occupation headquarters. The surrender of Chinese possessions is being entered into the state registers, while the armies exchange instructions for ending hostilities.\n\nFor Zhang, the reports contain familiar names: workshops, stations and towns abandoned when his army marched south. There will be no simple return to the world they left. The government now has to decide what the returning soldiers and the people of the recovered provinces can expect from victory."
  PN_XIC_campaigns.7.a: "Record the victory, and begin the work of return."
  PN_XIC_campaigns.7.b: "Recognise the officers who brought the army home."
  PN_XIC_campaigns.8.t: "The Soldiers and Their Families"
  PN_XIC_campaigns.8.desc: "The discharge commissions have received petitions from men who have served through the march, the campaigns in China and the return to the Northeast. Some want their release papers. Others ask whether the army can provide work, land or a place in a permanent reserve.\n\nThe treasury can fund a civilian return programme, or retain a larger trained reserve. Either decision will shape the first months of peace. The officers have been told that the men are entitled to a clear answer."
  PN_XIC_campaigns.8.a: "Fund their return to civilian life."
  PN_XIC_campaigns.8.b: "Maintain a trained national reserve."
  PN_XIC_campaigns.8.c: "Continue ordinary discharge while the situation is reviewed."
  PN_XIC_campaigns.10.t: "A Chinese Delegation Requests Taiwan"
  PN_XIC_campaigns.10.desc: "A delegation from the Chinese government has requested the transfer of Taiwan. Its terms offer recognition of the administrative settlement and compensation for the costs of withdrawal. Refusal will leave a territorial dispute that the Chinese staff is prepared to pursue.\n\nThe decision is whether retaining the island is worth the continuing confrontation with the government now claiming authority over China."
  PN_XIC_campaigns.10.a: "Agree to the peaceful transfer."
  PN_XIC_campaigns.10.b: "Reject the demand."
  PN_XIC_campaigns.11.t: "The Founding Settlement Fulfilled"
  PN_XIC_campaigns.11.desc: "The representatives return to the congress hall with reports from the ministries and the common staff. The former revolutionary cadres have a recognised place in government; the army answers to one command; the League's wings have settled their first social programme.\n\nWang Ming speaks first, recalling the letter that made this meeting possible. Zhang answers that an agreement becomes real when the men who once fought each other carry out the same orders and accept responsibility for the same country. The assembly will now decide which institution receives the next administrative allocation."
  PN_XIC_campaigns.11.a: "Assign the allocation to the common staff."
  PN_XIC_campaigns.11.b: "Assign the allocation to the civilian ministries."
  PN_republic_fulfil_the_founding_settlement: "Fulfil the Founding Settlement"
  PN_republic_fulfil_the_founding_settlement_desc: "The congress, civilian ministries and common staff will report together on the settlement that founded the Republic. Its institutions must now recognise their shared responsibilities before the country can celebrate a lasting national revival."
  PN_republic_reconstruction_and_victory: "Reconstruction and Victory"
  PN_republic_reconstruction_and_victory_desc: "The recovery of sovereignty and the national production programme have reached their common conclusion. The government can now assign the experience of reconstruction to the next generation of industrial development, before the representatives assemble for the final national celebration."
  XIC_national_integration: "National Integration"
  XIC_national_integration_desc: "Provincial governments must find their place within a common national administration. Delegations, submission agreements and military integration will determine how each command enters the new China."
  XIC_campaign_preparations: "Campaign Preparations"
  XIC_campaign_preparations_desc: "The staff prepares supplies, officers and operational plans for the remaining campaigns. Each order commits resources to a particular task."
