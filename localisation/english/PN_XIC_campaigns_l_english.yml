  XIC_provincial_autonomy_tt: "Become an §Yautonomous subject§! of §Y[XIC.GetNameDef]§!, pending national integration."
  XIC_provincial_refusal_tt: "Reject integration. The national government may issue an §Yultimatum§!."
  XIC_provincial_refusal_war_tt: "§Y[XIC.GetNameDef]§! gains an §YAnnex§! war goal against us."
  XIC_northern_rail_contract_tt: "Complete the supply railway and deliver §Y5 trains§! and §Y40 trucks§! in §Y30 days§!."
