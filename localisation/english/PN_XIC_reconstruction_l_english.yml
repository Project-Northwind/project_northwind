l_english:
  XIC_regional_reconstruction: "Regional Reconstruction"
  XIC_regional_reconstruction_desc: "Civil offices, local transport, accounts and livelihoods require practical reconstruction. Only one contract can run at a time. Each civil programme finances one of two alternative allocations; completing either closes its counterpart. Losing ownership or full control of a project state cancels work. Advances already spent are not refunded, but work can be commissioned again after recovery. Matching government mandates return part of some advances immediately. Completed contracts cannot be repeated."
  XIC_reconstruction_free_contract_tt: "No other regional reconstruction contract is in progress."
  XIC_reconstruction_cancel_tt: "Work stops if we lose ownership or full control of any project state. Political Power already spent is not refunded."
  XIC_reconstruction_jinan_qingdao_rail: "Restore the Jinan-Qingdao Railway"
  XIC_reconstruction_jinan_qingdao_rail_desc: "Replace sleepers, clear the sidings and restore the existing Shandong railway to level 2. Five refurbished trains will return to service. This contract takes 60 days and costs 50 Political Power. It can be completed only once."
  XIC_reconstruction_jinan_arsenal: "Inventory the Jinan Arsenal"
  XIC_reconstruction_jinan_arsenal_desc: "A single arsenal contract will recover usable weapons or restore one military factory. The final allocation is decided when the inventory is complete. This contract takes 75 days and costs 60 Political Power. It can be completed only once."
  XIC_reconstruction_shandong_cooperatives: "Register Shandong Village Cooperatives"
  XIC_reconstruction_shandong_cooperatives_desc: "Elected village committees will pool seed purchases and register land-use agreements without collectivising family farms. Improve rural infrastructure by one level, up to level 5. This contract takes 45 days and costs 35 Political Power. It can be completed only once."
  XIC_reconstruction_qingdao_arbitration: "Convene the Qingdao Labour Board"
  XIC_reconstruction_qingdao_arbitration_desc: "Dockworkers, workshop delegates and employers will negotiate wage arrears and binding arbitration. The settlement supports factory output for 180 days. This contract takes 30 days and costs 40 Political Power. It can be completed only once."
  XIC_reconstruction_henan_grain_network: "Reconnect the Henan Grain Depots"
  XIC_reconstruction_henan_grain_network_desc: "Repair depot access roads and return fifty requisitioned lorries to the national stockpile. Improve infrastructure by one level, up to level 5. This contract takes 60 days and costs 50 Political Power. It can be completed only once."
  XIC_reconstruction_xian_farm_machinery: "Organise Xi'an Machinery Cooperatives"
  XIC_reconstruction_xian_farm_machinery_desc: "Shared repair teams and machinery pools will serve individual farms around Xi'an. Improve infrastructure by one level, up to level 5, and support construction for 180 days. This contract takes 75 days and costs 60 Political Power. It can be completed only once."
  XIC_reconstruction_hebei_power_works: "Rehabilitate the Hebei Power and Steel Works"
  XIC_reconstruction_hebei_power_works_desc: "Recommission substations and reopen a small steel supply for the national rail programme. Improve infrastructure by one level, up to level 5, and recover four steel. This contract takes 90 days and costs 75 Political Power. It can be completed only once."
  XIC_reconstruction_shandong_small_producers: "Hear Liang Shuming's Shandong Proposal"
  XIC_reconstruction_shandong_small_producers_desc: "Liang Shuming proposes a civilian reconstruction fund. Decide between Qingdao workshop premises and rural credit and schools after the county survey. This contract takes 45 days and costs 40 Political Power. It can be completed only once."
  XIC_reconstruction_shandong_county_registers: "Rebuild the Shandong County Registers"
  XIC_reconstruction_shandong_county_registers_desc: "Appointed reconstruction commissioners will restore land and tax records. Liang Shuming has submitted a civilian proposal for the funds: town workshops or rural credit and schools. This contract takes 45 days and costs 35 Political Power. It can be completed only once."
  XIC_reconstruction_henan_government_crops: "Establish the Henan Crop Depots"
  XIC_reconstruction_henan_government_crops_desc: "Government purchasing officers will standardise grain receipts and organise reserve depots. Improve infrastructure by one level, up to level 5, and reduce army supply consumption for 180 days. This contract takes 60 days and costs 50 Political Power. It can be completed only once."
  XIC_reconstruction_qingdao_industrial_orders: "Place the Qingdao Industrial Orders"
  XIC_reconstruction_qingdao_industrial_orders_desc: "The ministries will place fixed orders with Qingdao workshops, producing seventy-five support equipment and sustaining factory output for 180 days. This contract creates no additional factories. This contract takes 60 days and costs 60 Political Power. It can be completed only once."
  XIC_reconstruction_liaotung_industry: "Survey the Liaotung Industrial Plant"
  XIC_reconstruction_liaotung_industry_desc: "An engineering commission will recover damaged plant after the Manchurian war. Choose a single civilian factory restoration or rolling stock and repair assistance. This contract takes 90 days and costs 75 Political Power. It can be completed only once. Requires peace to begin."
  XIC_reconstruction_liaoning_veteran_settlement: "Resettle Veterans in Liaoning"
  XIC_reconstruction_liaoning_veteran_settlement_desc: "Match returning soldiers with housing, road work and civilian plots in Liaoning. Improve infrastructure by one level, up to level 5. Settlement registers grant no new cores or military levies. This contract takes 60 days and costs 50 Political Power. It can be completed only once. Requires peace to begin."
  XIC_reconstruction_xian_demobilisation: "Open the Xi'an Demobilisation Office"
  XIC_reconstruction_xian_demobilisation_desc: "Discharge redundant wartime staff, settle pay and return transport to civilian use. For 180 days civilian demand eases, while a smaller share of the population remains available for recruitment. This contract takes 45 days and costs 25 Political Power. It can be completed only once. Requires peace to begin."
  XIC_reconstruction_labour_settlement: "Qingdao Arbitration Settlement"
  XIC_reconstruction_labour_settlement_desc: "Workshop delegates have secured wage settlements and a formal procedure for industrial disputes."
  XIC_reconstruction_machine_cooperatives: "Farm Machinery Pools"
  XIC_reconstruction_machine_cooperatives_desc: "Mechanics and shared tools let farming families improve local roads and workshops."
  XIC_reconstruction_government_depots: "Government Grain Reserves"
  XIC_reconstruction_government_depots_desc: "Registered crop deliveries and government depots reduce wastage in army provisioning."
  XIC_reconstruction_industrial_orders: "Qingdao Ministry Orders"
  XIC_reconstruction_industrial_orders_desc: "A fixed programme of state orders sustains the workshops through reconstruction."
  XIC_reconstruction_manchurian_repair_brigades: "Manchurian Repair Brigades"
  XIC_reconstruction_manchurian_repair_brigades_desc: "Recovered equipment and engineering crews are assigned to the repair backlog."
  XIC_reconstruction_civilian_return: "Return to Civilian Life"
  XIC_reconstruction_civilian_return_desc: "Wartime offices are winding down and families are rebuilding civilian livelihoods. Fewer citizens are available for military service during the transition."
  PN_XIC_reconstruction.1.t: "The Jinan Arsenal Inventory"
  PN_XIC_reconstruction.1.desc: "The arsenal commission has finished sorting the surviving stores. Serviceable rifles and tools could be issued immediately, but the same reserves can instead refit a permanent military workshop. The contract can finance one allocation only."
  PN_XIC_reconstruction.1.a: "Issue the recovered weapons now."
  PN_XIC_reconstruction.1.b: "Refit the arsenal workshop."
  PN_XIC_reconstruction.2.t: "Liang Shuming's County Reconstruction Fund"
  PN_XIC_reconstruction.2.desc: "Liang Shuming has proposed putting the Shandong fund under a civilian board with published accounts. Qingdao artisans seek serviced premises and power connections; rural teachers and credit societies instead ask for village roads, schools and lending registers. The fund can support one programme. Both proposals recognise existing citizenship and land titles."
  PN_XIC_reconstruction.2.a: "Give Qingdao artisans premises and power."
  PN_XIC_reconstruction.2.b: "Fund village credit societies and county schools."
  PN_XIC_reconstruction.3.t: "The Liaotung Engineering Commission"
  PN_XIC_reconstruction.3.desc: "The engineering commission has traced missing machine tools and recovered railway material from wartime depots. Reassembling one civilian plant would absorb the recovered capital. Alternatively, the material could supply a repair brigade and a modest reserve of transport equipment. "
  PN_XIC_reconstruction.3.a: "Reassemble one civilian plant."
  PN_XIC_reconstruction.3.b: "Prioritise rolling stock and the repair backlog."
  XIC_reconstruction_allocation_lost_tt: "The allocation cannot be delivered because its destination is no longer owned and fully controlled by us. "
  XIC_reconstruction_revival_unlock_tt: "Unlocks the Jinan-Qingdao railway contract in Regional Reconstruction."
  XIC_reconstruction_state_plan_unlock_tt: "Unlocks the Jinan-Qingdao railway contract in Regional Reconstruction."
  XIC_reconstruction_cooperatives_unlock_tt: "Unlocks the Shandong village cooperative registration contract."
  XIC_reconstruction_arbitration_unlock_tt: "Unlocks the Qingdao labour arbitration contract."
  XIC_reconstruction_grain_unlock_tt: "Unlocks the Henan grain depot contract."
  XIC_reconstruction_machinery_unlock_tt: "Unlocks the Xi'an farm machinery cooperative contract."
  XIC_reconstruction_power_unlock_tt: "Unlocks the Hebei power and steel contract and the Jinan arsenal inventory."
  XIC_reconstruction_producers_unlock_tt: "Unlocks Liang Shuming's Shandong reconstruction proposal: Qingdao workshops or rural credit and schools."
  XIC_reconstruction_counties_unlock_tt: "Unlocks the Shandong county register contract and its civilian reconstruction proposal."
  XIC_reconstruction_crops_unlock_tt: "Unlocks the Henan government crop depot contract."
  XIC_reconstruction_city_orders_unlock_tt: "Qingdao industrial orders become available after completing New Factories, New China."
  XIC_reconstruction_orders_unlock_tt: "Unlocks the Qingdao industrial order contract and the Jinan arsenal inventory."
  XIC_reconstruction_manchuria_unlock_tt: "Unlocks the single Liaotung industrial restoration contract. Choose one civilian plant or transport equipment and repair brigades."
  XIC_reconstruction_veterans_unlock_tt: "Unlocks veteran resettlement in Liaoning and demobilisation in Xi'an. "
  XIC_reconstruction_programme_open_tt: "No alternative from this programme has already been completed."
  XIC_reconstruction_commission_live_tt: "This contract remains commissioned and has not been cancelled."
  XIC_reconstruction_programme_choice_tt: "Completing this contract permanently closes its alternative. Cancellation leaves the programme open for a new advance."
  XIC_reconstruction_technical_scholarships_research: "Jinan Technical Scholarship Cohort"
  XIC_reconstruction_civil_service_rebate_tt: "Our civilian provincial service administers this contract."
  XIC_reconstruction_district_mandate_rebate_tt: "Territorial delegates or the officer provincial service support this contract."
  XIC_reconstruction_labour_mandate_rebate_tt: "Social delegations or a labour-first budget support this contract."
  XIC_reconstruction_agrarian_mandate_rebate_tt: "The national social bargain gives the countryside budget priority."
  XIC_reconstruction_rural_mandate_rebate_tt: "Territorial delegates or an agrarian-first budget support this contract."
  XIC_reconstruction_local_compacts_rebate_tt: "Provincial governor compacts support this contract."
  XIC_reconstruction_central_commissions_rebate_tt: "Centrally commissioned governors support this contract."
  XIC_reconstruction_industrial_mandate_rebate_tt: "The national social bargain gives labour budget priority."
  XIC_reconstruction_county_civil_service: "Staff the Shandong County Service"
  XIC_reconstruction_county_civil_service_desc: "County clerks will reconcile road budgets, publish schedules and turn League branches into working civil offices. The service supports infrastructure construction for 180 days, while its staff draw on political resources. A civilian provincial service returns 10 Political Power from the advance. The advance is 50 Political Power; work takes 45 days. Complete only one allocation from this programme. Cancellation allows a retry without refunding the advance."
  XIC_reconstruction_district_public_works: "Fund Shandong District Public Works"
  XIC_reconstruction_district_public_works_desc: "Commit the district allocation to access roads rather than a larger clerkship. A civilian factory supplies the works throughout the contract. Shandong gains one infrastructure level, up to level 5; if other works reach that limit first, recover 25 support equipment instead. Territorial representation or an officer provincial service returns 10 Political Power from the advance. The advance is 65 Political Power; work takes 75 days. It reserves one civilian factory until completion or cancellation. Complete only one allocation from this programme. Cancellation allows a retry without refunding the advance."
  XIC_reconstruction_workplace_inspections: "Dispatch the Qingdao Workplace Inspectorate"
  XIC_reconstruction_workplace_inspections_desc: "Worker delegates will inspect machine guards, maintenance records and working hours. Safer routines improve production efficiency growth for 180 days, at the expense of immediate output. Social representation in Congress or a labour-first budget returns 10 Political Power from the advance. The advance is 50 Political Power; work takes 45 days. Complete only one allocation from this programme. Cancellation allows a retry without refunding the advance."
  XIC_reconstruction_wage_arbitration: "Arbitrate the Qingdao Wage Arrears"
  XIC_reconstruction_wage_arbitration_desc: "Give the workplace fund to binding settlements between shop delegates and employers. Settled arrears support factory output for 180 days, while higher household purchasing power increases civilian demand. Social representation in Congress or a labour-first budget returns 10 Political Power from the advance. The advance is 40 Political Power; work takes 30 days. Complete only one allocation from this programme. Cancellation allows a retry without refunding the advance."
  XIC_reconstruction_rural_debt_settlement: "Convene the Henan Rural Debt Boards"
  XIC_reconstruction_rural_debt_settlement_desc: "Tenant representatives and lenders will replace disputed arrears with published repayment schedules. The settlement reduces consumer-goods requirements for 180 days, while administering the boards consumes political resources. An agrarian-first budget returns 10 Political Power from the advance. The advance is 55 Political Power; work takes 45 days. Complete only one allocation from this programme. Cancellation allows a retry without refunding the advance."
  XIC_reconstruction_rural_credit_cooperatives: "Capitalise the Henan Rural Credit Societies"
  XIC_reconstruction_rural_credit_cooperatives_desc: "Guarantee cooperative loans for village roads and produce depots instead of settling old arrears. A civilian factory supplies the works throughout the contract. Henan gains one infrastructure level, up to level 5; if other works reach that limit first, recover 25 support equipment instead. Territorial representation or an agrarian-first budget returns 10 Political Power from the advance. The advance is 65 Political Power; work takes 75 days. It reserves one civilian factory until completion or cancellation. Complete only one allocation from this programme. Cancellation allows a retry without refunding the advance."
  XIC_reconstruction_public_petition_circuit: "Open the Jinan Public Petition Circuit"
  XIC_reconstruction_public_petition_circuit_desc: "A travelling petition office will hear complaints against district officials and report its settlements to the head of state. Public hearings support stability for 180 days, while personal mediation consumes political resources. Provincial governor compacts return 10 Political Power from the advance. The advance is 40 Political Power; work takes 30 days. Complete only one allocation from this programme. Cancellation allows a retry without refunding the advance."
  XIC_reconstruction_prefectural_accounts_audit: "Audit the Jinan Prefectural Accounts"
  XIC_reconstruction_prefectural_accounts_audit_desc: "Use the inspection allocation for treasury auditors instead of a public petition tour. Tracing duplicate requisitions and missing materials supports construction for 180 days, while enforcing the accounts consumes political resources. Centrally commissioned governors return 10 Political Power from the advance. The advance is 55 Political Power; work takes 60 days. Complete only one allocation from this programme. Cancellation allows a retry without refunding the advance."
  XIC_reconstruction_civic_evening_schools: "Open the Jinan Civic Evening Schools"
  XIC_reconstruction_civic_evening_schools_desc: "Teachers will combine practical numeracy, civic instruction and adult literacy in evening classrooms. Wider access to printed instruction supports research for 180 days, while school supplies increase civilian demand. This allocation supports broad instruction rather than a specialist scholarship cohort. The advance is 45 Political Power; work takes 45 days. Complete only one allocation from this programme. Cancellation allows a retry without refunding the advance."
  XIC_reconstruction_technical_scholarships: "Sponsor the Jinan Technical Scholarship Cohort"
  XIC_reconstruction_technical_scholarships_desc: "Reserve the education allocation for engineers, draughtsmen and technical translators. A civilian factory equips their laboratories throughout the contract. The graduating cohort grants one 50% industry research bonus instead of a general evening-school campaign. The advance is 60 Political Power; work takes 75 days. It reserves one civilian factory until completion or cancellation. Complete only one allocation from this programme. Cancellation allows a retry without refunding the advance."
  XIC_reconstruction_industrial_rediscount: "Rediscount the Jinan Industrial Bills"
  XIC_reconstruction_industrial_rediscount_desc: "The reorganised banks will guarantee a fixed portfolio of workshop and civilian-plant orders. A civilian factory is reserved while collateral is checked. On settlement, civilian-factory construction is supported for 180 days, while credit expansion increases consumer-goods requirements. A labour-first budget returns 10 Political Power from the advance. The advance is 75 Political Power; work takes 90 days. It reserves one civilian factory until completion or cancellation. Complete only one allocation from this programme. Cancellation allows a retry without refunding the advance."
  XIC_reconstruction_railway_clearing_credit: "Clear the Shandong Railway and Grain Bills"
  XIC_reconstruction_railway_clearing_credit_desc: "Use the national credit allocation to settle transport suppliers instead of expanding industrial lending. A civilian factory is reserved while the banks reconcile bills. Delivery returns five trains and twenty-five lorries to the stockpile. An agrarian-first budget returns 10 Political Power from the advance. The advance is 65 Political Power; work takes 60 days. It reserves one civilian factory until completion or cancellation. Complete only one allocation from this programme. Cancellation allows a retry without refunding the advance."
  XIC_reconstruction_county_service: "Shandong County Service"
  XIC_reconstruction_county_service_desc: "Published accounts and trained county clerks keep local road programmes moving."
  XIC_reconstruction_workplace_inspectorate: "Qingdao Workplace Inspectorate"
  XIC_reconstruction_workplace_inspectorate_desc: "Regular inspections and maintenance routines improve workshop practice, while safety stoppages reduce immediate output."
  XIC_reconstruction_wage_agreements: "Qingdao Wage Agreements"
  XIC_reconstruction_wage_agreements_desc: "Binding arbitration has settled arrears and restored workshop schedules. Higher wages also increase civilian demand."
  XIC_reconstruction_rural_debt_boards: "Henan Rural Debt Boards"
  XIC_reconstruction_rural_debt_boards_desc: "Published repayment schedules ease the pressure on rural households, while mediators supervise the settlement."
  XIC_reconstruction_petition_circuit: "Jinan Public Petition Circuit"
  XIC_reconstruction_petition_circuit_desc: "Public hearings give households a route to seek redress, drawing the leadership into the work of local mediation."
  XIC_reconstruction_prefectural_auditors: "Jinan Prefectural Auditors"
  XIC_reconstruction_prefectural_auditors_desc: "Treasury auditors recover misallocated construction materials and supervise the prefectural accounts."
  XIC_reconstruction_civic_schools: "Jinan Civic Evening Schools"
  XIC_reconstruction_civic_schools_desc: "Literacy classes and practical instruction spread technical knowledge, while books and classroom supplies draw on civilian production."
  XIC_reconstruction_industrial_credit: "Jinan Industrial Rediscount Window"
  XIC_reconstruction_industrial_credit_desc: "A finite portfolio of guaranteed industrial bills finances civilian expansion, while additional lending raises civilian demand."
