l_english:
  PN_XIC_government.1.t: "Who Speaks for the Republic?"
  PN_XIC_government.1.desc: "The seating plan has become the Congress's first argument. Labour and Agrarian delegates want guaranteed representation for recognised organisations; territorial secretaries demand that the provinces choose their own delegations. Wang Ming taps the list of factory and village associations. 'These people entered the settlement as participants. They cannot be left outside the hall.'\n\nA Northeastern officer asks whether a district with few organised workers is to count for less than an industrial town. Zhang puts down his pen. 'The Congress may debate my government's programme. It will not divide the command of China. Settle the seats, and give it work to do.'"
  PN_XIC_government.1.a: "Reserve seats for labour and agrarian organisations."
  PN_XIC_government.1.a.tt: "Recognised social organisations receive reserved representation; negotiating production agreements occupies the ministries."
  XIC_gov_social_delegations: "Social Delegations"
  XIC_gov_social_delegations_desc: "Recognised social organisations receive reserved representation; negotiating production agreements occupies the ministries. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.1.b: "Let the territorial branches nominate the delegations."
  PN_XIC_government.1.b.tt: "Territorial branches control nominations; provincial bargaining slows national mobilisation."
  XIC_gov_territorial_delegations: "Territorial Delegations"
  XIC_gov_territorial_delegations_desc: "Territorial branches control nominations; provincial bargaining slows national mobilisation. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.2.t: "Six Proposals, One Treasury"
  PN_XIC_government.2.desc: "The Reconstruction and Revolutionary wings have brought rival lists of organisers. Labour asks for inspectors, the Agrarians for village credit, Development for machinery, and National Defence for men and supplies. The secretary has totalled the requests twice. There is no money for all six.\n\nWang Ming proposes a joint civil programme. An officer replies that Japanese divisions will not wait for an inspector's report. Zhang looks from the industrial schedules to the recruiting returns. 'Every wing has its place. None has a private treasury. Tell me which work begins this year.'"
  PN_XIC_government.2.a: "Fund the Labour-Agrarian civil programme."
  PN_XIC_government.2.a.tt: "Labour and Agrarian proposals receive the first appropriation; social services absorb civilian industry."
  XIC_gov_league_social_programme: "League Social Programme"
  XIC_gov_league_social_programme_desc: "Labour and Agrarian proposals receive the first appropriation; social services absorb civilian industry. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.2.b: "Give National Defence and Reconstruction first call."
  PN_XIC_government.2.b.tt: "The defence programme enrols volunteers through national institutions; industrial expansion must wait."
  XIC_gov_league_defence_programme: "League Defence Programme"
  XIC_gov_league_defence_programme_desc: "The defence programme enrols volunteers through national institutions; industrial expansion must wait. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.2.c: "Back Development, with Revolutionary organisers in the workshops."
  PN_XIC_government.2.c.tt: "Development specialists and Revolutionary organisers supervise a common workshop programme; coordination consumes political attention."
  XIC_gov_league_development_programme: "League Development Programme"
  XIC_gov_league_development_programme_desc: "Development specialists and Revolutionary organisers supervise a common workshop programme; coordination consumes political attention. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.3.t: "At the Same Staff Table"
  PN_XIC_government.3.desc: "Northeastern officers have laid out a programme of staff rides, common maps and supply returns. Former Red Army organisers answer with recruiting registers and lessons drawn from moving formations through poor country. Both accept Zhang's supreme command; neither believes the other's methods should define the new army.\n\nWang Ming insists that former revolutionary units must enter the common system in practice. Zhang cuts short an argument over seniority. 'No wing will keep an army. We are choosing the first work of one staff, not deciding which soldiers belong to China.'"
  PN_XIC_government.3.a: "Begin with professional staff practice."
  PN_XIC_government.3.a.tt: "Prioritise professional staff practice for the campaign decisions. Former Red Army integration and completion of the common army remain available."
  XIC_gov_professional_staff_practice: "Professional Staff Practice"
  XIC_gov_professional_staff_practice_desc: "Prioritise professional staff practice for the campaign decisions. Former Red Army integration and completion of the common army remain available. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.3.b: "Begin with the former Red Army mobilisation methods."
  PN_XIC_government.3.b.tt: "Prioritise mass mobilisation for the campaign decisions. Northeastern officer integration and completion of the common army remain available."
  XIC_gov_mass_mobilisation_practice: "Mass Mobilisation Practice"
  XIC_gov_mass_mobilisation_practice_desc: "Prioritise mass mobilisation for the campaign decisions. Northeastern officer integration and completion of the common army remain available. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.4.t: "A Seal Beside the Commission"
  PN_XIC_government.4.desc: "The new provincial offices require names, not another declaration. Wang Ming has assembled teachers, clerks and League organisers for the civil service. The officers propose keeping their experienced administrators at the desks until the new institutions can stand unaided.\n\n'A school cannot wait for permission from divisional headquarters,' Wang says. An officer points out that several of those headquarters still organise the grain deliveries. Zhang examines the appointment lists. 'The governor's seal is a duty to the state. It must never become the property of a regiment.'"
  PN_XIC_government.4.a: "Appoint civilian League administrators."
  PN_XIC_government.4.a.tt: "Civilian administrators take provincial office. This appointment policy is retained for later provincial negotiations."
  XIC_gov_civilian_provincial_service: "Civilian Provincial Service"
  XIC_gov_civilian_provincial_service_desc: "Civilian administrators take provincial office. This appointment policy is retained for later provincial negotiations. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.4.b: "Retain officers as transitional provincial administrators."
  PN_XIC_government.4.b.tt: "Officers temporarily retain provincial desks, leaving fewer instructors with the army. This appointment policy is retained for later provincial negotiations."
  XIC_gov_officer_provincial_service: "Officer Provincial Service"
  XIC_gov_officer_provincial_service_desc: "Officers temporarily retain provincial desks, leaving fewer instructors with the army. This appointment policy is retained for later provincial negotiations. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.5.t: "What Reaches the Uniter's Desk?"
  PN_XIC_government.5.desc: "The new office has inherited a mountain of papers: senior appointments, factory allocations, transport orders and requests for provincial funds. The Reconstructionist officials want the Council to settle routine business under a general warrant. Several officers prefer every important order to carry Zhang's personal signature.\n\n'The provinces obey the Young Marshall,' one of them argues. A civil official opens a ledger of unanswered requests. 'They must also receive their instructions before the harvest.' Zhang studies the pile. 'Final responsibility is mine. That does not make every requisition a question of supreme command.'"
  PN_XIC_government.5.a: "Give the Council a standing administrative warrant."
  PN_XIC_government.5.a.tt: "The Council handles routine reconstruction allocations beneath Zhang's final authority; the standing secretariat requires political resources."
  XIC_gov_council_administrative_warrant: "Council Administrative Warrant"
  XIC_gov_council_administrative_warrant_desc: "The Council handles routine reconstruction allocations beneath Zhang's final authority; the standing secretariat requires political resources. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.5.b: "Reserve disputed allocations for Zhang personally."
  PN_XIC_government.5.b.tt: "Zhang personally arbitrates disputed allocations; orders carry greater authority but reconstruction waits on his desk."
  XIC_gov_personal_arbitration: "Personal Arbitration"
  XIC_gov_personal_arbitration_desc: "Zhang personally arbitrates disputed allocations; orders carry greater authority but reconstruction waits on his desk. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.6.t: "Governors of Reconstruction"
  PN_XIC_government.6.desc: "The provincial reports repeat the same difficulty: a proclamation from Nanjing does not appoint a teacher or repair a grain store. The Reconstruction Movement can send trained officials with national instructions, or commission local notables who already know the district offices.\n\nAn officer recommends men whose loyalty was proved during the march. A provincial clerk replies that loyalty alone will not decipher the county accounts. Zhang marks the report. 'These governors will carry the national programme. They will not raise another provincial army behind it.'"
  PN_XIC_government.6.a: "Send governors with central commissions and travelling staffs."
  PN_XIC_government.6.a.tt: "Centrally commissioned governors standardise provincial supply administration; maintaining travelling staffs consumes political attention."
  XIC_gov_centrally_commissioned_governors: "Centrally Commissioned Governors"
  XIC_gov_centrally_commissioned_governors_desc: "Centrally commissioned governors standardise provincial supply administration; maintaining travelling staffs consumes political attention. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.6.b: "Bind local administrators through provincial compacts."
  PN_XIC_government.6.b.tt: "Local administrators retain discretion over reconstruction contracts; provincial procurement takes resources from national production."
  XIC_gov_provincial_governor_compacts: "Provincial Governor Compacts"
  XIC_gov_provincial_governor_compacts_desc: "Local administrators retain discretion over reconstruction contracts; provincial procurement takes resources from national production. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.7.t: "The First Budget of the Bargain"
  PN_XIC_government.7.desc: "The bargain is signed; its first budget is still blank. Labour delegates ask for safety inspectors and compensation funds. Agrarian representatives bring accounts of rural debt and warn that another recruiting drive will take hands from the fields. Small producers want to know which promises will appear on their tax bills.\n\nWang Ming lays both schedules before Zhang. 'The agreement stands. The question is which obligation we finance first.' An officer asks what remains for the depots. Zhang answers, 'Enough to defend the settlement. But there must be something in that settlement worth defending.'"
  PN_XIC_government.7.a: "Finance labour protection first."
  PN_XIC_government.7.a.tt: "Labour inspection and compensation receive the first budget. The permanent National Social Bargain remains in force."
  XIC_gov_labour_budget_priority: "Labour Budget Priority"
  XIC_gov_labour_budget_priority_desc: "Labour inspection and compensation receive the first budget. The permanent National Social Bargain remains in force. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.7.b: "Put village credit and seasonal deferments first."
  PN_XIC_government.7.b.tt: "Village credit eases civilian supply, while seasonal deferments and rural allocations constrain recruitment and industrial output. The permanent National Social Bargain remains in force."
  XIC_gov_agrarian_budget_priority: "Agrarian Budget Priority"
  XIC_gov_agrarian_budget_priority_desc: "Village credit eases civilian supply, while seasonal deferments and rural allocations constrain recruitment and industrial output. The permanent National Social Bargain remains in force. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.8.t: "Where the First Machinery Goes"
  PN_XIC_government.8.desc: "The Development wing has marked three routes on its map. Jinan's workshops could anchor an industrial programme in the country that sustained the Eastern March. Nanjing's armaments works could give the national government a stronger supply base. The Agrarian delegates instead want roads and power carried into the inland districts before another concentration of machinery in the cities.\n\nWang Ming asks the planners to cost the alternatives. An officer points to the empty spaces in his supply returns. Zhang folds the map along the river. 'We cannot build every promise at once. Choose the first consignment, and record what must wait.'"
  PN_XIC_government.8.a: "Send the first machinery to Jinan."
  PN_XIC_government.8.a.tt: "The first industrial consignment goes to Jinan; civilian consumption carries the cost of fitting out the new workshops."
  XIC_gov_jinan_workshop_investment: "Jinan Workshop Investment"
  XIC_gov_jinan_workshop_investment_desc: "The first industrial consignment goes to Jinan; civilian consumption carries the cost of fitting out the new workshops. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.8.b: "Equip the Nanjing arsenals first."
  PN_XIC_government.8.b.tt: "The first industrial consignment goes to Nanjing; armaments receive machinery intended for civilian expansion."
  XIC_gov_nanjing_arsenal_investment: "Nanjing Arsenal Investment"
  XIC_gov_nanjing_arsenal_investment_desc: "The first industrial consignment goes to Nanjing; armaments receive machinery intended for civilian expansion. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government.8.c: "Begin with inland transport and power connections."
  PN_XIC_government.8.c.tt: "The plan prioritises inland connections through an infrastructure appropriation; new arsenal construction must wait. The appropriation remains usable if either industrial centre is unavailable."
  XIC_gov_inland_transport_priority: "Inland Transport Priority"
  XIC_gov_inland_transport_priority_desc: "The plan prioritises inland connections through an infrastructure appropriation; new arsenal construction must wait. The appropriation remains usable if either industrial centre is unavailable. This appropriation expires; the recorded policy choice remains."
  PN_XIC_government_allocation_lost_tt: "The funds or required provincial capacity are no longer available. No political power is spent and no allocation is made."
